<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>가계부</title>
<style>
:root{--bg:#111114;--card:#1b1b20;--card2:#24242b;--tx:#f2f2f5;--sub:#8b8b96;--line:#2a2a31;--blue:#4c8dff;--red:#ff5a6a;--green:#2fb67c;--amber:#c98a3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:10px 12px}
h2{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.sub{color:var(--sub);font-size:11px}.big{font-size:20px;font-weight:700}.mid{font-size:15px;font-weight:700}
.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--card2)}
.bar i{display:block;height:100%}
.pbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4c8dff,#9b6bff)}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-weight:600;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--blue);border:0;border-radius:8px;padding:6px 12px;font-weight:600;color:#fff}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:#3a2024;color:var(--red)}
.btn.sm{padding:3px 8px;font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#16161aee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{flex:1;text-align:center;padding:7px 0 6px;color:var(--sub);font-size:10px}.nav div b{display:block;font-size:17px;font-weight:400}.nav .on{color:var(--tx)}
.fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--blue);border:0;font-size:24px;color:#fff;box-shadow:0 4px 14px #0008;z-index:6}
.mnav{display:flex;justify-content:center;align-items:center;gap:16px;font-weight:700;font-size:14px;margin-bottom:8px}.mnav span{padding:2px 10px;color:var(--sub);font-size:16px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px;max-height:88vh;overflow:auto}
.sheet label{display:block;font-size:11px;color:var(--sub);margin:8px 0 3px}
.sheet input,.sheet select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:2px}.seg div{flex:1;text-align:center;padding:6px;border-radius:6px;color:var(--sub);font-weight:600}.seg .on{background:var(--blue);color:#fff}
.goal{border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.goal .img{height:150px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end}
.goal .img:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#000c)}
.goal .img>div{position:relative;z-index:1;padding:10px 12px;width:100%}
.pct{font-size:30px;font-weight:800}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.chips span{background:var(--card2);padding:3px 9px;border-radius:12px;white-space:nowrap;color:var(--sub);font-size:11px}.chips .on{background:var(--blue);color:#fff}
.tl{display:grid;grid-template-columns:repeat(31,1fr);gap:1px;margin:4px 0}.tl i{height:14px;border-radius:2px;background:var(--card2);font-style:normal;font-size:8px;text-align:center;color:var(--sub)}.tl i.m{background:var(--amber);color:#fff}.tl i.t{outline:1px solid var(--blue)}
textarea{width:100%;height:150px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px;font:11px/1.5 monospace}
.paid{opacity:.5}
.tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--card2);color:var(--sub)}
.tag.hot{background:#3a2024;color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" onclick="txForm()">＋</button>
<div class="nav" id="nav"></div>
<script>
const KEY='gagyebu_v1';
const OUT=[['선물','🎁','#3b82f6'],['취미·여가','🎮','#1f8a5f'],['이체','💸','#9a6424'],['식비','🍚','#e0645a'],['카페·간식','☕','#b08968'],['보험·세금·기타금융','🧾','#8b7fd6'],['교통·자동차','🚌','#4aa8c9'],['쇼핑','🛍️','#d96fa5'],['편의점·마트·잡화','🏪','#c9b24a'],['의료·건강·피트니스','💊','#59b86d'],['주거·통신','🏠','#6d8bb8'],['기타','📦','#7d7d88']];
const IN=[['급여','💼'],['부수입','🧩'],['용돈','🎀'],['이자·배당','🌱'],['환급·기타','💰']];
const ATYPE=[['현금','💵','#2fb67c'],['통장','🏦','#4c8dff'],['주식','📈','#ff8a4c'],['환테크','💱','#c07af0'],['기타','🧰','#9aa0a6'],['부채','💳','#ff5a6a']];
const CUR=[['USD',1400],['JPY',9.3],['EUR',1500],['CNY',195],['GBP',1750]];
const ocat=n=>OUT.find(x=>x[0]===n)||OUT[OUT.length-1];
const DEF=()=>({assets:[],tx:[],fixed:[],goals:[
 {id:'g1',name:'서울 34평 아파트',emoji:'🏢',target:1500000000,img:''},
 {id:'g2',name:'쉐보레 카마로 컨버터블',emoji:'🏎️',target:70000000,img:''}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF()}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('저장 공간이 부족해요. 사진 크기를 줄이거나 백업 후 정리해 주세요.')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const W=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const big=n=>{const a=Math.abs(n);return a>=1e8?(n/1e8).toFixed(2).replace(/\.?0+$/,'')+'억':a>=1e4?Math.round(n/1e4).toLocaleString()+'만':Math.round(n).toLocaleString()};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DOW='일월화수목금토';
let tab='home',cur=ym(today()),openCat=null,fixedMonthPaid=null;

// ---- 계산
const val=a=>a.type==='환테크'&&a.amt!=null?a.amt*a.rate:a.value;
const totals=()=>{let as=0,debt=0;S.assets.forEach(a=>{const v=val(a);a.type==='부채'?debt+=v:as+=v});return{as,debt,net:as-debt}};
const monthTx=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(l,ty)=>l.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const shiftM=(m,d)=>{const[y,mm]=m.split('-').map(Number);const x=new Date(y,mm-1+d,1);return ym(x)};
const catSum=l=>{const o={};l.filter(t=>t.type==='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const nextDue=day=>{const t=today();let y=t.getFullYear(),m=t.getMonth();let d=new Date(y,m,Math.min(day,dim(y,m)));if(d<t){m++;d=new Date(y,m,Math.min(day,dim(y,m)))}return d};
const dday=d=>Math.round((d-today())/864e5);
const fixedPaid=(f,m)=>f.paid&&f.paid[m];

// ---- 렌더
function render(){
 $('#nav').innerHTML=[['home','🏠','자산'],['tx','📒','내역'],['fixed','📅','고정지출'],['goal','🎯','목표'],['report','📊','리포트']].map(([k,i,n])=>`<div class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><b>${i}</b>${n}</div>`).join('');
 $('#app').innerHTML={home:vHome,tx:vTx,fixed:vFixed,goal:vGoal,report:vReport}[tab]();
}
function stack(items){const t=items.reduce((s,x)=>s+x[0],0)||1;return `<div class="bar">${items.filter(x=>x[0]>0).map(x=>`<i style="width:${x[0]/t*100}%;background:${x[1]}"></i>`).join('')}</div>`}

function vHome(){
 const T=totals(),m=ym(today()),L=monthTx(m);
 const empty=!S.assets.length&&!S.tx.length;
 const groups=ATYPE.map(([n,ic,c])=>({n,ic,c,l:S.assets.filter(a=>a.type===n)})).filter(g=>g.l.length);
 return `${empty?`<div class="card"><div class="mid">👋 처음이시네요</div><div class="sub" style="margin:4px 0 8px">자산과 내역을 직접 입력하거나, 샘플 데이터로 먼저 둘러보세요.</div><button class="btn" onclick="sample()">샘플 데이터 넣기</button></div>`:''}
 <div class="card"><div class="sub">순자산</div><div class="big">${W(T.net)}</div>
 <div class="row sub" style="margin:2px 0 8px"><span>자산 ${W(T.as)}</span><span>·</span><span class="red">부채 ${W(T.debt)}</span></div>
 ${stack(ATYPE.filter(a=>a[0]!=='부채').map(([n,,c])=>[S.assets.filter(a=>a.type===n).reduce((s,a)=>s+val(a),0),c]))}
 <div class="chips" style="margin:8px 0 0">${ATYPE.filter(a=>a[0]!=='부채').map(([n,,c])=>{const v=S.assets.filter(a=>a.type===n).reduce((s,a)=>s+val(a),0);return v?`<span><b class="dot" style="display:inline-block;background:${c};margin-right:4px"></b>${n} ${T.as?Math.round(v/T.as*100):0}%</span>`:''}).join('')}</div></div>
 <div class="grid2"><div class="card"><div class="sub">${+m.slice(5)}월 지출</div><div class="mid red">${W(sum(L,'out'))}</div></div><div class="card"><div class="sub">${+m.slice(5)}월 수입</div><div class="mid blue">${W(sum(L,'in'))}</div></div></div>
 <h2>내 자산 <button class="btn sm" onclick="assetForm()">＋ 추가</button></h2>
 ${groups.map(g=>`<div class="card"><div class="row sp sub"><span>${g.ic} ${g.n}</span><span class="num">${W(g.l.reduce((s,a)=>s+val(a),0))}</span></div>${g.l.map(a=>`<div class="item" onclick="assetForm('${a.id}')"><div class="grow ell">${esc(a.name)}${a.type==='환테크'&&a.amt!=null?`<div class="sub">${a.cur} ${a.amt.toLocaleString()} × ${a.rate.toLocaleString()}원</div>`:''}</div><div class="num ${a.type==='부채'?'red':''}">${a.type==='부채'?'-':''}${W(val(a))}</div></div>`).join('')}</div>`).join('')||'<div class="card sub">등록된 자산이 없어요.</div>'}
 <h2>목표 진행</h2>${S.goals.map(g=>goalMini(g,T.net)).join('')}`;
}
function goalMini(g,net){const p=Math.max(0,Math.min(100,net/g.target*100));return `<div class="card" onclick="tab='goal';render()"><div class="row sp"><span>${g.emoji} ${esc(g.name)}</span><b>${p.toFixed(1)}%</b></div><div class="pbar" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`}

function spark(m){ // 누적 지출 곡선: 이번달 vs 지난달
 const pm=shiftM(m,-1),[y,mm]=m.split('-').map(Number),n=dim(y,mm-1);
 const cum=(mo)=>{const a=Array(n+1).fill(0);monthTx(mo).filter(t=>t.type==='out').forEach(t=>a[+t.date.slice(8)]+=t.amt);for(let i=1;i<=n;i++)a[i]+=a[i-1];return a};
 const a=cum(m),b=cum(pm),mx=Math.max(a[n],b[n],1);
 const isNow=m===ym(today()),last=isNow?today().getDate():n;
 const pts=(arr,to)=>arr.slice(1,to+1).map((v,i)=>`${(i/(n-1)*100).toFixed(1)},${(36-v/mx*34).toFixed(1)}`).join(' ');
 return `<svg viewBox="0 0 100 38" preserveAspectRatio="none" style="width:110px;height:44px"><polyline points="${pts(b,n)}" fill="none" stroke="#555" stroke-width="1.5" vector-effect="non-scaling-stroke"/><polyline points="${pts(a,last)}" fill="none" stroke="#ff5a6a" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function vTx(){
 const L=monthTx(cur),o=sum(L,'out'),i=sum(L,'in'),po=sum(monthTx(shiftM(cur,-1)),'out'),diff=o-po;
 const cs=catSum(L),fx=S.fixed.reduce((s,f)=>s+f.amt,0);
 const days=[...new Set(L.map(t=>t.date))].sort().reverse();
 return `<div class="mnav"><span onclick="cur=shiftM(cur,-1);render()">◀</span>${+cur.slice(5)}월 <small class="sub">${cur.slice(0,4)}</small><span onclick="cur=shiftM(cur,1);render()">▶</span></div>
 <div class="grid2"><div><div class="sub">지출</div><div class="big">${W(o)}</div></div><div><div class="sub">수입</div><div class="big">${W(i)}</div></div></div>
 <div class="card row sp" style="margin-top:10px"><div><div style="font-size:14px;font-weight:700">지난달보다 <span class="${diff>0?'red':'blue'}">${W(Math.abs(diff))}</span> ${diff>0?'더':'덜'} 썼어요</div><div class="sub">━ ${+shiftM(cur,-1).slice(5)}월 &nbsp;<span class="red">━ ${+cur.slice(5)}월</span></div></div>${spark(cur)}</div>
 <h2>카테고리별 소비</h2><div class="card">${stack(cs.map(([n,v])=>[v,ocat(n)[2]]))}
 ${cs.map(([n,v])=>`<div class="item" onclick="openCat=openCat==='${esc(n)}'?null:'${esc(n)}';render()"><span class="dot" style="background:${ocat(n)[2]}"></span><div class="grow">${ocat(n)[1]} ${n}</div><div class="num">${W(v)}</div><span class="sub">${openCat===n?'⌄':'›'}</span></div>${openCat===n?L.filter(t=>t.type==='out'&&t.cat===n).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="row sub" style="padding:3px 0 3px 18px" onclick="event.stopPropagation();txForm('${t.id}')"><span>${t.date.slice(5)}</span><span class="grow ell">${esc(t.memo)}</span><span class="num">${W(t.amt)}</span></div>`).join(''):''}`).join('')||'<div class="sub" style="padding:8px 0">이번 달 지출 내역이 없어요.</div>'}</div>
 <div class="card row sp" onclick="tab='fixed';render()"><div><div class="sub">고정지출 (월)</div><div class="mid">${W(fx)}</div></div><span class="sub">${S.fixed.length}건 ›</span></div>
 <h2>전체 내역</h2>${days.map(d=>{const dt=parse(d),l=L.filter(t=>t.date===d);return `<div class="card"><div class="row sp sub"><span>${+d.slice(8)}일 (${DOW[dt.getDay()]})</span><span>${sum(l,'in')?'<span class="blue">+'+W(sum(l,'in'))+'</span> ':''}${sum(l,'out')?'-'+W(sum(l,'out')):''}</span></div>${l.map(t=>`<div class="item" onclick="txForm('${t.id}')"><div style="font-size:16px">${t.type==='out'?ocat(t.cat)[1]:(IN.find(x=>x[0]===t.cat)||[0,'💰'])[1]}</div><div class="grow"><div class="ell">${esc(t.memo||t.cat)}</div><div class="sub">${t.cat}${t.acct?' · '+esc(t.acct):''}</div></div><div class="num ${t.type==='in'?'blue':''}">${t.type==='in'?'+':'-'}${W(t.amt)}</div></div>`).join('')}</div>`}).join('')||'<div class="card sub">내역이 없어요. ＋ 버튼으로 추가하세요.</div>'}`;
}
function vFixed(){
 const m=ym(today()),list=S.fixed.map(f=>({f,d:nextDue(f.day)})).sort((a,b)=>a.d-b.d);
 const tot=S.fixed.reduce((s,f)=>s+f.amt,0),paid=S.fixed.filter(f=>fixedPaid(f,m)).reduce((s,f)=>s+f.amt,0);
 const td=today().getDate();
 return `<div class="card"><div class="sub">월 고정지출 합계</div><div class="big">${W(tot)}</div><div class="sub">이번 달 이체 완료 ${W(paid)} · 남은 ${W(tot-paid)}</div>
 <div class="tl" style="margin-top:8px">${Array.from({length:31},(_,i)=>`<i class="${S.fixed.some(f=>f.day===i+1)?'m':''} ${i+1===td?'t':''}">${i+1}</i>`).join('')}</div><div class="sub">주황 = 이체일 · 파란 테두리 = 오늘</div></div>
 <h2>이체 일정 <button class="btn sm" onclick="fixedForm()">＋ 추가</button></h2>
 ${list.map(({f,d})=>{const dd=dday(d),p=fixedPaid(f,m);return `<div class="card ${p?'paid':''}"><div class="row"><div style="font-size:18px">${ocat(f.cat)[1]}</div><div class="grow" onclick="fixedForm('${f.id}')"><div class="ell"><b>${esc(f.name)}</b> <span class="tag ${dd<=3&&!p?'hot':''}">${p?'이체완료':dd===0?'오늘':'D-'+dd}</span></div><div class="sub">매월 ${f.day}일 · 다음 ${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})${f.acct?' · '+esc(f.acct):''}</div></div><div style="text-align:right"><div class="num">${W(f.amt)}</div>${p?`<button class="btn g sm" onclick="unpay('${f.id}')">취소</button>`:`<button class="btn sm" onclick="pay('${f.id}')">이체했어요</button>`}</div></div></div>`}).join('')||'<div class="card sub">고정지출을 추가해 보세요. (월세, 통신비, 보험, 구독료 등)</div>'}`;
}
function pay(id){const f=S.fixed.find(x=>x.id===id),t=today(),m=ym(t);const tx={id:uid(),date:ymd(t),type:'out',cat:f.cat,amt:f.amt,memo:f.name+' (고정)',acct:f.acct||''};S.tx.push(tx);f.paid=f.paid||{};f.paid[m]=tx.id;save();render()}
function unpay(id){const f=S.fixed.find(x=>x.id===id),m=ym(today());S.tx=S.tx.filter(t=>t.id!==f.paid[m]);delete f.paid[m];save();render()}

function vGoal(){
 const T=totals();
 return `<div class="sub" style="margin-bottom:8px">달성률 = 순자산 ÷ 목표금액</div>`+S.goals.map(g=>{
 const p=Math.max(0,Math.min(100,T.net/g.target*100)),left=Math.max(0,g.target-T.net);
 return `<div class="goal"><div class="img" style="background-image:${g.img?`url('${g.img.replace(/'/g,'%27')}')`:'linear-gradient(135deg,#1c2b4a,#4a2c5e)'}">${g.img?'':`<div style="position:absolute;top:20px;left:0;right:0;text-align:center;font-size:56px">${g.emoji}</div>`}<div><div class="sub" style="color:#ddd">${g.emoji} ${esc(g.name)}</div><div class="pct">${p.toFixed(1)}<small style="font-size:16px">%</small></div></div></div>
 <div style="padding:10px 12px"><div class="pbar"><i style="width:${p}%"></i></div><div class="row sp" style="margin-top:6px"><span class="sub">현재 ${W(T.net)}</span><span class="sub">목표 ${W(g.target)}</span></div><div class="row sp" style="margin-top:4px"><span>남은 금액 <b>${W(left)}</b></span><button class="btn g sm" onclick="goalForm('${g.id}')">편집</button></div>${avgSave(left)}</div></div>`}).join('')+`<button class="btn g" onclick="goalForm()">＋ 목표 추가</button>`;
}
function avgSave(left){ // 최근 3개월 평균 저축(수입-지출)
 const ms=[1,2,3].map(i=>shiftM(ym(today()),-i)),sv=ms.map(m=>{const l=monthTx(m);return sum(l,'in')-sum(l,'out')});
 const a=sv.reduce((s,x)=>s+x,0)/3;if(!left)return '<div class="green" style="margin-top:4px">🎉 목표 달성!</div>';
 if(a<=0)return `<div class="sub" style="margin-top:4px">최근 3개월 평균 저축이 없어 예상 기간을 계산할 수 없어요.</div>`;
 const mo=Math.ceil(left/a);return `<div class="sub" style="margin-top:4px">최근 3개월 월평균 저축 ${W(a)} 기준 약 ${mo>=12?Math.floor(mo/12)+'년 ':''}${mo%12?mo%12+'개월':''} 후</div>`;
}

function monthChart(n=6){
 const ms=Array.from({length:n},(_,i)=>shiftM(ym(today()),i-n+1)),d=ms.map(m=>{const l=monthTx(m);return[m,sum(l,'in'),sum(l,'out')]});
 const mx=Math.max(...d.flat().filter(x=>typeof x==='number'),1),w=100/n;
 return `<svg viewBox="0 0 300 130" style="width:100%">${[0,.5,1].map(k=>`<line x1="0" x2="300" y1="${100-k*90}" y2="${100-k*90}" stroke="#2a2a31"/>`).join('')}${d.map(([m,i,o],k)=>{const x=k*50+8;return `<rect x="${x}" y="${100-i/mx*90}" width="16" height="${i/mx*90}" rx="2" fill="#4c8dff"/><rect x="${x+18}" y="${100-o/mx*90}" width="16" height="${o/mx*90}" rx="2" fill="#ff5a6a"/><text x="${x+17}" y="114" fill="#8b8b96" font-size="9" text-anchor="middle">${+m.slice(5)}월</text>${i?`<text x="${x+8}" y="${96-i/mx*90}" fill="#8b8b96" font-size="7" text-anchor="middle">${big(i)}</text>`:''}${o?`<text x="${x+26}" y="${96-o/mx*90}" fill="#8b8b96" font-size="7" text-anchor="middle">${big(o)}</text>`:''}`}).join('')}</svg><div class="row sub" style="justify-content:center;gap:14px"><span class="blue">■ 수입</span><span class="red">■ 지출</span></div>`;
}
function weekRange(off=0){const t=today(),dow=(t.getDay()+6)%7;const s=new Date(t);s.setDate(t.getDate()-dow+off*7);const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
const inR=(l,r)=>l.filter(t=>t.date>=ymd(r[0])&&t.date<=ymd(r[1]));
function weekPrompt(){
 const r=weekRange(0),p=weekRange(-1),L=inR(S.tx,r),PL=inR(S.tx,p),T=totals(),m=ym(today()),ML=monthTx(m);
 const cs=catSum(L).slice(0,5).map(([n,v])=>`${n} ${W(v)}`).join(', ')||'없음';
 const up=S.fixed.map(f=>({f,d:nextDue(f.day)})).filter(x=>dday(x.d)<=7).sort((a,b)=>a.d-b.d).map(x=>`${x.f.name} ${W(x.f.amt)} (${x.d.getMonth()+1}/${x.d.getDate()})`).join(', ')||'없음';
 const as=ATYPE.map(([n])=>{const v=S.assets.filter(a=>a.type===n).reduce((s,a)=>s+val(a),0);return v?`${n} ${W(v)}`:''}).filter(Boolean).join(', ')||'없음';
 const big5=L.filter(t=>t.type==='out').sort((a,b)=>b.amt-a.amt).slice(0,3).map(t=>`${t.date.slice(5)} ${t.memo||t.cat} ${W(t.amt)}`).join(', ')||'없음';
 return `당신은 냉철하지만 따뜻한 자산관리 전문가(CFP)입니다. 아래는 제 이번 주 가계 요약입니다. 잘한 점, 문제점, 다음 주 행동 3가지, 자산 배분(주식/환테크/현금/통장) 코멘트, 목표 달성을 앞당길 방법을 구체적인 숫자로 조언해 주세요.

[기간] ${ymd(r[0])} ~ ${ymd(r[1])}
[이번 주] 지출 ${W(sum(L,'out'))} / 수입 ${W(sum(L,'in'))}
[지난주 지출] ${W(sum(PL,'out'))}
[이번 주 지출 상위 카테고리] ${cs}
[큰 지출 TOP3] ${big5}
[이번 달 누적] 지출 ${W(sum(ML,'out'))} / 수입 ${W(sum(ML,'in'))}
[7일 내 고정지출 이체] ${up}
[월 고정지출 합계] ${W(S.fixed.reduce((s,f)=>s+f.amt,0))}
[자산] 순자산 ${W(T.net)} (자산 ${W(T.as)}, 부채 ${W(T.debt)}) — ${as}
[목표] ${S.goals.map(g=>`${g.name} ${(Math.max(0,T.net/g.target*100)).toFixed(1)}% (목표 ${W(g.target)})`).join(' / ')}`;
}
function vReport(){
 const r=weekRange(0),p=weekRange(-1),L=inR(S.tx,r),o=sum(L,'out'),po=sum(inR(S.tx,p),'out'),sunday=today().getDay()===0||today().getDay()===1;
 const rows=Array.from({length:6},(_,i)=>shiftM(ym(today()),-i)).map(m=>{const l=monthTx(m);return`<div class="item sub"><span style="width:44px">${m.slice(2)}</span><span class="grow blue num">${W(sum(l,'in'))}</span><span class="grow red num">${W(sum(l,'out'))}</span><span class="num" style="width:90px;text-align:right">${W(sum(l,'in')-sum(l,'out'))}</span></div>`}).join('');
 return `<h2 style="margin-top:0">월별 수입 · 지출</h2><div class="card">${monthChart(6)}</div><div class="card"><div class="item sub"><span style="width:44px">월</span><span class="grow">수입</span><span class="grow">지출</span><span style="width:90px;text-align:right">저축</span></div>${rows}</div>
 <h2>주간 자산전문가 조언</h2><div class="card">${sunday?'<div class="green" style="margin-bottom:6px">📬 한 주가 끝났어요! 아래 요약을 복사해서 Claude에게 보내 조언을 받으세요.</div>':''}
 <div class="row sp"><span>${r[0].getMonth()+1}/${r[0].getDate()} ~ ${r[1].getMonth()+1}/${r[1].getDate()} 지출</span><b>${W(o)}</b></div><div class="sub">지난주 ${W(po)} 대비 <span class="${o>po?'red':'blue'}">${o>po?'+':'-'}${W(Math.abs(o-po))}</span></div>
 <textarea id="wp" readonly>${esc(weekPrompt())}</textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="copyP()">📋 요약 복사</button><span class="sub">복사 후 Claude 대화창에 붙여넣기</span></div></div>
 <h2>데이터</h2><div class="card row"><button class="btn g sm" onclick="exp()">백업 내보내기</button><button class="btn g sm" onclick="$('#imp').click()">복원</button><button class="btn r sm" onclick="if(confirm('모든 데이터를 삭제할까요?')){S=DEF();save();render()}">초기화</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>`;
}
function copyP(){const t=$('#wp');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>alert('복사됨! Claude에게 붙여넣어 보세요.')).catch(()=>{document.execCommand('copy');alert('복사됨')})}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='gagyebu-'+ymd(today())+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.tx)throw 0;S=d;save();render()}catch(e){alert('올바른 백업 파일이 아니에요')}})}

// ---- 시트(입력 폼)
function sheet(h){const e=document.createElement('div');e.className='sheet-bg';e.innerHTML=`<div class="sheet">${h}</div>`;e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e);return e}
const close=()=>document.querySelector('.sheet-bg')?.remove();
const v=id=>document.getElementById(id).value;
const opts=(l,sel)=>l.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
let txType='out';
function txForm(id){
 const t=S.tx.find(x=>x.id===id)||{date:ymd(today()),type:txType,cat:'',amt:'',memo:'',acct:''};txType=t.type;
 const draw=()=>{const cats=(txType==='out'?OUT.map(x=>x[0]):IN.map(x=>x[0]));
  const el=document.querySelector('.sheet-bg')||sheet('');
  el.firstChild.innerHTML=`<div class="seg"><div class="${txType==='out'?'on':''}" onclick="txType='out';window._d()">지출</div><div class="${txType==='in'?'on':''}" onclick="txType='in';window._d()">수입</div></div>
  <label>금액</label><input id="f_amt" type="number" inputmode="numeric" value="${t.amt}" autofocus>
  <label>분류</label><select id="f_cat">${opts(cats,t.cat||cats[txType==='out'?3:0])}</select>
  <label>날짜</label><input id="f_date" type="date" value="${t.date}">
  <label>내용</label><input id="f_memo" value="${esc(t.memo)}" placeholder="예: 점심, 급여">
  <label>결제수단/계좌</label><input id="f_acct" value="${esc(t.acct)}" placeholder="예: 신한카드, 토스뱅크">
  <div class="row" style="margin-top:12px">${id?`<button class="btn r" onclick="delTx('${id}')">삭제</button>`:''}<button class="btn g grow" onclick="close()">취소</button><button class="btn grow" onclick="saveTx('${id||''}')">저장</button></div>`};
 window._d=()=>{t.amt=v('f_amt');t.memo=v('f_memo');t.acct=v('f_acct');t.date=v('f_date');t.cat='';draw()};
 draw();
}
function saveTx(id){const amt=+v('f_amt');if(!amt)return alert('금액을 입력하세요');
 const o={id:id||uid(),date:v('f_date'),type:txType,cat:v('f_cat'),amt,memo:v('f_memo'),acct:v('f_acct')};
 if(id)S.tx[S.tx.findIndex(x=>x.id===id)]=o;else S.tx.push(o);
 cur=o.date.slice(0,7);save();close();render()}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);S.fixed.forEach(f=>{for(const k in f.paid||{})if(f.paid[k]===id)delete f.paid[k]});save();close();render()}

function assetForm(id){
 const a=S.assets.find(x=>x.id===id)||{type:'통장',name:'',value:'',cur:'USD',amt:'',rate:1400};
 const draw=()=>{const fx=a.type==='환테크';
  const el=document.querySelector('.sheet-bg')||sheet('');
  el.firstChild.innerHTML=`<label>종류</label><select id="a_type" onchange="window._a()">${opts(ATYPE.map(x=>x[0]),a.type)}</select>
  <label>이름</label><input id="a_name" value="${esc(a.name)}" placeholder="예: 삼성전자, 달러 예금, 토스뱅크">
  ${fx?`<label>통화</label><select id="a_cur" onchange="document.getElementById('a_rate').value=({USD:1400,JPY:9.3,EUR:1500,CNY:195,GBP:1750})[this.value]">${opts(CUR.map(x=>x[0]),a.cur)}</select><label>외화 금액</label><input id="a_amt" type="number" step="any" value="${a.amt??''}"><label>환율 (원)</label><input id="a_rate" type="number" step="any" value="${a.rate}"><div class="sub" style="margin-top:4px">환율은 직접 갱신해 주세요.</div>`:`<label>${a.type==='주식'?'평가금액 (원)':a.type==='부채'?'잔액 (원)':'금액 (원)'}</label><input id="a_val" type="number" inputmode="numeric" value="${a.value}">`}
  <div class="row" style="margin-top:12px">${id?`<button class="btn r" onclick="S.assets=S.assets.filter(x=>x.id!=='${id}');save();close();render()">삭제</button>`:''}<button class="btn g grow" onclick="close()">취소</button><button class="btn grow" onclick="saveAsset('${id||''}')">저장</button></div>`};
 window._a=()=>{a.name=v('a_name');a.type=v('a_type');draw()};draw();
}
function saveAsset(id){const type=v('a_type'),name=v('a_name').trim();if(!name)return alert('이름을 입력하세요');
 const o={id:id||uid(),type,name};
 if(type==='환테크'){o.cur=v('a_cur');o.amt=+v('a_amt');o.rate=+v('a_rate')}else o.value=+v('a_val');
 if(id)S.assets[S.assets.findIndex(x=>x.id===id)]=o;else S.assets.push(o);save();close();render()}

function fixedForm(id){
 const f=S.fixed.find(x=>x.id===id)||{name:'',amt:'',day:25,cat:'보험·세금·기타금융',acct:''};
 sheet(`<label>이름</label><input id="x_name" value="${esc(f.name)}" placeholder="예: 월세, 통신비, 보험">
 <label>금액</label><input id="x_amt" type="number" inputmode="numeric" value="${f.amt}">
 <label>매월 이체일 (일)</label><input id="x_day" type="number" min="1" max="31" value="${f.day}">
 <label>분류</label><select id="x_cat">${opts(OUT.map(x=>x[0]),f.cat)}</select>
 <label>출금 계좌/카드</label><input id="x_acct" value="${esc(f.acct)}">
 <div class="row" style="margin-top:12px">${id?`<button class="btn r" onclick="S.fixed=S.fixed.filter(x=>x.id!=='${id}');save();close();render()">삭제</button>`:''}<button class="btn g grow" onclick="close()">취소</button><button class="btn grow" onclick="saveFixed('${id||''}')">저장</button></div>`);
}
function saveFixed(id){const name=v('x_name').trim(),amt=+v('x_amt'),day=Math.min(31,Math.max(1,+v('x_day')||1));if(!name||!amt)return alert('이름과 금액을 입력하세요');
 const old=S.fixed.find(x=>x.id===id),o={id:id||uid(),name,amt,day,cat:v('x_cat'),acct:v('x_acct'),paid:old?.paid||{}};
 if(old)S.fixed[S.fixed.indexOf(old)]=o;else S.fixed.push(o);save();close();render()}

function goalForm(id){
 const g=S.goals.find(x=>x.id===id)||{name:'',emoji:'⭐',target:'',img:''};
 sheet(`<label>목표 이름</label><input id="g_name" value="${esc(g.name)}"><label>이모지</label><input id="g_emoji" value="${esc(g.emoji)}">
 <label>목표 금액 (원)</label><input id="g_target" type="number" inputmode="numeric" value="${g.target}">
 <label>사진 올리기</label><input id="g_file" type="file" accept="image/*" onchange="goalImg(this)">
 <label>또는 사진 주소(URL)</label><input id="g_img" value="${g.img&&!g.img.startsWith('data:')?esc(g.img):''}" placeholder="https://...">
 <div class="row" style="margin-top:12px">${id?`<button class="btn r" onclick="S.goals=S.goals.filter(x=>x.id!=='${id}');save();close();render()">삭제</button>`:''}<button class="btn g grow" onclick="close()">취소</button><button class="btn grow" onclick="saveGoal('${id||''}')">저장</button></div>`);
 window._gi=g.img;
}
function goalImg(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._gi=c.toDataURL('image/jpeg',.75);document.getElementById('g_img').value=''};im.src=URL.createObjectURL(f)}
function saveGoal(id){const target=+v('g_target');if(!v('g_name')||!target)return alert('이름과 금액을 입력하세요');
 const o={id:id||uid(),name:v('g_name'),emoji:v('g_emoji')||'⭐',target,img:v('g_img').trim()||window._gi||''};
 if(id)S.goals[S.goals.findIndex(x=>x.id===id)]=o;else S.goals.push(o);save();close();render()}

function sample(){
 const t=today(),m=ym(t),pm=shiftM(m,-1);
 S.assets=[{id:uid(),type:'통장',name:'급여통장',value:3200000},{id:uid(),type:'현금',name:'비상금',value:500000},{id:uid(),type:'주식',name:'국내 주식',value:8500000},{id:uid(),type:'환테크',name:'달러 예금',cur:'USD',amt:2000,rate:1400},{id:uid(),type:'통장',name:'적금',value:6000000}];
 const T=[[m,3,'out','취미·여가',328096,'게임·여가'],[m,5,'out','선물',338300,'선물'],[m,7,'out','이체',150000,'가족 이체'],[m,9,'out','식비',99800,'식사'],[m,10,'out','카페·간식',52000,'카페'],[m,12,'out','교통·자동차',16900,'교통'],[m,1,'in','급여',736058,'급여'],[pm,5,'out','식비',180000,'식사'],[pm,12,'out','쇼핑',120000,'쇼핑'],[pm,25,'in','급여',2900000,'급여']];
 S.tx=T.map(([mo,d,ty,c,a,me])=>({id:uid(),date:mo+'-'+pad(d),type:ty,cat:c,amt:a,memo:me,acct:''}));
 S.fixed=[{id:uid(),name:'통신비',amt:55000,day:25,cat:'주거·통신',acct:'',paid:{}},{id:uid(),name:'삼성화재 보험',amt:44813,day:20,cat:'보험·세금·기타금융',acct:'',paid:{}},{id:uid(),name:'넷플릭스',amt:17000,day:5,cat:'취미·여가',acct:'',paid:{}}];
 save();render()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
