<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재민이 키우기 : 선택으로 완성하는 인생 시뮬레이션</title>
<meta name="description" content="경기도 양주시에서 자란 7살 재민이를 80살까지. 선택으로 직업과 연봉을 정하고 최종 인생 점수로 평가받는 인생 키우기 게임.">
<style>
:root{--bg:#0f1226;--card:#1a1f3d;--card2:#232a52;--tx:#eef0ff;--mut:#9aa3d6;--ac:#ffd166;--ac2:#6ee7b7;--bad:#ff6b8b;--ok:#6ee7b7;--bd:#2f376b}
:root[data-theme=light]{--bg:#f4f5ff;--card:#fff;--card2:#eceeff;--tx:#1b1f3b;--mut:#5a628f;--ac:#e08a00;--ac2:#0a9e73;--bad:#d6335a;--ok:#0a9e73;--bd:#cdd2f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
header h1{font-size:18px;margin:0;color:var(--ac)}
.tools button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:4px 8px;margin-left:4px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
.hero{display:flex;align-items:center;gap:12px}
.av{font-size:52px;line-height:1;background:var(--card2);border-radius:16px;padding:8px 10px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hero b{font-size:18px}.mut{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.st{font-size:12px}.bar{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--ac2);transition:width .5s}
.bar i.sts{background:var(--bad)}
.money{display:flex;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:999px;padding:3px 10px}
h2{margin:0 0 6px;font-size:18px}
.ev p{margin:6px 0 12px;white-space:pre-line}
.choice,.btn{display:block;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;cursor:pointer;font-family:inherit}
.choice:hover:not([disabled]),.btn:hover{border-color:var(--ac)}
.choice[disabled]{opacity:.4;cursor:not-allowed}
.choice small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.btn.pri{background:var(--ac);color:#1b1500;border:none;text-align:center;font-weight:700}
.btn.c{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2)}
.chip.u{color:var(--ok)}.chip.d{color:var(--bad)}
.tag{display:inline-block;font-size:11px;background:var(--card2);padding:2px 8px;border-radius:999px;margin-right:4px;color:var(--mut)}
.grade{font-size:76px;font-weight:900;text-align:center;color:var(--ac);line-height:1}
.center{text-align:center}
.tl{max-height:260px;overflow:auto;font-size:13px;border-left:2px solid var(--bd);padding-left:10px;margin-top:8px}
.tl div{margin-bottom:6px}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ac);color:#1b1500;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 4px 18px #0006;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
.sbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.sbar span{width:62px}.sbar .bar{flex:1}.sbar b{width:44px;text-align:right}
/* 큰 글씨 */
body{font-size:18px;line-height:1.6}
#app{max-width:640px}
header h1{font-size:22px}
.tools button{font-size:18px;padding:6px 10px}
.hero b{font-size:21px}.mut{font-size:16px}
.st{font-size:16px}.bar{height:9px}
.money{font-size:16px}.pill{padding:4px 12px}
h2{font-size:23px}
.choice,.btn{font-size:18px;padding:15px 16px}
.choice small{font-size:15px}
.chip{font-size:16px;padding:4px 12px}
.tag{font-size:14px}
table{font-size:16px}
.tl{font-size:16px;max-height:340px}
.sbar{font-size:16px}.sbar span{width:78px}.sbar b{width:52px}
.av{font-size:60px}
input[type=text]{font-size:18px}
</style>
</head>
<body>
<div id="app">
<header><h1>🧒 재민이 키우기</h1><div class="tools"><button id="bSnd" title="효과음">🔊</button><button id="bTh" title="테마">🌓</button></div></header>
<main id="main"></main>
</div>
<script>
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const R=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>{m=Math.round(m);const a=Math.abs(m),s=m<0?'-':'';if(a>=10000)return s+(a/10000).toFixed(a>=100000?0:1)+'억';return s+a.toLocaleString()+'만'};
const LB={int:'지능',str:'체력',chr:'인성',cha:'매력',soc:'인맥',hap:'행복',sts:'스트레스',m:'재산',s:'연봉',inv:'투자금'};
const STATS=['int','str','chr','cha','soc'];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ===== sound ===== */
let sndOn=lsGet('jmk_snd',true),AC=null;
function beep(f=520,d=.08,t='sine'){if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const sGood=()=>{beep(660,.09);setTimeout(()=>beep(880,.12),90)},sBad=()=>{beep(220,.16,'sawtooth')},sTap=()=>beep(480,.05);

/* ===== meta (persistent across runs) ===== */
let META=lsGet('jmk_meta',{ranks:[],ach:{},pts:0,runs:0,best:0});
const saveMeta=()=>lsSet('jmk_meta',META);

/* ===== data ===== */
const JOBS={
doctor:{n:'의사',e:'🩺',req:{int:80},edu:3,base:6500,g:.05,st:6,hp:0,ranks:['인턴','전문의','부교수','병원장'],d:'연봉 최상위. 대신 늘 바쁨'},
lawyer:{n:'변호사',e:'⚖️',req:{int:75,chr:35},edu:3,base:6000,g:.05,st:6,hp:0,ranks:['어쏘','파트너','대표변호사'],d:'말빨과 머리의 직업'},
dev:{n:'개발자',e:'💻',req:{int:60},edu:1,base:4800,g:.06,st:4,hp:0,ranks:['주니어','시니어','리드','CTO'],d:'야근하면 버그가 줄긴 함'},
big:{n:'대기업 직원',e:'🏢',req:{int:62,soc:35},edu:2,base:5000,g:.05,st:5,hp:0,ranks:['사원','대리','과장','부장','임원'],d:'승진 사다리 + 구조조정 공포'},
civil:{n:'공무원',e:'📋',req:{int:55},edu:1,base:3400,g:.03,st:1,hp:1,ranks:['9급','7급','5급','국장'],d:'안정이 곧 행복'},
teacher:{n:'교사',e:'🍎',req:{int:55,chr:50},edu:2,base:3600,g:.03,st:2,hp:1,ranks:['교사','부장교사','교감','교장'],d:'제자들이 인생의 보람'},
sme:{n:'중소기업 직원',e:'🏭',req:{},edu:0,base:3000,g:.03,st:4,hp:0,ranks:['사원','대리','과장','이사'],d:'일단 취업! 누구나 가능'},
police:{n:'경찰/소방관',e:'🚒',req:{str:60,chr:55},edu:0,base:3800,g:.035,st:4,hp:1,ranks:['순경','경장','경위','경감'],d:'정의감과 체력'},
chef:{n:'요리사',e:'🍳',req:{str:45,cha:35},edu:0,base:3000,g:.04,st:5,hp:1,ranks:['보조','셰프','총괄셰프','오너셰프'],d:'언젠가 내 가게를'},
farmer:{n:'귀농 농부',e:'🌾',req:{str:50},edu:0,base:2800,g:.02,st:0,hp:2,ranks:['초보농부','숙련농부','농업경영인'],d:'스트레스 제로, 연봉도 제로에 가깝게'},
writer:{n:'웹툰 작가',e:'✏️',req:{int:45,cha:40},edu:0,base:2500,kind:'var',lo:.7,hi:1.45,st:5,hp:1,ranks:['지망생','연재작가','히트작가'],d:'히트하면 인생역전'},
tuber:{n:'유튜버',e:'📹',req:{cha:60,soc:40},edu:0,base:2000,kind:'var',lo:.5,hi:1.8,st:4,hp:1,ranks:['구독자 100명','실버버튼','골드버튼','다이아'],d:'알고리즘의 간택을 기다린다'},
star:{n:'연예인',e:'🎤',req:{cha:85},edu:0,base:4000,kind:'var',lo:.4,hi:2,st:6,hp:1,ranks:['연습생','신인','스타','국민스타'],d:'뜨면 월드스타, 못 뜨면...'},
athlete:{n:'프로 운동선수',e:'🏅',req:{str:80},edu:0,base:5000,kind:'var',lo:.8,hi:1.3,st:4,hp:1,ranks:['신인','주전','에이스','레전드'],d:'전성기는 짧다'},
ceo:{n:'창업가',e:'🚀',req:{soc:45},edu:0,base:1500,kind:'var',lo:.3,hi:2.5,st:7,hp:0,ranks:['예비창업자','스타트업 대표','중견기업 대표','회장'],d:'대박 or 쪽박'},
mp:{n:'국회의원',e:'🏛️',req:{},edu:0,hid:1,base:15000,g:.02,st:4,hp:0,ranks:['초선','재선','다선'],d:''},
none:{n:'백수',e:'🛋️',req:{},edu:0,base:0,g:0,st:-2,hp:0,ranks:['무직'],d:'일단 쉬자. 부모님 눈치는 덤'}
};
const EDU=['고졸','전문대/지방대','일반 대학','명문대'];
const BG={gold:{n:'금수저 가정',e:'💎',m:30000,tx:'부모님이 든든한 지원군'},mid:{n:'평범한 가정',e:'🏠',m:2000,tx:'특별할 것 없는 보통의 출발'},poor:{n:'흙수저 가정',e:'🥔',m:-1500,tx:'학자금 대출과 함께하는 시작'}};
const TRAITS={
genius:{n:'천재 기질',e:'🧠',d:'지능이 오를 때 +30%'},
strongbody:{n:'강골',e:'🦴',d:'나이 들어도 체력이 덜 떨어짐'},
lucky:{n:'행운아',e:'🍀',d:'모든 도전 성공 확률 +5%'},
charming:{n:'인기쟁이',e:'✨',d:'매력·인맥이 오를 때 +30%'},
latebloom:{n:'대기만성',e:'🌱',d:'30살 이후 해마다 능력이 오름'},
frugal:{n:'짠테크 달인',e:'🐷',d:'해마다 저절로 돈이 모임'},
spender:{n:'플렉스 요정',e:'💸',d:'돈은 새지만 행복이 +'},
};
const ARCH=[{n:'공부형',e:'📚',v:[70,40,50,45,45]},{n:'운동형',e:'⚽',v:[40,70,50,45,45]},{n:'인싸형',e:'🎉',v:[40,45,45,60,60]},{n:'올라운더',e:'🎯',v:[52,52,48,48,50]},{n:'착한형',e:'😇',v:[48,45,72,42,43]}];
const FORT=[['대흉','😱',-.05,'오늘은 조심, 또 조심'],['흉','😟',-.025,'사소한 불운이 따라와요'],['평','🙂',0,'평범한 하루'],['길','😄',.025,'작은 행운이 있어요'],['대길','🤩',.05,'오늘은 뭘 해도 잘 풀려요']];
function fortune(){const d=new Date();const seed=d.getFullYear()*10000+d.getMonth()*100+d.getDate();const x=Math.abs(Math.sin(seed*9301+49297)*233280)%1;return FORT[Math.floor(x*5)]}
const DIFF={heal:{n:'힐링',d:'확률 +10%, 스트레스 완화',l:.1,sk:.6},norm:{n:'보통',d:'표준 난이도',l:0,sk:1},hell:{n:'하드',d:'도전 성공률 -8%, 스트레스 ×1.4, 지출 ×1.3',l:-.08,sk:1.4}};

/* ===== achievements ===== */
const net=()=>S.m+S.inv;
const ACH=[
['first','🎒 첫 출근','첫 직장을 가졌다',()=>S.job&&S.job!=='none'],
['mil','🪖 대한민국 육군','군 복무를 마쳤다',()=>S.flags.served],
['heal','🌱 마음 돌보기','힘든 시기를 지나 다시 일어섰다',()=>S.flags.treated&&S.hap>=60],
['elite','🎓 명문대 입학','명문대에 진학했다',()=>S.edu>=3],
['m1','💰 1억 클럽','순자산 1억 달성',()=>net()>=10000],
['m10','🏦 10억 부자','순자산 10억 달성',()=>net()>=100000],
['m100','👑 100억 부자','순자산 100억 달성',()=>net()>=1000000],
['debt','📉 빚쟁이','순자산 -5000만 이하를 찍었다',()=>net()<=-5000],
['wed','💍 결혼','가정을 꾸렸다',()=>S.married],
['kids3','👶 다둥이','자녀 3명',()=>S.kids>=3],
['pet','🐶 집사','반려동물과 함께',()=>S.pet],
['genius','🧠 천재','지능 95 이상',()=>S.int>=95],
['hulk','💪 근육몬스터','체력 95 이상',()=>S.str>=95],
['pop','🤝 인싸','인맥 90 이상',()=>S.soc>=90],
['joy','😊 행복부자','행복 95 이상',()=>S.hap>=95],
['burn','🔥 번아웃','번아웃을 겪었다',()=>S.burn>=1],
['lotto','🎰 로또 당첨','로또 1등!',()=>S.flags.lotto],
['scam','🎣 사기 피해자','사기를 당했다',()=>S.flags.scammed],
['gam','🃏 도박의 늪','도박에 빠졌다',()=>S.flags.gamble],
['rew','⏪ 시간여행자','되감기를 사용했다',()=>S.rewound],
['mp','🏛️ 국회의원','국회의원이 됐다',()=>S.flags.mp],
['star','⭐ 스타','연봉 5억 이상을 찍었다',()=>S.peakS>=50000],
['dad','🏡 화목한 가정','결혼+자녀2+행복70',()=>S.married&&S.kids>=2&&S.hap>=70],
['hermit','🐺 고독한 늑대','인맥 20 이하로 40세 이상',()=>S.soc<=20&&S.age>=40],
['phoenix','🐦‍🔥 불사조','빚더미에서 순자산 1억까지',()=>S.flags.wasDebt&&net()>=10000],
];

/* ===== event helpers ===== */
const EV={};const EVL=[];
const c=(t,fx,m,o)=>Object.assign({t,fx:fx||{},m:m||''},o||{});
const g=(t,p,win,lose,o)=>Object.assign({t,p,win,lose},o||{});
function ev(id,a,b,title,text,choices,o){const e=Object.assign({id,a,b,title,text,choices,w:1},o||{});EV[id]=e;EVL.push(e)}
const Q=(id,title,text,choices,o)=>{const e=Object.assign({id,a:0,b:999,title,text,choices,w:0},o||{});EV[id]=e;return e};

/* --- 어린 시절 --- */
ev('enter',7,7,'🎒 초등학교 입학','경기도 양주시에서 태어난 재민이. 오늘은 동네 초등학교 입학식이다.\n커다란 책가방이 재민이보다 커 보인다. 어떤 학교생활을 하고 싶어?',[
c('📚 공부 열심히 하는 모범생',{int:8,hap:-2,sts:3},'선생님께 칭찬 도장을 한가득 받았다.'),
c('⚽ 운동장에서 뛰어논다',{str:8,soc:3,hap:3},'점심시간마다 땀범벅! 체력이 쑥쑥 큰다.'),
c('🤝 친구부터 사귄다',{soc:8,cha:3,hap:4},'입학 첫날 반 친구 절반과 친구가 됐다.'),
c('🎮 만화책과 게임이 최고',{hap:8,int:-1,cha:1},'행복하긴 한데... 숙제가 쌓여간다.')],{at:7});
ev('homework',7,12,'📝 숙제 vs 게임','숙제는 산더미. 그런데 새로 나온 게임이 너무 하고 싶다.',[
c('숙제부터 끝낸다',{int:4,hap:-2,chr:1},'뿌듯하지만 게임은 짧게 했다.'),
c('게임 먼저!',{hap:6,int:-2},'신나게 놀았다. 숙제는 내일의 재민이가...'),
g('몰래 게임하고 숙제는 대충',.5,[{hap:5,int:-1},'들키지 않았다! 완전범죄!'],[{hap:-5,chr:-2,sts:4},'엄마한테 딱 걸렸다. 폰 압수.'])]);

let S=null,SNAP=null,VIEW='title';
function newState(cand,name,focus,opt){
  const s={name,age:7,v:1,int:cand.v[0],str:cand.v[1],chr:cand.v[2],cha:cand.v[3],soc:cand.v[4],hap:60,sts:10,m:BG[cand.bg].m,inv:0,risk:1,s:0,peakS:0,job:null,rank:0,edu:1,bg:cand.bg,trait:cand.trait,arch:cand.arch,
   married:0,kids:0,pet:0,pension:0,flags:{bg:cand.bg},seen:{},log:[],queue:[],cur:'enter',res:null,rewound:false,burn:0,runAch:{},diff:opt.diff,luck:0,over:null,boost:0,newAch:[]};
  focus.forEach(k=>s[k]=clamp(s[k]+8));
  if(opt.rebirth){const k=Math.min(10,Math.floor(META.pts/4));if(k>0){META.pts-=k*4;saveMeta();STATS.forEach(x=>s[x]=clamp(s[x]+k));s.boost=k}}
  s.luck=opt.fort[2]+DIFF[opt.diff].l+(cand.trait==='lucky'?.05:0);
  s.fort=opt.fort[0];
  s.seen.enter=7;S=s;
  return s;
}

const save=()=>{if(S&&!S.over)lsSet('jmk_save',S)};

  const r=Math.random(),bg=r<.15?'gold':r<.75?'mid':'poor';
  const a=pick(ARCH);const v=a.v.map(x=>x+ri(-4,4));let diff=250-v.reduce((p,q)=>p+q,0);v[ri(0,4)]+=diff;
  return {arch:a.n,ae:a.e,v,bg,trait:pick(Object.keys(TRAITS))};
}

/* ===== effects ===== */
function apply(fx){
  for(const k in fx){let v=fx[k];
    if(STATS.includes(k)||k==='hap'||k==='sts'){
      if(v>0){if(k==='int'&&S.trait==='genius')v*=1.3;if((k==='cha'||k==='soc')&&S.trait==='charming')v*=1.3}
      if(k==='sts')v*=(v>0?DIFF[S.diff].sk:1);
      S[k]=clamp(S[k]+Math.round(v));
    }
    else if(k==='m')S.m+=v;
    else if(k==='s'){S.s=Math.max(0,S.s+v);S.peakS=Math.max(S.peakS,S.s)}
    else if(k==='smul'){S.s=Math.round(S.s*v);S.peakS=Math.max(S.peakS,S.s)}
    else if(k==='inv')S.inv=Math.max(0,S.inv+v);
    else if(k==='invmul')S.inv=Math.round(S.inv*v);
    else if(k==='mmul'){if(S.m>0)S.m=Math.round(S.m*v)}
    else if(k==='risk')S.risk=v;
    else if(k==='job')setJob(v);
    else if(k==='f')v.forEach(x=>S.flags[x]=1);
    else if(k==='uf')v.forEach(x=>delete S.flags[x]);
    else if(k==='q'){if(v)S.queue.push(v)}
    else if(k==='kids')S.kids+=v;
    else if(k==='rank')S.rank=Math.min(S.rank+v,S.job&&JOBS[S.job]?JOBS[S.job].ranks.length-1:0);
    else if(k==='edu'||k==='married'||k==='pet')S[k]=v;
    else if(k==='retire'){S.flags.retired=1;S.pension=Math.round(S.s*.35);S.job='none';S.s=0;S.rank=0}
  }
}
function setJob(id){S.job=id;S.rank=0;const j=JOBS[id];S.s=Math.round(j.base*R(.92,1.08));S.peakS=Math.max(S.peakS,S.s)}
function getChoices(e){return typeof e.choices==='function'?e.choices(S):e.choices}
function getText(e){return typeof e.text==='function'?e.text(S):e.text}

/* ===== time ===== */
function tick(n){
  const j=S.job?JOBS[S.job]:JOBS.none;let income=0;
  if(S.job&&S.job!=='none'){
    if(j.kind==='var'){let lo=j.lo,hi=j.hi;if(S.job==='athlete'&&S.age>=34){lo=.6;hi=.95}
      if(S.job==='tuber'&&S.flags.tuber)lo=.8;
      S.s=Math.round(clamp(S.s*R(lo,hi),S.job==='ceo'?0:600,400000));}
    else S.s=Math.round(S.s*Math.pow(1+j.g,n));
    S.peakS=Math.max(S.peakS,S.s);income=S.s*.5*n;
  }else if(S.flags.retired&&S.age>=60){income=S.pension*.8*n}
  else if(S.age>=(S.bg==='gold'?45:35)){income=-700*n}
  S.m+=income;
  if(S.m>0)S.m*=Math.pow(1.015,n);
  if(S.kids)S.m-=S.kids*450*n*(S.age<60?1:.3);
  if(S.pet)S.m-=60*n;
  if(S.trait==='frugal')S.m+=200*n;
  if(S.trait==='spender'){S.m-=300*n;S.hap=clamp(S.hap+n)}
  if(S.flags.gamble){S.m-=900*n;S.hap=clamp(S.hap-2*n);S.sts=clamp(S.sts+2*n)}
  if(S.inv>0){const rk=S.risk||1;S.inv=Math.max(0,Math.round(S.inv*(1+(R(-.1,.17))*rk*Math.sqrt(n))))}
  S.sts=clamp(S.sts+(j.st*.6-2.2)*n*DIFF[S.diff].sk);
  if(S.age>=40){S.str=clamp(S.str-(S.age>=60?.9:.45)*n*(S.trait==='strongbody'?.5:1))}
  if(S.age>=70)S.int=clamp(S.int-.8*n);
  S.hap=clamp(S.hap+(55-S.hap)*.06*n+(j.hp||0)*.5*n+(S.married?.8*n:0)+(S.pet?.8*n:0)-(S.sts>70?3*n:0)-(net()<0?2*n:0));
  if(S.trait==='latebloom'&&S.age>=30)['int','cha','soc'].forEach(k=>S[k]=clamp(S[k]+.5*n));
  S.s=Math.max(0,S.s);S.str=clamp(S.str);
  if(net()<=-3000)S.flags.wasDebt=1;
  if(S.sts>=100){S.burn++;S.sts=60;S.hap=clamp(S.hap-15);S.str=clamp(S.str-10);S.flags.burnoutNow=1}
}
function checkEnd(){
  if(S.over)return;
  if(S.str<=0)S.over='health';
  else if(S.burn>=3)S.over='karoshi';
  else if(net()<-20000)S.over='bankrupt';
  else if(S.age>=80)S.over='natural';
}
function eligible(){
  return EVL.filter(e=>{
    if(e.w<=0&&!e.at)return false;
    if(S.age<e.a||S.age>e.b)return false;
    if(e.at!=null)return false;
    if(e.fallback)return false;
    const last=S.seen[e.id];
    if(last!=null){if(!e.rep)return false;if(S.age-last<e.rep)return false}
    if(e.once&&last!=null)return false;
    if(e.c&&!e.c(S))return false;
    return true;
  });
}
function chooseEvent(){
  for(const e of EVL){if(e.at!=null&&S.age>=e.at&&!S.seen[e.id]&&S.age<=e.b+(e.id==='retire'?0:3)){S.seen[e.id]=S.age;if(e.c&&!e.c(S))continue;return e.id}}
  const pool=eligible();
  if(!pool.length||Math.random()<.08)return 'quiet';
  const tot=pool.reduce((p,e)=>p+e.w,0);let r=Math.random()*tot;
  for(const e of pool){r-=e.w;if(r<=0)return e.id}
  return pool[0].id;
}
function advance(){
  if(S.over){S.cur=null;return}
  if(S.queue.length){S.cur=S.queue.shift();onEnter();return}
  const n=step();S.age+=n;S.flags.burnoutNow=0;tick(n);checkAch();checkEnd();
  if(S.over){S.cur=null;return}
  S.cur=chooseEvent();S.seen[S.cur]=S.age;onEnter();
}
function onEnter(){const e=EV[S.cur];if(e&&e.pre&&S.flags.exam==null)e.pre(S);S.seen[S.cur]=S.age}

/* ===== achievements ===== */
function checkAch(){ACH.forEach(([id,n,d,f])=>{if(!S.runAch[id]){try{if(f()){S.runAch[id]=1;S.newAch.push(n);if(!META.ach[id]){META.ach[id]=Date.now()}}}catch(e){}}});saveMeta()}

/* ===== choose ===== */
function choose(i){
  const e=EV[S.cur];const chs=getChoices(e);const ch=chs[i];if(!ch||ch.dis)return;
  if(ch.need&&S.m<ch.need)return;
  SNAP=JSON.stringify(S);
  const before={};['int','str','chr','cha','soc','hap','sts','m','s','inv'].forEach(k=>before[k]=S[k]);
  let out,ok=null;
  if(ch.p!=null){const p=clamp(ch.p+S.luck+(ch.k?(S[ch.k]-50)/250:0),.02,.97);ok=Math.random()<p;out=ok?ch.win:ch.lose;out=[out[0],out[1],p]}
  else if(ch.fn){out=ch.fn(S)}
  else out=[ch.fx,ch.m];
  const fx=Object.assign({},out[0]);
  if(S.diff==='hell'&&fx.m<0)fx.m=Math.round(fx.m*1.3);
  apply(fx);
  const d=[];for(const k in before){const dv=Math.round(S[k]-before[k]);if(dv!==0)d.push([k,dv])}
  S.log.push({age:S.age,t:e.title.replace(/^[^\s]+\s/,''),p:ch.t.replace(/[^\p{L}\p{N}\s\-%()+,.!?~]/gu,'').trim()||ch.t,m:out[1],ok});
  S.res={d,m:out[1]||'',ok,p:out[2],t:e.title,pk:ch.t};
  S.cur=null;checkAch();checkEnd();
  ok===false?sBad():sGood();
  save();render();
}

/* ===== score ===== */
function calc(){
  const n=net();
  const wealth=clamp(n/1500,-100,250),inc=Math.min(100,S.peakS/120),hap=S.hap*1.5,abil=(S.int+S.str+S.chr+S.cha+S.soc)/5;
  const fam=Math.min(110,(S.married?35:0)+Math.min(3,S.kids)*18+(S.pet?10:0)+(S.flags.mp?10:0));
  const ach=Math.min(100,Object.keys(S.runAch).length*5);
  const stp=-S.sts*.25;
  let pen=S.over==='bankrupt'?-80:S.over==='health'?-70:S.over==='karoshi'?-90:0;
  const parts=[['재산',wealth,250],['연봉',inc,100],['행복',hap,150],['능력',abil,100],['가족',fam,110],['업적',ach,100],['스트레스',stp,0],['엔딩',pen,0]];
  const total=Math.round(parts.reduce((p,x)=>p+x[1],0));
  const grade=total>=620?'S':total>=500?'A':total>=390?'B':total>=290?'C':total>=190?'D':'F';
  return {total,grade,parts};
}
function ending(){
  const n=net(),jn=S.job&&S.job!=='none'?JOBS[S.job].n:'';
  if(S.over==='bankrupt')return ['💸','빚더미에 앉은 인생','통장은 마이너스. 하지만 재민이는 어딘가에서 또 일어서고 있을 것이다.'];
  if(S.over==='health')return ['🏥','일찍 쓰러진 인생','건강을 챙기지 못했다. 다음엔 꼭 운동을...'];
  if(S.over==='karoshi')return ['🔥','과로로 쓰러진 인생','일만 하다 번아웃이 세 번. 쉬는 것도 능력이다.'];
  const L=[
  [n>=500000,'👑','전설의 재벌','재민 그룹 회장. 이름만 대면 아는 사람이 없는 곳이 없다.'],
  [S.peakS>=150000,'🌟','월드 스타','전 세계가 아는 재민. 연봉 15억 이상의 정점을 찍었다.'],
  [S.flags.mp&&S.soc>=70,'🏛️','국민의 대변인','국회의원으로서 많은 사람의 삶을 바꿨다.'],
  [S.job==='doctor'&&S.rank>=2&&n>=30000,'🩺','존경받는 명의','수많은 생명을 살린 의사 재민.'],
  [S.flags.founder&&n>=100000,'🚀','성공한 창업가','작은 아이디어로 거대한 기업을 만들었다.'],
  [S.flags.lotto,'🎰','로또 인생','인생은 한방! ... 이라지만 그 한방은 진짜였다.'],
  [S.married&&S.kids>=2&&S.hap>=75,'🏡','화목한 가장','돈보다 소중한 가족과 웃음이 가득한 노후.'],
  [S.int>=90,'🧠','천재 학자','평생 연구한 업적이 교과서에 실렸다.'],
  [S.hap>=85&&n<30000,'🍀','가난해도 행복한 철학자','가진 건 없어도 웃음은 부자.'],
  [S.soc>=85,'🤝','인싸의 정점','장례식에 사람이 줄을 서는 사람.'],
  [n>=100000,'💰','자수성가한 부자','젊은 시절의 고생이 결실을 맺었다.'],
  [S.flags.gamble,'🃏','도박의 그림자','평생 따라다닌 도박의 기억이 아프게 남았다.'],
  [!S.married&&S.soc<30,'🐺','고독한 늑대','혼자서도 잘 살았지만 가끔은 외로웠다.'],
  [n<0,'📉','빚에 쫓긴 인생','끝까지 빚과 싸웠다.'],
  [S.job==='none'&&S.peakS===0,'🛋️','전설의 백수','평생 직장 없이 살아낸 의미에서의 달인.'],
  [true,'🙂','평범하지만 소중한 인생','특별하진 않아도 하루하루를 살아낸 재민이.']];
  for(const x of L)if(x[0])return x.slice(1);
}

/* ===== render ===== */
const avatar=()=>{const a=S.age;return a<13?'🧒':a<19?'👦':a<30?'🧑':a<50?'👨':a<65?'🧔':'👴'};
function statBar(k){const v=Math.round(S[k]);return `<div class="st">${LB[k]} <b>${v}</b><div class="bar"><i class="${k==='sts'?'sts':''}" style="width:${v}%"></i></div></div>`}
function header(){
  const j=S.job?JOBS[S.job]:null;

  return `<div class="card"><div class="hero"><div class="av">${avatar()}${j&&S.job!=='none'?`<span style="font-size:22px">${j.e}</span>`:''}</div>
  <div><b>${esc(S.name)} · ${S.age}세</b><div class="mut">${j?`${j.e} ${j.n} · ${j.ranks[S.rank]||''}`:'학생'} ${S.married?'· 💍':''}${S.kids?' · 👶'+S.kids:''}${S.pet?' · 🐾':''}</div>
  <div style="margin-top:4px"><span class="tag">${bg.e} ${bg.n}</span><span class="tag">${tr.e} ${tr.n}</span><span class="tag">🔮 ${S.fort}</span><span class="tag">🔥 하드</span></div></div></div>
  <div class="stats">${STATS.concat(['hap','sts']).map(statBar).join('')}</div>
  <div class="money"><span class="pill">💰 재산 ${fmt(S.m)}</span>${S.inv>0?`<span class="pill">📈 투자 ${fmt(S.inv)}</span>`:''}<span class="pill">💼 연봉 ${fmt(S.s)}</span><span class="pill">🎓 ${EDU[S.edu]}</span></div></div>`;
}
function render(){
  const m=$('#main');
  if(!S||VIEW==='title'){return title()}
  if(VIEW==='info'){return info()}
  if(VIEW==='rank'){return rankView()}

  let h=header();
  if(S.newAch.length){h+=`<div class="card" style="border-color:var(--ac)">🏆 업적 달성: ${S.newAch.join(', ')}</div>`;S.newAch=[]}
  if(S.res){
    const r=S.res;
    h+=`<div class="card ev"><h2>${r.t}</h2><p><span class="tag">${esc(r.pk)}</span></p><p>${r.ok===true?'✅ 성공! ':r.ok===false?'❌ 실패... ':''}${esc(r.m)}</p>
    ${r.p!=null?`<div class="mut">성공 확률 ${Math.round(r.p*100)}%</div>`:''}
    <div class="chips">${r.d.map(([k,v])=>{const good=k==='sts'?v<0:v>0;return `<span class="chip ${good?'u':'d'}">${LB[k]} ${v>0?'+':''}${k==='m'||k==='s'||k==='inv'?fmt(v):v}</span>`}).join('')}</div>
    <button class="btn pri" id="next">${S.over?'🏁 인생 결과 보기':S.queue.length?'계속 ▶':'다음 해로 ▶'}</button>
    ${!S.rewound&&SNAP?`<button class="btn c" id="rew">⏪ 과거로 돌아가기 (1회)</button>`:''}</div>`;
  }else if(S.cur){
    const e=EV[S.cur],chs=getChoices(e);
    h+=`<div class="card ev"><h2>${e.title}</h2><p>${esc(getText(e))}</p>`;
    chs.forEach((ch,i)=>{const dis=ch.dis||(ch.need&&S.m<ch.need);
      h+=`<button class="choice" data-i="${i}" ${dis?'disabled':''}>${i+1}. ${ch.t}${ch.p!=null?` <small>🎲 도전 · 성공률 약 ${Math.round(clamp(ch.p+S.luck+(ch.k?(S[ch.k]-50)/250:0),.02,.97)*100)}%</small>`:''}${ch.d?`<small>${ch.d}</small>`:''}${ch.need&&S.m<ch.need?`<small>💸 ${fmt(ch.need)} 필요</small>`:''}</button>`});
    h+=`</div>`;
  }
  h+=`<div class="row"><button class="btn c" id="bSave">💾 저장 내보내기</button><button class="btn c" id="bLoad">📂 저장 불러오기</button><button class="btn c" id="bHome">🏠 처음으로</button></div>`;
  m.innerHTML=h;
  m.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{sTap();choose(+b.dataset.i)});
  const nx=$('#next');if(nx)nx.onclick=()=>{sTap();S.res=null;SNAP=SNAP;if(S.over){S.cur=null;render();return}advance();if(S.over)S.res=null;save();render()};
  const rw=$('#rew');if(rw)rw.onclick=()=>{S=JSON.parse(SNAP);S.rewound=true;S.runAch.rew=1;S.newAch.push('⏪ 시간여행자');META.ach.rew=META.ach.rew||Date.now();saveMeta();SNAP=null;beep(300,.2);save();render()};
  $('#bSave').onclick=exportSave;$('#bLoad').onclick=importSave;$('#bHome').onclick=()=>{VIEW='title';render()};
  window.scrollTo(0,0);
}
function endView(){
  const sc=calc(),en=ending();
  if(!S.done){S.done=1;META.runs++;META.pts+=Math.floor(sc.total/40)+1;META.best=Math.max(META.best,sc.total);
    META.ranks.push({name:S.name,score:sc.total,grade:sc.grade,title:en[1],age:S.age,job:S.job?JOBS[S.job].n:'-',net:Math.round(net()),d:new Date().toLocaleDateString('ko-KR')});
    META.ranks.sort((a,b)=>b.score-a.score);META.ranks=META.ranks.slice(0,20);checkAch();saveMeta();try{localStorage.removeItem('jmk_save')}catch(e){}}

  $('#main').innerHTML=`<div class="card center"><div class="mut">최종 인생 점수</div><div class="grade">${sc.grade}</div><h2>${sc.total}점</h2>

  <div class="mut" style="margin-top:6px">${S.over&&S.over!=='natural'?'⚠️ 조기 종료 엔딩 (페널티 적용)':'80세까지 완주!'} · 환생 포인트 보유 ${META.pts}</div></div>
  <div class="card"><b>🏆 이번 인생의 업적 (${ach.length})</b><p class="mut">${ach.join(' · ')||'없음'}</p></div>
  <div class="card"><b>📖 인생 이야기</b><div class="tl">${S.log.map(l=>`<div><b>${l.age}세</b> ${esc(l.t)} — ${esc(l.p)}${l.ok===true?' ✅':l.ok===false?' ❌':''}<br><span class="mut">${esc(l.m)}</span></div>`).join('')}</div></div>
  <button class="btn pri" id="again">🔄 다시 키우기 (환생)</button>
  <div class="row"><button class="btn c" id="shr">📋 결과 복사/공유</button><button class="btn c" id="rk">🏅 랭킹 보기</button></div>`;
  $('#again').onclick=()=>{S=null;VIEW='create';create()};
  $('#shr').onclick=()=>{try{navigator.clipboard.writeText(share);toast('복사했어요!')}catch(e){prompt('복사하세요',share)}};
  $('#rk').onclick=()=>{VIEW='rank';rankView()};
}
function rankView(){
  const rk=META.ranks;
  $('#main').innerHTML=`<div class="card"><h2>🏅 내 기기 랭킹 TOP ${rk.length}</h2>${rk.length?`<table><tr><th>#</th><th>이름</th><th>점수</th><th>등급</th><th>엔딩</th></tr>${rk.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.grade}</td><td>${esc(r.title)}</td></tr>`).join('')}</table>`:'<p class="mut">아직 기록이 없어요. 한 번 키워보세요!</p>'}
  <div class="mut" style="margin-top:8px">플레이 ${META.runs}회 · 최고 ${META.best}점 · 업적 ${Object.keys(META.ach).length}/${ACH.length}</div></div>
  <div class="card"><b>🏆 업적 도감</b>${ACH.map(a=>`<div style="margin:4px 0;opacity:${META.ach[a[0]]?1:.4}">${META.ach[a[0]]?a[1]:'❓ ???'} <span class="mut">${META.ach[a[0]]?a[2]:'조건 비공개'}</span></div>`).join('')}</div>
  <button class="btn pri" id="back">◀ 돌아가기</button>`;
  $('#back').onclick=()=>{VIEW=S&&S.over?'play':'title';render()};
}
const FEATURES=['시작 후보 3명 중 선택(스타일별 능력 분배)','집중 육성 능력치 2개','태어난 집안(금수저/평범/흙수저)','숨은 재능 7종(천재, 강골, 행운아 등)','오늘의 운세(날짜별 확률 보정)','하드 난이도 고정(성공률 -8%, 스트레스 ×1.4, 지출 ×1.3)','환생 포인트로 능력치 보너스','7~80세 나이별 아바타 변화','시즌(해)마다 스트레스·행복 자동 변동','확률 도전 선택지(성공률 표시)','능력치에 따른 성공률 보정','학원/동아리/연애 등 성장기 이벤트 15종','수능 결과 → 대학 선택 → 재수','군대 이벤트(카투사 도전)','직업 16종 + 능력·학력 요건 잠금','입사 연봉 협상 미니게임','정기 연봉 협상(성과/이직 카드)','승진 심사와 직급 체계','이직 제안','갑질 상사/구조조정','가변 소득 직업(유튜버·연예인·창업가 등)','운동선수 전성기·은퇴 기로','부업 이벤트','주식/코인 투자(변동성 시뮬)','경제 위기·대세상승장 이벤트','내 집 마련(영끌)','로또(2% 당첨)','보이스피싱','빚보증 / 사촌의 투자 권유','도박 중독과 단도박 이벤트','창업 대박 아이디어','유튜브 채널 개설','국회의원 출마(히든 루트)','소개팅 → 연애 → 프러포즈 → 결혼','자녀 시스템과 육아·입시','이혼 위기','반려동물 입양','여행/취미/동창회 이벤트','건강검진·큰 병·교통사고','번아웃 3회 시 과로 엔딩','유산 상속','부모님 간병','정년퇴임과 연금','손주 탄생','마지막 선택(기부/가족/탕진)','24개 업적과 도감','엔딩 칭호 16종(성공·평범·망한 인생)','과거로 돌아가기(되감기 1회)','결과 점수 항목별 그래프','인생 이야기 타임라인','로컬 랭킹 TOP20','결과 공유 텍스트 복사','자동 저장·이어하기·파일 내보내기/가져오기','효과음 & 라이트/다크 테마','키보드 단축키(1~4, Enter)','실명 친구 4인(이진호·이찬호·김경연·박세민) 사귐/거절 이벤트와 후속 이벤트','친구 둘 이상 사귀면 사총사 모임 발생','신천지 포교 → 탈퇴 시도 연계 이벤트','암웨이(다단계) 가입 → 재고 처리 연계 이벤트','여자친구를 따라 부산으로 이사 이벤트','인형뽑기·코인노래방·UFO·점집·치킨집·헬스장 등 소소한 선택지','군 복무 연쇄 이벤트(훈련소→자대→중반→전역)','군 적응 위기 시 도움 요청 선택지와 상담전화 안내','의가사 전역 루트와 전역 후 마음 돌보기 이벤트','경기도 양주시 배경 이벤트(덕정역 출퇴근·나리공원·불곡산·별산대놀이·장흥·옥정/회천 신도시)','기분 좋아서 쏘다가 지갑 털리는 이벤트(하프갤런·피자·치킨)','몸개그 해프닝(오이고추 가방·소시지·날달걀·비치발리볼·방귀)','화상 흉터 이벤트(컵라면·치킨 튀김 알바)','전범수와의 말싸움 이벤트','같은 반 친구와 눈 마주치는 순한 짝사랑 이벤트','일상 코미디 이벤트 2탄 18종(종점 버스·배달 오배송·폰 분실·길거리 캐스팅·결혼식·캠핑·당근마켓·다이어트·바퀴벌레·방송 사고·돼지꿈 등)'];
function info(){
  $('#main').innerHTML=`<div class="card"><h2>✨ 추가된 재미 요소 ${FEATURES.length}가지</h2><ol style="padding-left:18px;font-size:14px">${FEATURES.map(f=>`<li>${f}</li>`).join('')}</ol></div><button class="btn pri" id="back">◀ 돌아가기</button>`;
  $('#back').onclick=()=>{VIEW='title';render()};
}
function title(){
  const sv=lsGet('jmk_save',null),f=fortune();
  $('#main').innerHTML=`<div class="card center"><div style="font-size:64px">🧒➡️👴</div><h2>재민이 키우기</h2>
  <p class="mut">📍 대한민국 경기도 양주시 · 7살 재민이의 선택이 80살의 인생을 만든다.<br>직업도, 연봉도, 점수도 모두 당신의 선택!</p>
  <p>🔮 오늘의 운세: <b>${f[0]}</b> ${f[1]}<br><span class="mut">${f[3]}</span></p></div>
  <button class="btn pri" id="nw">🎮 새 인생 시작</button>
  ${sv&&sv.v?`<button class="btn" id="cont">▶ 이어하기 (${esc(sv.name)} · ${sv.age}세)</button>`:''}
  <div class="row"><button class="btn c" id="rk">🏅 랭킹/업적</button><button class="btn c" id="inf">✨ 재미 요소</button></div>
  <div class="row"><button class="btn c" id="ld">📂 저장 불러오기</button></div>`;
  $('#nw').onclick=()=>{VIEW='create';create()};
  const ct=$('#cont');if(ct)ct.onclick=()=>{S=sv;S.diff='hell';VIEW='play';SNAP=null;render()};
  $('#rk').onclick=()=>{VIEW='rank';rankView()};$('#inf').onclick=()=>{VIEW='info';info()};$('#ld').onclick=importSave;
}
let CANDS=[],CSEL=0,FOC=[],DF='hell',REB=false,NM='재민',REROLL=2;
function create(){
  if(!CANDS.length||CANDS.length!==3)CANDS=[pickCand(),pickCand(),pickCand()];
  const f=fortune(),pts=META.pts,k=Math.min(10,Math.floor(pts/4));
  $('#main').innerHTML=`<div class="card"><h2>🧬 재민이 만들기</h2><div class="mut">이름</div><input type="text" id="nm" maxlength="8" value="${esc(NM)}">
  <p class="mut" style="margin-top:12px">후보를 고르세요. 능력 합계는 모두 비슷하지만 스타일, 집안, 재능이 달라요.</p>
  ${CANDS.map((c,i)=>`<button class="choice" data-c="${i}" style="${i===CSEL?'border-color:var(--ac)':''}"><b>${c.ae} ${c.arch}</b> ${BG[c.bg].e} ${BG[c.bg].n} · ${TRAITS[c.trait].e} ${TRAITS[c.trait].n}<small>지능 ${c.v[0]} · 체력 ${c.v[1]} · 인성 ${c.v[2]} · 매력 ${c.v[3]} · 인맥 ${c.v[4]}</small><small>${TRAITS[c.trait].d} / ${BG[c.bg].tx}</small></button>`).join('')}
  <button class="btn c" id="rr">🎲 후보 다시 뽑기 (${REROLL}회 남음)</button>
  <div class="mut" style="margin-top:8px">집중 육성 (최대 2개, +8)</div><div class="chips">${STATS.map(s=>`<button class="chip" data-f="${s}" style="border:1px solid var(--bd);cursor:pointer;color:${FOC.includes(s)?'var(--ac)':'var(--tx)'}">${FOC.includes(s)?'✔ ':''}${LB[s]}</button>`).join('')}</div>
  <div class="mut" style="margin-top:8px">난이도: <b style="color:var(--bad)">🔥 하드 (고정)</b> · ${DIFF.hell.d}</div>
  ${k>0?`<label style="display:block;margin-top:8px"><input type="checkbox" id="rb" ${REB?'checked':''}> 환생 보너스 사용 (포인트 ${pts} → 능력치 전체 +${k}, ${k*4}pt 소모)</label>`:`<div class="mut" style="margin-top:8px">환생 포인트 ${pts} (4pt당 능력치 +1 보너스)</div>`}
  </div><button class="btn pri" id="go">🚀 인생 시작</button><button class="btn c" id="bk">◀ 돌아가기</button>`;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{NM=$('#nm').value;CSEL=+b.dataset.c;create()});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{NM=$('#nm').value;const s=b.dataset.f;FOC=FOC.includes(s)?FOC.filter(x=>x!==s):FOC.concat(s).slice(-2);create()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{NM=$('#nm').value;DF=b.dataset.d;create()});
  $('#rr').onclick=()=>{if(REROLL>0){NM=$('#nm').value;REROLL--;CANDS=[pickCand(),pickCand(),pickCand()];create()}};
  const rb=$('#rb');if(rb)rb.onchange=()=>REB=rb.checked;
  $('#go').onclick=()=>{NM=($('#nm').value||'재민').trim()||'재민';const rbv=rb?rb.checked:false;
    newState(CANDS[CSEL],NM,FOC,{diff:DF,fort:f,rebirth:rbv});REROLL=2;CANDS=[];FOC=[];VIEW='play';SNAP=null;save();beep(700,.15);render()};
  $('#bk').onclick=()=>{VIEW='title';render()};
}
/* ===== save io ===== */
function exportSave(){if(!S)return;const b=new Blob([JSON.stringify({game:'jaemin',S,META})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jaemin-save.json';a.click();toast('저장 파일을 내보냈어요')}
function importSave(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.game!=='jaemin'||!d.S)throw 0;S=d.S;if(d.META){META=d.META;saveMeta()}VIEW='play';SNAP=null;save();render();toast('불러왔어요!')}catch(e){toast('올바른 저장 파일이 아니에요')}};r.readAsText(f)};i.click()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ===== boot ===== */
$('#bSnd').onclick=()=>{sndOn=!sndOn;lsSet('jmk_snd',sndOn);$('#bSnd').textContent=sndOn?'🔊':'🔇';beep()};
$('#bSnd').textContent=sndOn?'🔊':'🔇';
$('#bTh').onclick=()=>{const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'dark':'light';lsSet('jmk_th',l?'dark':'light')};
document.documentElement.dataset.theme=lsGet('jmk_th','dark');
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(VIEW!=='play'||!S)return;
  if(e.key>='1'&&e.key<='9'){const b=document.querySelector(`.choice[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}
  if(e.key==='Enter'||e.key===' '){const n=$('#next');if(n){e.preventDefault();n.click()}}
});
render();
</script>
</body>
</html>
