<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재민이 키우기 : 선택으로 완성하는 인생 시뮬레이션</title>
<meta name="description" content="경기도 양주시에서 자란 7살 재민이를 80살까지. 선택으로 직업과 연봉을 정하고 최종 인생 점수로 평가받는 인생 키우기 게임.">
<style>
:root{--bg:#0f1226;--card:#1a1f3d;--card2:#232a52;--tx:#eef0ff;--mut:#9aa3d6;--ac:#ffd166;--ac2:#6ee7b7;--bad:#ff6b8b;--ok:#6ee7b7;--bd:#2f376b}
:root[data-theme=light]{--bg:#f4f5ff;--card:#fff;--card2:#eceeff;--tx:#1b1f3b;--mut:#5a628f;--ac:#e08a00;--ac2:#0a9e73;--bad:#d6335a;--ok:#0a9e73;--bd:#cdd2f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
header h1{font-size:18px;margin:0;color:var(--ac)}
.tools button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:4px 8px;margin-left:4px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
.hero{display:flex;align-items:center;gap:12px}
.av{font-size:52px;line-height:1;background:var(--card2);border-radius:16px;padding:8px 10px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hero b{font-size:18px}.mut{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.st{font-size:12px}.bar{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--ac2);transition:width .5s}
.bar i.sts{background:var(--bad)}
.money{display:flex;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:999px;padding:3px 10px}
h2{margin:0 0 6px;font-size:18px}
.ev p{margin:6px 0 12px;white-space:pre-line}
.choice,.btn{display:block;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;cursor:pointer;font-family:inherit}
.choice:hover:not([disabled]),.btn:hover{border-color:var(--ac)}
.choice[disabled]{opacity:.4;cursor:not-allowed}
.choice small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.btn.pri{background:var(--ac);color:#1b1500;border:none;text-align:center;font-weight:700}
.btn.c{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2)}
.chip.u{color:var(--ok)}.chip.d{color:var(--bad)}
.tag{display:inline-block;font-size:11px;background:var(--card2);padding:2px 8px;border-radius:999px;margin-right:4px;color:var(--mut)}
.grade{font-size:76px;font-weight:900;text-align:center;color:var(--ac);line-height:1}
.center{text-align:center}
.tl{max-height:260px;overflow:auto;font-size:13px;border-left:2px solid var(--bd);padding-left:10px;margin-top:8px}
.tl div{margin-bottom:6px}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ac);color:#1b1500;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 4px 18px #0006;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
.sbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.sbar span{width:62px}.sbar .bar{flex:1}.sbar b{width:44px;text-align:right}
/* 사진 아바타 */
#logo{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:2px solid var(--ac)}
.avp{position:relative;flex:none;border-radius:20px;border:4px solid var(--jc,#ffd166);box-shadow:0 0 0 2px var(--card),0 6px 18px #0005;margin-top:14px}
.avp img{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px;animation:bob 2.4s ease-in-out infinite}
.avp.old img{filter:grayscale(.55) contrast(.92) brightness(1.06) sepia(.15)}
.avp .hat{position:absolute;top:-30px;left:50%;transform:translateX(-50%) rotate(-6deg);font-size:38px;filter:drop-shadow(0 2px 3px #0008)}
.avp .prop{position:absolute;right:-12px;bottom:-12px;font-size:28px;background:var(--card);border:2px solid var(--jc,#ffd166);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.avp .gray{position:absolute;left:-10px;bottom:-10px;font-size:24px;background:var(--card);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.big-av .avp{margin:22px auto 8px}
.cmt{margin:10px 0;padding:12px 14px;border-left:5px solid var(--ac);background:var(--card2);border-radius:10px;font-weight:700;font-size:17px}
.evt{border:3px solid var(--ac);background:linear-gradient(135deg,var(--card2),var(--card));border-radius:16px;padding:16px;margin:10px 0}
.evt h3{margin:0 0 6px;font-size:21px;color:var(--ac)}
.evt p{margin:4px 0;font-size:17px}
.evt .rw{display:block;margin-top:6px;padding:8px 12px;background:var(--bg);border-radius:10px;font-weight:700;font-size:17px}
.cert{border:3px dashed var(--ac2);border-radius:16px;padding:16px;margin:10px 0;text-align:center;background:var(--card)}
.cert .code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:2px;color:var(--ac)}

/* ===== 시스템 요소 연출 ===== */
body{transition:background .8s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;transition:opacity 1s;background-size:200% 200%;animation:bgflow 18s ease-in-out infinite}
body[data-stage=kid]::before{background-image:linear-gradient(135deg,#2b3a7a22,#ffd16622,#6ee7b722)}
body[data-stage=teen]::before{background-image:linear-gradient(135deg,#4a2b7a33,#ff6b8b22,#7aa2ff22)}
body[data-stage=young]::before{background-image:linear-gradient(135deg,#0d4a6a33,#6ee7b722,#ffd16622)}
body[data-stage=mid]::before{background-image:linear-gradient(135deg,#5a3a1a33,#ff8a4a22,#2b3a7a22)}
body[data-stage=senior]::before{background-image:linear-gradient(135deg,#4a3a5a33,#c08a6a22,#2b3a7a22)}
body[data-stage=old]::before{background-image:linear-gradient(135deg,#6a4a2a44,#ffb36b33,#4a3a5a22)}
@keyframes bgflow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#gauge,#tapgame,#replay{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.gbox{width:100%;max-width:460px;background:var(--card);border:3px solid var(--ac);border-radius:20px;padding:22px;text-align:center}
.gt{font-size:24px;font-weight:800;color:var(--ac);margin-bottom:16px}
.gbar{position:relative;height:30px;background:var(--bad);border-radius:15px;margin:22px 0 14px;opacity:.95}
.gbar .gz{position:absolute;right:0;top:0;bottom:0;background:var(--ok);border-radius:0 15px 15px 0;min-width:6px}
.gbar .gn{position:absolute;top:-9px;left:0;width:6px;height:48px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 12px #fff;transition:left 1.25s cubic-bezier(.12,.85,.2,1)}
.gs{font-size:19px;min-height:30px;margin-top:6px}
#gauge.win .gbox{animation:pop .5s}#gauge.lose .gbox{animation:shake .5s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.tbar{height:14px;background:var(--card2);border-radius:7px;overflow:hidden;margin:14px 0}.tbar i{display:block;height:100%;width:100%;background:var(--ac)}
#tapbtn{width:100%;padding:34px 0;transition:transform .05s}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.itemrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.ib{background:var(--card2);border:1px solid var(--ac);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer;font-family:inherit}
.ib:hover{background:var(--ac);color:#1b1500}
.lk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;flex-wrap:wrap}.lk .bar{flex:1;min-width:80px}.lk .bar i{background:linear-gradient(90deg,#6ee7b7,#ffd166);transition:width .6s}
.flame{font-weight:800;color:#ff8a4a;animation:flame 0.7s ease-in-out infinite alternate;display:inline-block}
@keyframes flame{from{transform:scale(1) rotate(-2deg);text-shadow:0 0 4px #ff8a4a}to{transform:scale(1.18) rotate(2deg);text-shadow:0 0 14px #ffd166}}
.combo{display:inline-block;margin:6px 0;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,#ff8a4a,#ffd166);color:#1b1500;font-weight:900;animation:flame .6s ease-in-out infinite alternate}
.drop{margin:8px 0;padding:10px 14px;border:2px dashed var(--ac2);border-radius:12px;font-weight:700;animation:pop .6s}
.nick{display:inline-block;font-size:14px;color:var(--ac);background:var(--card2);border-radius:999px;padding:1px 10px;margin-left:4px;vertical-align:middle}
.nick.pop{animation:nickpop 1.2s}@keyframes nickpop{0%{transform:scale(.4);opacity:0}50%{transform:scale(1.4)}100%{transform:scale(1);opacity:1}}
.pill.rk{animation:pop .8s}
#app{overflow-x:clip}.card.center{overflow:hidden}
.grade.gS{background:linear-gradient(90deg,#ffd166,#ff6b8b,#7aa2ff,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ffd16688)}
.grade.gD{color:var(--bad)}.grade.gC{color:var(--mut)}
.grade.stamp{animation:stampin .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{0%{transform:scale(4) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.chart{width:100%;height:auto;margin-top:8px}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:drawln 2.2s ease forwards}.chart .ln.n{animation-delay:.4s}
@keyframes drawln{to{stroke-dashoffset:0}}
.mrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px}.mrow .no{width:28px;font-weight:800;color:var(--ac)}.mrow .nm{width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mb{flex:1;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}.mrow .mb i{display:block;height:100%;width:0;background:var(--ac2);border-radius:6px;animation:grow 1.4s ease forwards}
.mrow.me .mb i{background:var(--ac)}.mrow.me{font-weight:800}
@keyframes grow{to{width:var(--w)}}
.mrow b{width:70px;text-align:right;font-size:15px}
.rp{width:100%;max-width:460px;max-height:90vh;overflow:hidden}
.rpi{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0;animation:slidein .5s}
.rpi.w{border-color:var(--ok)}.rpi.l{border-color:var(--bad)}
.rpi .rpa{display:inline-block;font-size:30px;font-weight:900;color:var(--ac);margin-right:10px}
.rpi small{display:block;color:var(--mut);margin-top:4px;font-size:14px}
@keyframes slidein{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rpe{text-align:center;color:var(--tx);animation:pop .8s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== 그래픽 업그레이드: 로비 · 장면 배너 · 연출 ===== */
#app{position:relative;z-index:1}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.75}
.lobby{position:relative;overflow:hidden;border-radius:24px;border:2px solid #3a437f;margin:6px 0 10px;background:linear-gradient(180deg,#070b26 0%,#141c52 45%,#3b2a63 82%,#6a3d6f 100%);color:#fff;text-align:center;isolation:isolate;min-height:470px;box-shadow:0 10px 40px #0008}
.lobby .sky,.lobby .skyline{position:absolute;inset:0;pointer-events:none;z-index:-1}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 28% 8%,#fff,transparent),radial-gradient(2px 2px at 44% 22%,#cfe,transparent),radial-gradient(1.5px 1.5px at 61% 12%,#fff,transparent),radial-gradient(2px 2px at 78% 26%,#fde,transparent),radial-gradient(1.5px 1.5px at 90% 9%,#fff,transparent),radial-gradient(1.5px 1.5px at 6% 40%,#fff,transparent),radial-gradient(2px 2px at 36% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 40%,#cfe,transparent),radial-gradient(2px 2px at 95% 34%,#fff,transparent);animation:twinkle 3.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.moon{position:absolute;right:14%;top:16px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffd166);box-shadow:0 0 34px #ffd166aa,0 0 90px #ffd16655;animation:moonf 7s ease-in-out infinite}
@keyframes moonf{50%{transform:translateY(8px) scale(1.04)}}
.cloud{position:absolute;left:0;font-size:36px;opacity:.5;animation:cloudm linear infinite}
@keyframes cloudm{from{transform:translateX(-70px)}to{transform:translateX(520px)}}
.skyline svg{position:absolute;left:0;bottom:0;width:200%;height:150px;animation:pan 46s linear infinite}
.skyline svg.n{height:120px;animation-duration:26s}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.win{animation:wtw 3.2s ease-in-out infinite alternate}
@keyframes wtw{from{opacity:.15}to{opacity:1}}
.lobby-in{position:relative;padding:22px 12px 0}
.orbit{display:flex;justify-content:center;gap:8px;flex-wrap:nowrap}
.pc{border-radius:16px;border:3px solid #ffd166;object-fit:cover;box-shadow:0 6px 18px #0009;animation:pfloat 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.7s);transform:rotate(var(--r))}
@keyframes pfloat{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r)*-1))}}
.logo{margin:16px 0 4px;font-size:46px;line-height:1.1;letter-spacing:-1px;color:#ffd166;text-shadow:0 0 18px #ffd16688,0 4px 0 #8a5a00}
.logo span{display:inline-block;animation:lb 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.13s)}
.logo .sp{width:10px}
@keyframes lb{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0)}}
.lobby .sub{margin:6px 0 10px;font-size:16px;color:#c8cdf5}
.tl-strip{overflow:hidden;white-space:nowrap;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;padding:8px 0;margin:10px 0 0;background:#00000033;font-size:16px;color:#e6e9ff}
.tl-in{display:inline-block;animation:marq 34s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ground{position:absolute;left:0;right:0;bottom:4px;height:96px;pointer-events:none}
.walker{position:absolute;bottom:14px;left:-70px;display:flex;flex-direction:column;align-items:center;animation:walk 16s linear infinite}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(560px)}}
.walker img{border-radius:50%;border:3px solid #ffd166;object-fit:cover;animation:bobw .45s ease-in-out infinite}
@keyframes bobw{50%{transform:translateY(-5px)}}
.legs{display:flex;gap:7px;margin-top:-2px}.legs i{display:block;width:5px;height:14px;border-radius:3px;background:#ffd166;transform-origin:top center;animation:leg .45s ease-in-out infinite alternate}.legs i:nth-child(2){animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.say{position:relative;height:26px;min-width:120px;margin-bottom:4px}
.say span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1b1f3b;font-size:13px;font-weight:800;padding:3px 10px;border-radius:12px;opacity:0;animation:sayc 12.8s infinite}
.say span:nth-child(2){animation-delay:3.2s}.say span:nth-child(3){animation-delay:6.4s}.say span:nth-child(4){animation-delay:9.6s}
@keyframes sayc{0%{opacity:0;transform:translate(-50%,6px)}4%,22%{opacity:1;transform:translate(-50%,0)}28%,100%{opacity:0;transform:translate(-50%,-4px)}}
.btn.pri.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #ffd16600}50%{box-shadow:0 0 22px 4px #ffd166aa}}
/* 장면 배너 */
.scene{position:relative;height:88px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:linear-gradient(120deg,hsl(var(--h) 55% 24%),hsl(calc(var(--h) + 55) 60% 36%));display:flex;align-items:center;justify-content:center;isolation:isolate}
.scene .se{font-size:58px;filter:drop-shadow(0 6px 8px #0007);animation:sefloat 3.2s ease-in-out infinite}
@keyframes sefloat{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg) scale(1.06)}}
.scene i{position:absolute;border-radius:50%;background:#ffffff22;filter:blur(2px);z-index:-1;animation:orb 7s ease-in-out infinite alternate}
.scene .o1{width:90px;height:90px;left:-20px;top:-30px}.scene .o2{width:60px;height:60px;right:12%;bottom:-20px;animation-delay:-2s}.scene .o3{width:36px;height:36px;left:30%;top:10px;animation-delay:-4s}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(24px,10px) scale(1.2)}}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffff2b 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{40%,100%{transform:translateX(120%)}}
.scene.win{box-shadow:inset 0 0 0 3px #6ee7b7}.scene.lose{filter:saturate(.7) brightness(.85);box-shadow:inset 0 0 0 3px #ff6b8b}
/* 카드·선택지 등장 */
.card{animation:cardin .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.ev .choice{animation:chin .45s cubic-bezier(.2,.9,.3,1) both}
.ev .choice:nth-of-type(1){animation-delay:.08s}.ev .choice:nth-of-type(2){animation-delay:.16s}.ev .choice:nth-of-type(3){animation-delay:.24s}.ev .choice:nth-of-type(4){animation-delay:.32s}.ev .choice:nth-of-type(5){animation-delay:.4s}.ev .choice:nth-of-type(6){animation-delay:.48s}.ev .choice:nth-of-type(n+7){animation-delay:.56s}
@keyframes chin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.chip{animation:chp .45s cubic-bezier(.2,1.6,.4,1) both}.chips .chip:nth-child(2){animation-delay:.08s}.chips .chip:nth-child(3){animation-delay:.16s}.chips .chip:nth-child(4){animation-delay:.24s}.chips .chip:nth-child(n+5){animation-delay:.32s}
@keyframes chp{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
/* 반응 연출 */
.react-win{animation:hop .75s cubic-bezier(.2,1.4,.4,1)}
.react-lose{animation:shk .55s}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-5deg)}65%{transform:translateY(0) rotate(4deg)}82%{transform:translateY(-6px)}100%{transform:none}}
@keyframes shk{20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fpop{position:fixed;z-index:70;pointer-events:none;font-weight:900;font-size:22px;text-shadow:0 2px 6px #000a;animation:fpop 1.15s ease-out forwards}
.fpop.u{color:#6ee7b7}.fpop.d{color:#ff6b8b}
@keyframes fpop{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(-4px) scale(1.25)}100%{opacity:0;transform:translateY(-52px) scale(1)}}
.spk{position:fixed;z-index:70;pointer-events:none;font-size:22px;animation:spk 1s ease-out forwards}
@keyframes spk{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(160deg)}}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;background:radial-gradient(circle,transparent 35%,#ff3b5c66 100%);animation:flashout .7s ease-out forwards}
@keyframes flashout{from{opacity:1}to{opacity:0}}

/* ===== 로비 히어로: 비치볼에 맞는 재민이 ===== */
.hit-hero{display:flex;justify-content:center;margin-top:6px}
.hh-wrap{position:relative;width:150px;height:150px}
.hh-img{width:150px;height:150px;border-radius:26px;border:4px solid #ffd166;object-fit:cover;box-shadow:0 10px 30px #000a;animation:hhhit 4.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes hhhit{0%,36%{transform:none}40%{transform:translate(-10px,4px) rotate(-12deg) scale(.96,.92)}46%{transform:translate(4px,-3px) rotate(6deg)}52%{transform:rotate(-3deg)}58%,100%{transform:none}}
.bball{position:absolute;width:56px;height:56px;border-radius:50%;left:46px;top:-8px;z-index:3;background:conic-gradient(#ff4d4d 0 60deg,#fff 60deg 120deg,#ffd43b 120deg 180deg,#fff 180deg 240deg,#339af0 240deg 300deg,#fff 300deg 360deg);box-shadow:inset -9px -9px 15px #0004,inset 6px 6px 10px #fff8,0 6px 12px #0006;animation:bballfly 4.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes bballfly{0%{transform:translate(180px,-130px) rotate(0);opacity:0}6%{opacity:1}38%{transform:translate(0,0) rotate(540deg)}41%{transform:translate(-4px,2px) rotate(560deg) scale(.9,1.1)}60%{transform:translate(-150px,-130px) rotate(-200deg);opacity:1}72%,100%{transform:translate(-190px,-170px) rotate(-360deg);opacity:0}}
.hh-pow{position:absolute;left:-34px;top:8px;z-index:4;font-size:26px;font-weight:900;color:#fff;background:#ff4d4d;border:3px solid #fff;border-radius:14px;padding:2px 12px;transform:rotate(-12deg) scale(0);animation:hhpow 4.6s infinite;box-shadow:0 4px 10px #0007}
@keyframes hhpow{0%,38%{transform:rotate(-12deg) scale(0);opacity:0}41%{transform:rotate(-12deg) scale(1.3);opacity:1}52%{transform:rotate(-12deg) scale(1);opacity:1}60%,100%{transform:rotate(-12deg) scale(0);opacity:0}}
.hh-stars span{position:absolute;font-size:22px;opacity:0;animation:hhs 4.6s infinite}
.hh-stars span:nth-child(1){left:-8px;top:-10px}.hh-stars span:nth-child(2){right:-10px;top:2px;animation-delay:.08s}.hh-stars span:nth-child(3){right:22px;top:-22px;animation-delay:.16s}
@keyframes hhs{0%,39%{opacity:0;transform:scale(.3) rotate(0)}43%{opacity:1;transform:scale(1.3) rotate(40deg)}58%,100%{opacity:0;transform:scale(1) rotate(120deg) translateY(-18px)}}
.hit-hero.has-img .bball,.hit-hero.has-img .hh-pow{display:none}
.scene.img{height:150px;background-size:cover;background-position:center 30%}
.scene.img .se{display:none}.scene.img i{display:none}

/* ===================== 메이플풍(원작 에셋 미사용, 자체 제작) ===================== */
:root,:root[data-theme=light]{color-scheme:light;--bg:#8fd6ff;--card:#fff7dc;--card2:#ffefb8;--tx:#4a2f14;--mut:#8a6a3c;--ac:#ff8a00;--ac2:#4fc22b;--bad:#e8433d;--ok:#2f9e1c;--bd:#9b6a33;--wood:#7a4a1c;--wood2:#c88a3e}
:root[data-theme=dark]{color-scheme:dark;--bg:#1d2a63;--card:#2b3573;--card2:#37428a;--tx:#fff3d6;--mut:#b8c0f0;--ac:#ffc233;--ac2:#6be04a;--bad:#ff6b5e;--ok:#79e85a;--bd:#101744;--wood:#0e1540;--wood2:#4a58b0}
body{font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:.1px;
  background:linear-gradient(180deg,#5fb8ff 0%,#a5e0ff 38%,#e5f8ff 62%,#bfe8ff 100%) fixed;color:var(--tx)}
:root[data-theme=dark] body{background:linear-gradient(180deg,#0e1540 0%,#25317a 45%,#4b3a8a 100%) fixed}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;pointer-events:none;
  background:radial-gradient(60px 40px at 10% 100%,#5ec92f 98%,transparent) ,radial-gradient(90px 50px at 38% 100%,#4db823 98%,transparent),radial-gradient(70px 44px at 66% 100%,#5ec92f 98%,transparent),radial-gradient(100px 54px at 92% 100%,#4db823 98%,transparent),linear-gradient(transparent 40px,#3f9e22 40px);opacity:.9}
:root[data-theme=dark] body::after{filter:brightness(.45) saturate(.8)}
body::before{opacity:.55}
header{background:linear-gradient(#ffd45a,#ff9f1c);border:3px solid var(--wood);border-radius:0 0 16px 16px;padding:6px 12px;margin:0 -4px;box-shadow:0 4px 0 #0003,inset 0 2px 0 #fff8}
header h1{font-size:22px;color:#fff;-webkit-text-stroke:0;text-shadow:-2px -2px 0 #8a4b00,2px -2px 0 #8a4b00,-2px 2px 0 #8a4b00,2px 2px 0 #8a4b00,0 3px 0 #8a4b00;letter-spacing:1px}
header h1::after{content:" 🍁";font-size:18px}
.tools button{background:linear-gradient(#fff,#ffe9a8);border:2px solid var(--wood);color:#4a2f14;border-radius:8px;box-shadow:0 2px 0 var(--wood)}
.tools button:active{transform:translateY(2px);box-shadow:none}
#logo{border-color:#fff;box-shadow:0 0 0 2px var(--wood)}
/* 창(윈도우) */
.card,.evt{background:linear-gradient(#fffbe9,var(--card));border:3px solid var(--wood);border-radius:12px;
  box-shadow:inset 0 0 0 2px #fff9,inset 0 -6px 0 #0000000d,0 5px 0 #0003;position:relative}
:root[data-theme=dark] .card,:root[data-theme=dark] .evt{background:linear-gradient(#34408a,var(--card));box-shadow:inset 0 0 0 2px #fff2,0 5px 0 #0005}
.card.ev{padding-top:22px}
.card.ev::before{content:"QUEST!";position:absolute;left:12px;top:-12px;background:linear-gradient(#ffd45a,#ff9f1c);color:#fff;font-size:13px;padding:1px 12px 0;border:2px solid var(--wood);border-radius:10px;text-shadow:1px 1px 0 #8a4b00;letter-spacing:1px}
.evt h3,h2{color:var(--ac);text-shadow:1px 1px 0 #fff8}
:root[data-theme=dark] h2,:root[data-theme=dark] .evt h3{text-shadow:1px 1px 0 #0006}
h2{font-size:21px;color:#c25a00}
:root[data-theme=dark] h2{color:#ffd45a}
.mut{color:var(--mut)}
/* NPC 대화 선택지 */
.choice,.btn{background:linear-gradient(#fffdf2,#ffe9a3);border:2px solid var(--wood);border-radius:10px;color:#2a58b8;font-size:16px;box-shadow:0 3px 0 var(--wood),inset 0 1px 0 #fff;transition:transform .08s,box-shadow .08s,filter .15s}
:root[data-theme=dark] .choice,:root[data-theme=dark] .btn{background:linear-gradient(#4a58b0,#37428a);color:#fff3d6;box-shadow:0 3px 0 #0b1138}
.choice:hover:not([disabled]),.btn:hover{border-color:var(--wood);filter:brightness(1.07);transform:translateY(-1px)}
.choice:active:not([disabled]),.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--wood)}
.choice:not([disabled])::before{content:"▶ ";color:#ff8a00;font-size:12px}
.choice small{color:#8a5a20;font-family:"Noto Sans KR",sans-serif;font-size:12px}
:root[data-theme=dark] .choice small{color:#d0d6ff}
.btn.pri{background:linear-gradient(#ffd24a,#ff8a00);color:#fff;border:2px solid var(--wood);text-shadow:1px 1px 0 #8a4b00,-1px -1px 0 #8a4b00,1px -1px 0 #8a4b00,-1px 1px 0 #8a4b00;font-size:19px;box-shadow:0 4px 0 var(--wood),inset 0 2px 0 #fff9}
/* 상태창: HP/MP/EXP 게이지 느낌 */
.bar{height:11px;background:#5a3a1a;border:2px solid var(--wood);border-radius:8px;box-shadow:inset 0 2px 3px #0006;overflow:hidden}
.bar i{background:linear-gradient(#a8f070,#3fae1d 60%,#2f8c12);box-shadow:inset 0 2px 0 #fff6;border-radius:6px}
.bar i.sts{background:linear-gradient(#ff9a8a,#e8433d 60%,#b82a25)}
.st[data-k=hap] .bar i{background:linear-gradient(#ffe98a,#ffb800 60%,#d98f00)}
.st[data-k=int] .bar i,.st[data-k=cha] .bar i{background:linear-gradient(#9ad0ff,#3d8be8 60%,#2a66c0)}
.st{font-size:13px}
.pill,.chip,.tag{background:linear-gradient(#fff,#ffe9a8);border:1.5px solid #c9a064;color:#6a4720}
:root[data-theme=dark] .pill,:root[data-theme=dark] .chip,:root[data-theme=dark] .tag{background:#4a58b0;border-color:#101744;color:#fff3d6}
.lvl{display:inline-block;background:linear-gradient(#ffd45a,#ff9f1c);color:#fff;border:2px solid var(--wood);border-radius:8px;padding:0 7px;margin-right:4px;font-size:13px;text-shadow:1px 1px 0 #8a4b00;vertical-align:1px}
.nick{color:#2a7fd6}
:root[data-theme=dark] .nick{color:#8fd0ff}
.avp{border-color:#fff;box-shadow:0 0 0 3px var(--wood),0 6px 0 #0003}
.cmt{background:linear-gradient(#fffdf2,#fff0bd);border:2px solid var(--wood);border-left:8px solid var(--ac);color:#4a2f14}
:root[data-theme=dark] .cmt{background:#37428a;color:#fff3d6}
input[type=text]{background:#fff;color:#4a2f14;border:2px solid var(--wood);border-radius:8px}
.toast{background:linear-gradient(#ffd45a,#ff9f1c);border:3px solid var(--wood);color:#fff;text-shadow:1px 1px 0 #8a4b00;border-radius:12px;box-shadow:0 4px 0 var(--wood)}
td,th{border-color:#e0c690}
.grade{-webkit-text-stroke:3px var(--wood);paint-order:stroke fill;text-shadow:0 6px 0 var(--wood)}
.grade.gS{-webkit-text-stroke:0;filter:drop-shadow(0 3px 0 #7a4a1c)}
.scene{border:2px solid var(--wood);border-radius:10px}
/* 데미지 스킨 느낌 */
.fpop{font-family:"Jua",sans-serif;font-size:30px;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 3px 0 #0004;letter-spacing:1px}
.fpop.u{color:#ff8a00}.fpop.d{color:#4a7bd8}
.mtxt{position:fixed;left:50%;top:34%;z-index:75;transform:translateX(-50%);pointer-events:none;font-family:"Jua",sans-serif;font-size:46px;letter-spacing:2px;white-space:nowrap;color:#ffd24a;-webkit-text-stroke:3px #8a4b00;paint-order:stroke fill;text-shadow:0 5px 0 #8a4b00,0 0 24px #ffd24a;animation:mtxt 1.3s cubic-bezier(.2,1.5,.4,1) forwards}
.mtxt.miss{color:#e8eefc;-webkit-text-stroke:3px #4a5a7a;text-shadow:0 5px 0 #4a5a7a;font-size:38px}
.mtxt.lv{font-size:54px;color:#fff56a;-webkit-text-stroke:3px #c25a00;text-shadow:0 6px 0 #c25a00,0 0 36px #fff56a;top:28%}
@keyframes mtxt{0%{transform:translateX(-50%) scale(.2);opacity:0}25%{transform:translateX(-50%) scale(1.25);opacity:1}45%{transform:translateX(-50%) scale(1)}85%{transform:translateX(-50%) translateY(-24px) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-60px);opacity:0}}
.lvring{position:fixed;left:50%;top:44%;width:30px;height:30px;margin:-15px;border-radius:50%;border:5px solid #fff56a;z-index:74;pointer-events:none;box-shadow:0 0 20px #fff56a;animation:lvring 1s ease-out forwards}
@keyframes lvring{to{transform:scale(14);opacity:0}}
/* 로비: 헤네시스 낮 */
.lobby{background:linear-gradient(180deg,#4aa9ff 0%,#8bd2ff 50%,#d9f4ff 78%,#b6ec84 78.1%);border:3px solid var(--wood);color:#fff;box-shadow:inset 0 0 0 2px #fff8,0 6px 0 #0003}
:root[data-theme=dark] .lobby{background:linear-gradient(180deg,#0e1540 0%,#25317a 55%,#4b3a8a 78%,#2f6b24 78.1%)}
.lobby .stars{display:none}
:root[data-theme=dark] .lobby .stars{display:block}
.lobby .skyline{display:none}
.moon{width:64px;height:64px;background:radial-gradient(circle at 40% 40%,#fff8b0,#ffd23a 60%,#ffb300);box-shadow:0 0 0 8px #ffe07a66,0 0 60px #ffe07a}
:root[data-theme=dark] .moon{background:radial-gradient(circle at 35% 35%,#fffbe6,#ffd166);box-shadow:0 0 34px #ffd166aa,0 0 90px #ffd16655}
.cloud{opacity:.95;font-size:44px;filter:drop-shadow(0 4px 0 #fff6)}
:root[data-theme=dark] .cloud{opacity:.35}
.hills{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:-1;pointer-events:none;
  background:radial-gradient(140px 90px at 12% 100%,#6fd43b 98%,transparent),radial-gradient(180px 110px at 45% 100%,#58bf2b 98%,transparent),radial-gradient(150px 100px at 80% 100%,#6fd43b 98%,transparent),linear-gradient(transparent 68%,#4aa51f 68%)}
:root[data-theme=dark] .hills{filter:brightness(.5)}
.mons{position:absolute;left:0;right:0;bottom:10px;z-index:0;pointer-events:none;font-size:26px}
.mons span{position:absolute;bottom:0;animation:monw linear infinite}
.mons span:nth-child(1){animation-duration:22s;animation-delay:-4s;font-size:24px}
.mons span:nth-child(2){animation-duration:30s;animation-delay:-14s;animation-name:monw2}
.mons span:nth-child(3){animation-name:monh;animation-duration:1.1s;left:20%}
.mons span:nth-child(4){animation-name:monh;animation-duration:1.4s;left:78%;animation-delay:-.5s}
@keyframes monw{from{left:-8%}to{left:108%}}@keyframes monw2{from{left:108%}to{left:-8%}}
@keyframes monh{0%,100%{transform:translateY(0) scale(1.1,.85)}45%{transform:translateY(-22px) scale(.92,1.1)}}
.lobby h1,.lobby .logo,.logo{color:#fff;text-shadow:-3px -3px 0 #8a4b00,3px -3px 0 #8a4b00,-3px 3px 0 #8a4b00,3px 3px 0 #8a4b00,0 6px 0 #8a4b00}
.lobby .sub{color:#fff;text-shadow:-1px -1px 0 #2a6fb8,1px 1px 0 #2a6fb8,1px -1px 0 #2a6fb8,-1px 1px 0 #2a6fb8}
.tl-strip{background:#4a2f1488;border-color:#fff6;color:#fff}
.hh-img{border-color:#fff;box-shadow:0 0 0 4px var(--wood),0 10px 0 #0003}
.pc{border-color:#fff}
.say span{border:2px solid var(--wood)}

/* ===== 캐릭터 만들기(메이플 캐릭터 생성 화면풍) ===== */
.mc{position:relative;margin:10px 0;border:6px solid #6b3f17;border-radius:18px;background:#f6e6b8;padding:10px;box-shadow:inset 0 0 0 3px #d8b36a,0 6px 0 #0003;overflow:hidden}
.mc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,#00000022,transparent);pointer-events:none}
.mc-tabs{display:flex;gap:6px;margin-bottom:8px}
.mc-tab{flex:1;background:linear-gradient(#8a5a28,#5e3a14);border:2px solid #3a220a;border-radius:8px;color:#ffe9b0;padding:3px 10px;font-size:15px;line-height:1.15;box-shadow:inset 0 1px 0 #ffffff44}
.mc-tab small,.mc-tab b{display:block;font-size:10px;color:#e6c98a;font-family:system-ui,sans-serif}
.mc-tab b{font-size:14px;color:#fff;font-family:inherit}
.mc-scene{position:relative;height:400px;border:3px solid #3a220a;border-radius:10px;overflow:hidden;background:linear-gradient(#3fa0ff 0%,#8dd2ff 60%,#d7f2ff 100%)}
.mcc{position:absolute;font-size:44px;opacity:.95;animation:cloudm linear infinite}.mcc.c1{top:14px;animation-duration:40s}.mcc.c2{top:80px;animation-duration:60s;animation-delay:-25s;font-size:34px}
.mc-mush{position:absolute;right:6%;top:6px;width:150px;height:150px}
.mc-mush .cap{position:absolute;left:0;top:0;width:150px;height:62px;border-radius:75px 75px 12px 12px/62px 62px 12px 12px;background:radial-gradient(circle at 25% 40%,#fff 0 7px,transparent 8px),radial-gradient(circle at 60% 30%,#fff 0 9px,transparent 10px),radial-gradient(circle at 82% 50%,#fff 0 6px,transparent 7px),linear-gradient(#ffb04a,#f07a00);border:3px solid #9a4c00;box-shadow:inset 0 -8px 0 #00000018}
.mc-mush .stem{position:absolute;left:52px;top:58px;width:46px;height:120px;border-radius:8px;background:linear-gradient(90deg,#f0d9a0,#fff1c8,#e5c987);border:3px solid #9a6a2a}
.mc-plat{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(#7bd44a 0 14px,#8a5a28 14px);border-top:4px solid #3f8a22}
.mc-plat::after{content:"";position:absolute;left:0;right:0;top:14px;bottom:0;background:repeating-linear-gradient(90deg,#0000 0 28px,#00000022 28px 30px)}
.mc-char{position:absolute;right:12px;bottom:96px;width:96px;z-index:3}
.mc-char img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px #6b3f17}
.mc-shadow{position:absolute;left:20px;top:22px;width:84px;height:12px;border-radius:50%;background:#0004;filter:blur(2px)}
.mc-scroll{position:absolute;left:10px;top:14px;width:56%;z-index:2;background:linear-gradient(90deg,#e8d9a8,#fdf3cf 12%,#fdf3cf 88%,#e8d9a8);border:2px solid #8a6a38;border-radius:6px;padding:8px 10px;color:#3d2a12;box-shadow:0 4px 0 #0003}
.mc-scroll .r{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dotted #b79a5c;padding:2px 0;line-height:1.25}
.mc-scroll .r span{color:#8a5a28;white-space:nowrap}.mc-scroll .r b{font-weight:400;text-align:right;font-family:"Noto Sans KR",sans-serif;font-size:12px}
.mc-cands{position:absolute;left:12px;bottom:34px;z-index:3;display:flex;gap:6px}
.mc-cands button{width:52px;padding:2px 0;background:linear-gradient(#fff,#ffe9a8);border:2px solid #6b3f17;border-radius:8px;font-size:22px;line-height:1.1;cursor:pointer;box-shadow:0 2px 0 #6b3f17;font-family:inherit}
.mc-cands button small{display:block;font-size:10px;color:#6a4720}
.mc-cands button.on{background:linear-gradient(#ffd24a,#ff9f1c);transform:translateY(-4px)}
.mc-cands button.good{outline:2px solid #4fc22b}
.mc-sign{margin-top:10px;background:linear-gradient(#a8662a,#7a4a1c);border:3px solid #3a220a;border-radius:10px;padding:8px;box-shadow:inset 0 0 0 2px #d99a52}
.mc-board{background:#5b3512;border:2px solid #2a1706;border-radius:6px;padding:6px 8px}
.mc-nl{display:flex;justify-content:space-between;align-items:center;color:#ffe9b0;font-size:14px;margin-bottom:4px}
.mc-chk{background:linear-gradient(#ffd24a,#d98200);border:2px solid #3a220a;border-radius:6px;color:#fff;font-size:11px;padding:1px 8px;cursor:pointer;font-family:inherit}
.mc-board input{background:#2e1a07;color:#ffe9b0;border:2px solid #8a5a28;font-size:17px;padding:6px 8px}
.mc-stats{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mc-stats button{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#fff6d8,#f1dca0);border:2px solid #3a220a;border-radius:8px;padding:4px 10px;font-size:15px;color:#4a2f14;cursor:pointer;font-family:inherit}
.mc-stats button b{font-weight:400;color:#c25a00}
.mc-stats button.on{background:linear-gradient(#ffe27a,#ffb100);box-shadow:0 0 0 2px #fff6}
.mc-stats .mc-gen{grid-column:span 1;display:block;text-align:center;background:linear-gradient(#ffb04a,#e56a00);color:#fff;text-shadow:1px 1px 0 #8a3b00;font-size:13px;line-height:1.1}
.mc-gen small{display:block;font-size:10px;text-shadow:none}
.mc-gen:disabled{filter:grayscale(.8);cursor:not-allowed}
.mc-note{margin-top:6px;font-size:12px;color:#ffe9b0;font-family:"Noto Sans KR",sans-serif}
.mc-rb{display:block;margin-top:6px;font-size:12px;color:#ffe9b0;font-family:"Noto Sans KR",sans-serif}
.mc-btns{position:relative;z-index:2;display:flex;gap:8px;margin-top:10px}
.mc-btns button{flex:1;font-size:22px;padding:8px 0;border:3px solid #3a220a;border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #3a220a,inset 0 2px 0 #fff6;letter-spacing:6px}
.mc-btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #3a220a}

<body>
<div id="app">
<header><h1><img id="logo" alt="재민" width="30" height="30"> 재민이 키우기</h1><div class="tools"><button id="bBgm" title="배경음악">🎵</button><button id="bSnd" title="효과음">🔊</button><button id="bTh" title="테마">🌓</button></div></header>

</div>
<script src="assets/bgm/manifest.js" onerror="window.BGM_MANIFEST=window.BGM_MANIFEST||[]"></script>
<script src="assets/scenes/manifest.js" onerror="window.SCENE_MANIFEST=window.SCENE_MANIFEST||[]"></script>
<script>
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const R=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>{m=Math.round(m);const a=Math.abs(m),s=m<0?'-':'';if(a>=10000)return s+(a/10000).toFixed(a>=100000?0:1)+'억';return s+a.toLocaleString()+'만'};
const LB={int:'지능',str:'체력',chr:'인성',cha:'매력',soc:'인맥',hap:'행복',sts:'스트레스',m:'재산',s:'연봉',inv:'투자금'};
const STATS=['int','str','chr','cha','soc'];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ===== sound ===== */
let sndOn=lsGet('jmk_snd',true),bgmOn=lsGet('jmk_bgm',true),AC=null,MG=null,SG=null,BGN=null,NB=null;
function actx(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain();MG.gain.value=.9;
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=4;
  MG.connect(cp);cp.connect(AC.destination);
  SG=AC.createGain();SG.gain.value=1;SG.connect(MG);
  BGN=AC.createGain();BGN.gain.value=.5;BGN.connect(MG);
  const n=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=n;
  return AC;
}
/* 톤: 주파수 f(→f2 로 슬라이드), 길이 d, 파형 t, 음량 v, 시작 지연 at(초) */
function tone(f,d,t='sine',v=.12,at=0,f2=null,dest){
  try{const c=actx(),t0=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+Math.min(.015,d/3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(dest||SG);o.start(t0);o.stop(t0+d+.02)}catch(e){}
}
/* 노이즈: 필터 종류/주파수 */
function noise(d,v=.15,at=0,ft='lowpass',f=1200,f2=null,dest){
  try{const c=actx(),t0=c.currentTime+at,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    s.buffer=NB;s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    s.connect(fl);fl.connect(g);g.connect(dest||SG);s.start(t0);s.stop(t0+d+.02)}catch(e){}
}
function beep(f=520,d=.08,t='sine'){if(!sndOn)return;tone(f,d,t,.07)}
const SFX={
  tap:()=>tone(520,.05,'triangle',.08),
  tick:()=>tone(900,.03,'square',.03),
  good:()=>{tone(660,.1,'triangle',.11);tone(880,.14,'triangle',.11,.09);tone(1320,.2,'sine',.07,.18)},
  bad:()=>{tone(300,.5,'sawtooth',.09,0,110);noise(.25,.05,0,'lowpass',500)},
  big:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,'triangle',.1,i*.07));noise(.4,.06,.3,'highpass',5000,9000)},
  coin:()=>{tone(1318,.07,'square',.06);tone(1760,.35,'square',.06,.07)},
  hit:()=>{tone(180,.18,'sine',.3,0,45);noise(.12,.3,0,'lowpass',2500,300)},
  boing:()=>tone(220,.35,'sine',.16,0,900),
  whoosh:()=>noise(.35,.1,0,'bandpass',400,3000),
  fail:()=>{[392,370,349,311].forEach((f,i)=>tone(f,i<3?.26:.7,'sawtooth',.08,i*.28));tone(311,.7,'sawtooth',.05,.84,277)},
  sizzle:()=>{noise(.9,.12,0,'highpass',3500,6000);for(let i=0;i<6;i++)noise(.03,.2,i*.12+Math.random()*.05,'highpass',2500)},
  fart:()=>{tone(95,.6,'sawtooth',.16,0,60);tone(88,.6,'square',.07,.02,50);noise(.5,.08,0,'lowpass',300)},
  siren:()=>{for(let i=0;i<4;i++){tone(700,.25,'square',.05,i*.5,950);tone(950,.25,'square',.05,i*.5+.25,700)}},
  fire:()=>{tone(150,.45,'square',.12);tone(110,.7,'square',.12,.4);noise(.3,.06,0,'lowpass',400)},
  heart:()=>{tone(784,.15,'sine',.11);tone(988,.15,'sine',.11,.12);tone(1175,.4,'sine',.1,.24)},
  scare:()=>{tone(300,.7,'sawtooth',.06,0,150);tone(317,.7,'sawtooth',.06,0,160);noise(.5,.05,.1,'bandpass',900)},
  chime:()=>{tone(1046,.5,'sine',.08);tone(1568,.7,'sine',.06,.1)},
  alarm:()=>{for(let i=0;i<3;i++)tone(1500,.09,'square',.05,i*.14)},
  birthday:()=>{[262,262,294,262,349,330].forEach((f,i)=>tone(f,.2,'triangle',.09,i*.2))},
  stamp:()=>{tone(90,.3,'sine',.3,0,40);noise(.1,.25,0,'lowpass',1800,300)},
  pop:()=>tone(600,.08,'sine',.12,0,1200),
  fanS:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.25,'square',.06,i*.13));[784,988,1175,1568].forEach((f,i)=>tone(f,.9,'triangle',.1,.55+i*.02));tone(130,1.2,'sine',.15,.55)},
  fanA:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.14));tone(1046,.8,'triangle',.1,.6)},
  fanB:()=>{[392,494,587].forEach((f,i)=>tone(f,.28,'triangle',.1,i*.16));tone(784,.6,'triangle',.09,.5)},
  fanC:()=>{[440,392,440].forEach((f,i)=>tone(f,.3,'triangle',.08,i*.25))},
  sadD:()=>{[392,349,330,262].forEach((f,i)=>tone(f,.5,'sine',.1,i*.4));tone(130,1.4,'sine',.1,1.4,100)},
  levelup:()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.28,'triangle',.1,i*.07));tone(1046,.9,'sine',.08,.5);noise(.6,.05,.1,'highpass',6000,9000)},
  cheer:()=>{noise(1.2,.1,0,'bandpass',1500,2500)},
};
/* 사용자 효과음 파일: assets/sfx/<이름>.mp3 (예: levelup.mp3)가 있으면 합성음 대신 재생, 없으면 합성음 */
const SFXFILE={},SFX_SLOTS=new Set(['levelup']);
function sfx(n){
  if(!sndOn)return;
  try{
    if(SFXFILE[n]!==false&&!FAST&&SFX_SLOTS.has(n)){
      let a=SFXFILE[n];
      if(!a){a=new Audio('assets/sfx/'+n+'.mp3');a.preload='auto';a.addEventListener('error',()=>{SFXFILE[n]=false},{once:true});SFXFILE[n]=a}
      if(a&&a!==false&&!a.error){a.currentTime=0;a.volume=.8;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{if(SFXFILE[n]===a&&a.error)SFXFILE[n]=false;(SFX[n]||SFX.tap)()});return}
    }
    (SFX[n]||SFX.tap)()
  }catch(e){}
}
const sGood=()=>sfx('good'),sBad=()=>sfx('bad'),sTap=()=>sfx('tap');
/* 이벤트 내용에 맞는 효과음 고르기 */
function eventSfx(title,text,ok){
  const t=(title||'')+' '+(text||'');
  const m=re=>re.test(t);
  if(m(/방구|방귀|똥|뿡/))return 'fart';
  if(m(/화상|기름|라면|끓|보일러|치킨/)&&ok===false)return 'sizzle';
  if(m(/비치|오이|소세지|소시지|달걀|계란|맞|퍽|가격|싸움|주먹|때리|폭행|하극상/)&&ok===false)return 'hit';
  if(m(/영창|경찰|체포|수배|사이렌|음주|단속/)&&ok===false)return 'siren';
  if(m(/알람|새벽|기상/))return 'alarm';
  if(m(/신천지|암웨이|다단계|귀신|저주|사이비/)&&ok===false)return 'scare';
  if(m(/월급|연봉|보너스|로또|투자|주식|코인|돈|입금|계좌/))return ok===false?'fail':'coin';
  if(m(/고백|연애|사랑|여자친구|썸|결혼|청혼|데이트/))return ok===false?'fail':'heart';
  if(m(/생일|축하|졸업/))return 'birthday';
  return null;
}
/* ===== 배경음악(자동 생성) ===== */
const BGM={mode:null,timer:null,next:0,step:0,bar:0};
const SC={ //[코드 진행(근음 Hz 4마디), 스케일, bpm, 파형, 음량]
  title:{ch:[[261.6,'M'],[220,'m'],[174.6,'M'],[196,'M']],sc:[0,2,4,7,9,12,14],bpm:112,w:'triangle',v:.075},
  kid:  {ch:[[261.6,'M'],[196,'M'],[220,'m'],[174.6,'M']],sc:[0,2,4,7,9,12,16],bpm:120,w:'triangle',v:.07},
  teen: {ch:[[220,'m'],[174.6,'M'],[261.6,'M'],[196,'M']],sc:[0,3,5,7,10,12,15],bpm:104,w:'square',v:.04},

function bgmSched(){
  if(!bgmOn||!sndOn||FAST||!BGM.mode||!AC||AC.state!=='running')return;
  const m=SC[BGM.mode];if(!m)return;
  const sp=60/m.bpm/2; // 8분음표
  while(BGM.next<AC.currentTime+.4){
    const t0=BGM.next,bar=Math.floor(BGM.step/8)%4,k=BGM.step%8,[root,q]=m.ch[bar],ratio=x=>Math.pow(2,x/12);
    const third=q==='M'?4:3;
    if(k===0){ // 베이스 + 패드
      bgmTone(root/2,sp*7.5,'sine',m.v*1.5,t0);
      [0,third,7].forEach(i=>bgmTone(root*ratio(i),sp*7.5,'sine',m.v*.35,t0));
    }
    if(k===4)bgmTone(root/2*1.5,sp*1.6,'sine',m.v,t0);
    if(BGM.mode!=='old'&&(k===2||k===6))noise_b(sp*.25,m.v*.18,t0); // 하이햇
    // 멜로디(아르페지오 + 가끔 쉼)
    if(Math.random()<.62){
      const deg=m.sc[(Math.random()*m.sc.length)|0],base=(k%2===0)?[0,third,7][(Math.random()*3)|0]:deg;
      bgmTone(root*2*ratio(base),sp*(Math.random()<.3?2.2:1.1),m.w,m.v*.9,t0);
    }
    BGM.step++;BGM.next+=sp;
  }
}

ev('ch_leftover',16,45,'🍗 찬호의 잔반 처리반','친구들과 즐겁게 먹고 나니 식탁에 남은 음식이 한가득이다. 찬호가 아무렇지 않게 접시를 하나씩 재민이 앞으로 밀기 시작한다. "재민아, 남기면 안 되지?" 눈 깜짝할 사이에 접시 탑이 재민이 앞에 쌓였다.',[

g('찬호에게 도로 밀어준다',.35,[{soc:2,hap:3},'접시를 되돌려 보내자 찬호가 "어... 그건..." 하다가 결국 다 먹었다. 이 순간 정의가 실현됐다.'],[{soc:-1,hap:-2},'밀어 보냈는데 찬호가 즉시 세 배로 밀어 보냈다. 접시 탑이 더 높아졌다.']),
g('포장해서 내일 점심으로 먹는다',.35,[{m:3,hap:2},'다음 날 도시락으로 완벽하게 부활했다! 식비 3만 원 절약, 찬호에게 고마워해야 하나 고민했다.'],[{hap:-2},'포장을 급하게 하다가 가방 안에서 국물이 터졌다. 교과서가 전부 양념 냄새로 물들었다.']),
c('"나 배불러서 더는 못 먹어"라고 정직하게 말한다',{},'찬호가 "그럼 어쩔 수 없지~" 하며 직원을 불러 포장을 요청했다. 결국 포장 봉지는 재민이 손에 들려 있었다.')],{rep:4,w:1.2});
ev('ch_menu',16,45,'🍽️ 오늘의 메뉴는 정해져 있다','친구들과 밥 먹으러 갔다. 찬호가 메뉴판을 펴며 상냥하게 묻는다. "재민아, 뭐 먹고 싶어?" 재민이가 대답하자 찬호는 "오~ 좋지!" 하고 고개를 끄덕인다. 그러고는 주문받으러 온 직원에게 말한다. "저희 이걸로 주세요." 그건 재민이가 말한 메뉴가 아니다. 찬호가 먹고 싶은 메뉴다. (늘 그랬다.)',[
g('먹고 싶은 메뉴를 강력하게 주장한다',.12,[{hap:8,soc:2,cha:2},'기적이 일어났다! 이번에는 재민이 메뉴가 주문됐다. 찬호가 "...오늘 컨디션이 좋네" 하며 입술을 깨물었다. 역사적인 순간이다.'],[{hap:-4,sts:3},'"오~ 마라탕 좋지!" 하더니 직원에게 "저희 갈비탕 4인분이요." 마라탕은 메뉴판 한구석에서 조용히 사라졌다.'],{k:'cha'}),
g('"투표로 정하자"고 제안한다',.15,[{soc:3,hap:5,chr:1},'투표 결과가 2대 2 동점! 가위바위보 끝에 재민이가 이겼다. 오늘은 재민이 메뉴다!'],[{soc:-1,hap:-3},'투표를 했는데 찬호가 "나는 두 표야"라며 규칙을 바꿨다. 결과는 당연히 찬호 메뉴.'],{k:'soc'}),
g('몰래 혼자 따로 주문한다',.2,[{hap:6,m:-2},'직원에게 살짝 속삭여서 재민이 메뉴만 따로 주문! 찬호의 시선이 느껴졌지만 맛은 최고였다.'],[{hap:-3,m:-2},'따로 시킨 메뉴가 제일 늦게 나왔다. 다 먹고 일어날 때쯤 도착해서, 식은 음식을 혼자 먹었다.']),
c('그냥 찬호 메뉴를 같이 먹는다',{},'찬호가 시킨 메뉴가 의외로 나쁘지 않다. 그런데 오늘도 재민이가 먹고 싶던 건 못 먹었다. 마음속으로 "다음엔 꼭..." 하고 다짐했다.')],{rep:3,w:1.4});
/* --- 회기역 자판기 커피 사건 (추억 이벤트): 진호·찬호·경연·세민·범수 전원 등장 --- */
ev('hg_rps',18,18,'🚇 고등학교 졸업앨범 촬영 가는 길','덕현고등학교(1회) 졸업앨범 사진을 찍으러 진호, 찬호, 경연, 세민, 범수와 함께 어린이대공원역으로 가는 지하철 안이다. 열차가 회기역에 정차하자 찬호가 신나서 외쳤다. "가위바위보 해서 진 사람이 내려서 자판기 커피 뽑아오기!" 진호는 팔짱을 끼고 비장한 표정, 경연은 벌써 손목 스트레칭 중, 세민은 확률을 계산하는 눈빛, 범수는 이미 보를 내려는 손모양이다. 문은 열려 있다. 정차 시간은 짧다. 재민이는 가위, 바위, 보 중 하나를 골라야 한다.',[
c('가위를 낸다 ✌️',{hap:-2,soc:-1,q:'hg_vending',f:['hoegi']},'"가위바위보!" 재민이는 가위를 냈다. 그런데 진호, 찬호, 경연, 세민, 범수 다섯 명이 전부 바위! 주먹 다섯 개가 일제히 재민이의 가위를 눌렀다. 재민이는 혼자 졌다. 같은 걸 낸 사람은 아무도 없다. 재민이가 내려야 한다.'),
c('바위를 낸다 ✊',{hap:-2,soc:-1,q:'hg_vending',f:['hoegi']},'"가위바위보!" 재민이는 바위를 냈다. 그런데 진호, 찬호, 경연, 세민, 범수 다섯 명이 전부 보! 모두가 짜고 친 듯한 완벽한 보였다. 경연은 박수까지 쳤다. 재민이는 혼자 졌다. 같은 걸 낸 사람은 아무도 없다. 재민이가 내려야 한다.'),
c('보를 낸다 🖐️',{hap:-2,soc:-1,q:'hg_vending',f:['hoegi']},'"가위바위보!" 재민이는 보를 냈다. 그런데 진호, 찬호, 경연, 세민, 범수 다섯 명이 전부 가위! 세민이 "확률적으로 재민이는 늘 보를 내더라"라고 중얼거렸다. 재민이는 혼자 졌다. 같은 걸 낸 사람은 아무도 없다. 재민이가 내려야 한다.')],{at:18,w:0});
Q('hg_vending','☕ 회기역 승강장의 자판기','재민이가 열차에서 내렸다. 승강장 한쪽에 자판기가 보인다. 열차는 30초 뒤에 출발한다. 열차 창문 너머로 친구들이 한마디씩 외친다. 진호: "재민아 뛰어!" 경연: "정차 시간 30초야!" 세민: "자판기 구형이면 동전 먼저 넣어!" 범수: "나는 블랙!" 찬호: "달달한 걸로 부탁해~" 재민이의 손에 동전이 쥐어져 있다.',[
g('동전을 넣고 믹스커피 버튼을 누른다',.3,[{hap:8,soc:3,cha:1},'커피가 나왔다! 종이컵을 들고 문이 닫히기 직전에 탑승! 찬호가 "달달해!" 하며 환호했고, 진호는 일어나 박수를 쳤다. 이 순간만은 재민이가 영웅이다.'],[{hap:-3,sts:4,q:'hg_late'},'동전을 넣었는데 버튼을 눌러도 반응이 없다. 반환 레버를 눌러도 동전이 안 나온다. 세민이 창문 너머로 "그거 동전 걸린 거야!" 외쳤지만 문이 닫히기 시작했다...'],{k:'int'}),
g('천 원짜리 지폐를 넣는다',.2,[{hap:6,soc:2},'지폐가 한 번에 쏙 들어갔다! 커피를 뽑아 들고 전속력으로 달렸다. 경연이 "자세 좋아!" 하며 응원했고, 마지막 칸에 몸을 던져 탑승 성공!'],[{hap:-3,sts:4,q:'hg_late'},'구겨진 천 원짜리를 자판기가 계속 뱉어낸다. 펴 보고, 다시 넣고, 또 뱉고... 범수가 창문 너머로 "접어서 넣어 봐!" 외쳤지만 열차는 이미 떠났다.'],{k:'str'}),
g('교통카드를 대 본다',.1,[{hap:8,soc:3,cha:2},'기적처럼 결제가 됐다! 커피가 우르르 쏟아졌다. 친구들이 열차 안에서 환호했다. 이 자판기 카드 되는 줄 몰랐는데!'],[{hap:-2,sts:3,q:'hg_late'},'"삑- 결제 불가." 이 자판기는 현금 전용이었다. 한 번 더 대 봤지만 마찬가지. 진호가 창문 너머로 고개를 저었다. 열차가 출발했다.'],{k:'soc'}),
g('커피 말고 그냥 눈에 띄는 음료를 뽑는다',.25,[{hap:5,soc:1},'커피 대신 캔커피 같은 뭔가가 나왔다. 일단 들고 탑승! 찬호가 "이거 달다! 나 이거 마실래" 하며 받아 갔다.'],[{hap:-3,sts:3,q:'hg_late'},'뭘 눌렀는지 모르게 뭔가가 쿵 하고 떨어졌다. 꺼내려는 사이 열차 문이 닫혔다. 손에는 정체불명의 음료만 들려 있다. 범수가 창문에 얼굴을 붙이고 웃고 있다.'],{k:'cha'}),
c('빈손으로 열차로 뛰어 돌아온다',{q:'hg_late',hap:-1},'커피를 못 뽑은 채 뛰었다. 가까스로 열차에는 탔지만 다섯 명의 시선이 일제히 재민이의 빈손으로 쏟아졌다. 땀방울만 있다.')]);
Q('hg_late','😅 "커피는?"','결국 재민이는 커피를 뽑아오지 못했다. 어린이대공원역에 도착하자 친구들이 한 명씩 입을 열었다. 찬호: "내 달달이는?" 범수: "나 블랙 시켰는데." 진호: "군대였으면 얼차려감인데." 경연: "뛰는 자세부터 틀렸어." 세민: "그 자판기 모델 알려 줘, 내가 원인 분석해 볼게." 모두의 시선이 재민이에게 쏠려 있다. 이 사건은 오래도록 단톡방 소재가 될 것이다.',[
g('"자판기가 고장이었다"고 우긴다',.25,[{soc:2,hap:3,cha:1},'"진짜야! 그 자판기가 고장이었어!" 세민이 "음, 구형 동전 투입구라면 그럴 수 있어"라고 편들어 줘서 분위기가 풀렸다. 찬호도 "그럼 어쩔 수 없지~" 하며 넘어갔다.'],[{soc:-1,hap:-2},'"정말 고장이었다니까!" 하는 순간 범수가 "나 어제 그 자판기 썼는데 잘 나오던데?" 하고 폭로했다. 변명은 산산조각, 전원 폭소.'],{k:'cha'}),
g('"다음에 내가 쏜다"며 약속한다',.3,[{soc:3,hap:2,chr:2},'친구들이 "오~ 약속했다!" 하며 박수를 쳤다. 사진 촬영 후 분식집에서 재민이가 쏜 어묵 국물이 그날의 커피를 대신했다. 찬호는 두 그릇 먹었다.'],[{soc:-1,hap:-3,m:-3},'약속은 했는데 찬호가 "오늘 바로 쏘자!"고 외쳐서, 졸업앨범 촬영 후 분식집에서 다섯 명 몫을 전부 재민이가 계산했다. 커피 하나 못 뽑은 대가가 컸다.'],{k:'chr'}),
g('사진 촬영 때 제일 환하게 웃는다',.3,[{hap:6,soc:3,cha:2},'졸업앨범 속 재민이는 활짝 웃고 있다. 사진기사님이 "자연스럽네요!" 하셨고, 뒤에서 진호·찬호·경연·세민·범수가 일제히 브이를 하고 있다. 회기역 자판기 사건과 함께 평생 남을 사진이다.'],[{hap:-2,sts:2},'환하게 웃으려다 얼굴 근육이 경련을 일으켰다. 졸업앨범 속 재민이의 표정은 웃는 건지 우는 건지 알 수 없다. 뒤에서 범수가 몰래 찍은 사진이 단톡방에 올라갔다.'],{k:'cha'}),
c('웃으며 "내가 졌다"고 인정한다',{},'"인정. 그날 가위바위보에서 진 것도, 커피를 못 뽑은 것도 나였다." 친구들이 폭소했다. 이 이야기는 졸업 후에도 술자리 단골 안주가 됐고, 찬호는 오늘도 "내 달달이는?"을 외친다.')]);
/* --- 거제도 여행 가는 지하철: 비닐봉지 사건 (친구들 전원 외면) --- */
ev('geoje_bag',19,35,'🚇 거제도 가는 길, 지하철 안에서','친구들과 거제도 여행을 가려고 진호, 찬호, 경연, 세민, 범수와 지하철을 탔다. 그런데 갑자기 속이 울렁거린다. 식은땀이 나고 얼굴이 하얘진다. 이대로는 큰일이다. 재민이는 용기를 내 외쳤다. "저기... 혹시 비닐봉지 있는 사람 있어요?!" 지하철 안이 순식간에 조용해졌다. 그런데 이상하다. 진호는 창밖의 어둠을 응시하고, 찬호는 이어폰을 꼈고, 경연은 폰을 보는 척, 세민은 노선도를 정독 중, 범수는 눈을 감고 자는 척을 한다. 다섯 명 모두 재민이와 눈을 마주치지 않는다.',[
g('더 큰 소리로 다시 외친다 "비닐봉지요!!"',.25,[{soc:2,hap:3,chr:1},'맞은편 아주머니가 가방에서 깨끗한 비닐봉지를 꺼내 주셨다! "어이구, 젊은이 괜찮아요?" 따뜻한 낯선 사람의 도움에 눈물이 났다. 친구 다섯 명은 그제야 "아... 재민이 괜찮아?" 하며 눈길을 돌렸지만 이미 늦었다.'],[{hap:-4,sts:5,soc:-1,f:['bag']},'두 번째 외침은 지하철 칸 전체에 메아리쳤다. 모든 승객이 일제히 쳐다봤다. 하지만 봉지를 내미는 사람은 없었다. 진호는 한 칸 옆으로 이동했고, 범수는 더 깊이 자는 척을 했다.'],{k:'cha'}),
g('친구들에게 조용히 말한다 "야... 나 봉지 좀..."',.2,[{soc:3,hap:2},'용기를 내어 친구 팔을 붙잡았다. 세민이 갑자기 가방을 뒤지더니 "이거 쓸래? 새 거야" 하며 비닐봉지를 꺼냈다. 의리가 완전히 사라진 건 아니었다.'],[{hap:-5,sts:6,soc:-2,f:['bag']},'찬호의 팔을 붙잡았더니 찬호가 이어폰을 빼며 "응? 뭐라고?" 하고는 다시 꼈다. 경연은 "나 지금 통화 중..." 하며 폰을 귀에 댔다. 아무 소리도 안 나오는 폰을. 완벽한 외면이다.'],{k:'soc'}),
g('다음 역에서 급히 내린다',.35,[{hap:3,sts:-2},'문이 열리자마자 승강장으로 뛰쳐나갔다. 벤치에 앉아 한숨을 돌리니 속이 가라앉았다. 친구들은 열차 안에서 "내려?" 하는 표정으로 쳐다보다가 문이 닫혔다. 다음 열차에서 만나기로 했다.'],[{hap:-4,sts:4,f:['bag']},'급히 내리려 했는데 닫히는 문 사이로 가방이 끼었다. 친구들은 창문 너머로 손을 흔들며 "화이팅!"을 외쳤다. 아무도 내려오지 않았다. 재민이는 혼자 승강장에서 가방을 구출했다.'],{k:'str'}),
g('입을 꾹 다물고 참는다',.3,[{sts:2,hap:2,str:1},'눈을 감고 심호흡을 하며 버텼다. 다행히 다음 역에서 열차가 흔들림 없이 달려 속이 가라앉았다. 친구들은 그제야 "어? 재민이 얼굴 왜 그래?" 하고 이제 알아챘다. 이미 상황은 끝났다.'],[{hap:-5,sts:6,f:['bag']},'참다 참다 얼굴이 새파래졌다. 5분이 5시간 같았다. 친구들은 끝까지 모르는 척했다. 거제도에 도착하기도 전에 재민이의 체력은 바닥났다.'],{k:'str'}),
c('손으로 입을 막고 화장실을 찾아 뛴다',{hap:-2,sts:2,f:['bag']},'열차 칸을 가로질러 화장실을 찾아 달렸다. 뒤에서 승객들이 길을 비켜 줬다. 겨우 도착했다. 돌아와 보니 친구 다섯 명은 여전히 어딘가를 보고 있었다. 재민이를 못 본 척하던 시선이 이제야 재민이에게 돌아왔다.')],{at:24,w:0});
/* --- 선재도 여행: 끝나지 않는 알람 / 택시의 밤 --- */
ev('sj_alarm',20,40,'⏰ 선재도의 밤, 끌 수 없는 알람','선재도 여행 첫날 밤. 진호, 찬호, 경연, 세민, 범수와 한 방에서 곤히 자는데 폰에서 갑자기 사람 목소리가 터져 나왔다. "재민! 재민! 재민! 일어나!!" 재민이 이름을 녹음한 음성이 알람으로 등록돼 있다. 볼륨은 최대, 무한 반복. 끄는 버튼을 눌렀는데... 꺼지지 않는다. 방 안 모두가 눈을 뜨고 재민이를 쳐다본다.',[
c('끄기 버튼을 미친 듯이 연타한다',{hap:-3,sts:5,q:'sj_taxi'},'연타할수록 "재민!! 재민!!" 소리가 커진다. 이 알람은 버튼을 누르면 더 크게 우는 구조인 듯하다. 범수가 이불로 머리를 덮었다.'),
c('폰을 재부팅한다',{hap:-3,sts:5,q:'sj_taxi'},'재부팅하는 동안에도 "재민!" 소리가 울렸고, 켜지자마자 알람이 처음부터 다시 시작됐다. 이 알람은 재부팅에도 살아남는 전설의 알람이다.'),
c('폰을 이불 속에 파묻는다',{hap:-2,sts:4,q:'sj_taxi'},'이불 속에서 "재민!!!" 소리가 먹먹하게 울려 퍼진다. 방 전체가 이불 라디오가 됐다. 경연이 "너 방금 폰한테 이불 덮어준 거야?" 하고 물었다.'),
c('범인을 찾는다 (찬호를 노려본다)',{hap:-2,sts:4,q:'sj_taxi'},'찬호가 천장을 보며 휘파람을 불었다. "나 아닌데~" 세민이 "목소리 분석해 보니 이거 찬호 폰으로 녹음한 거야"라고 결론 냈지만, 알람은 여전히 울린다.'),
c('배터리가 닳을 때까지 가만히 기다린다',{hap:-4,sts:6,q:'sj_taxi'},'새벽 3시 20분. 폰 배터리가 0%가 되며 알람이 끝났다. 방에 깊은 정적과 어둠이 찾아왔다. 아무도 말하지 않았다. 다섯 명의 한숨 소리만 들렸다.')],{at:26,w:0});
Q('sj_taxi','🚕 선재도 이튿날 밤, 택시 안','선재도 이튿날 밤. 저녁 식사를 마치고 친구들과 택시를 타고 숙소로 돌아가는 길이다. 전날 알람 때문에 잠을 설친 데다 구불구불한 해안도로까지 만나 속이 또 울렁거린다. 지난번 지하철에서의 교훈이 떠올랐다. 이번엔 가방에 비닐봉지를 미리 챙겨 두었다. 기사님이 룸미러로 이쪽을 보고 있고, 옆자리 친구들은 또 일제히 창밖을 본다. 외면이다.',[
g('미리 챙긴 비닐봉지를 조용히 꺼낸다',.3,[{hap:2,sts:-1,chr:1},'조용히 비닐봉지의 신세를 졌다. 또다. 기사님은 아무 말 없이 창문을 조금 열고 박하사탕을 건네 주셨다. "젊은이, 괜찮아요." 택시 안에 따뜻한 침묵이 흘렀다.'],[{hap:-4,sts:5,f:['bag']},'결국 비닐봉지에 또 토했다. 그런데 하필 봉지에 작은 구멍이 있었다. 기사님이 룸미러로 이쪽을 보며 한숨을 길게 쉬었다. 친구들은 끝까지 창밖의 바다를 사랑했다.'],{k:'str'}),
g('"기사님 잠깐만 세워 주세요!"라고 외친다',.25,[{hap:2,sts:-2},'기사님이 갓길에 급히 차를 세웠다. 재민이는 문을 열고 달려나갔다. 바닷바람 속에서 숨을 고르고 나니 속이 가라앉았다. 친구들은 "괜찮아?" 하고 이제야 물었다.'],[{hap:-4,sts:5,f:['bag']},'기사님이 "여기 정차 금지예요" 하며 계속 달렸다. 재민이는 결국 비닐봉지에 또 토했다. 친구들은 이번에도 한마음 한뜻으로 창밖만 봤다.'],{k:'cha'}),
g('친구들에게 "봉지 하나만 더!"라고 부탁한다',.1,[{soc:3,hap:2},'세민이 가방에서 봉지를 꺼냈다. "너 지난번에도 이랬잖아. 그래서 챙겼어." 이번엔 진짜 도움을 받았다. 다섯 명 중 한 명은 의리가 있다.'],[{hap:-5,sts:6,f:['bag']},'다섯 명이 동시에 창밖을 보며 "와 바다 예쁘다"를 외쳤다. 재민이의 요청은 허공에 흩어졌다. 결국 가지고 있던 봉지에 또 토했다. 친구들은 끝까지 바다에 감탄했다.'],{k:'soc'}),
c('창밖을 보며 참아 보지만 결국...',{hap:-4,sts:5,f:['bag']},'30분을 버텼다. 하지만 마지막 커브길에서 무너졌다. 비닐봉지에 또 토했다. 택시 기사님의 한마디가 오래 남았다. "또예요?" 재민이는 아무 말도 하지 못했다.')]);

/* --- PC방 상가 화장실: 문 위로 나타난 폰 --- */
ev('pc_toilet',19,30,'🚽 PC방 상가 화장실의 비명','PC방에서 라면과 콜라를 먹던 중 갑자기 배가 비상 신호를 보냈다. 재민이는 상가 화장실로 전력질주했다. 칸에 들어가 문을 잠근 그 순간, 문 위로 폰을 든 손이 쑥 올라왔다. 키가 멀대 같이 큰 누군가가 문 너머로 사진을 찍으려 하고 있다. "찰칵!" 얼굴은 보이지 않는다. 정체불명의 큰 키 인물은 번개처럼 사라졌다.',[
c('"야!!! 누구야!!!" 큰 소리로 외친다',{hap:-3,sts:5,q:'pc_reveal'},'외침이 상가 복도에 쩌렁쩌렁 울렸다. 이미 범인은 사라진 뒤였다. 옆 칸에서 누군가 조용히 물을 내리고 나갔다. 부끄러움은 재민이의 몫이다.'),
c('일단 볼일부터 마무리한다',{hap:-2,sts:3,q:'pc_reveal'},'가장 급한 일부터 처리했다. 마음의 평화를 되찾는 동안에도 문 위에서 폰이 다시 올라오지 않을까 계속 위를 쳐다봤다. 아무 일도 일어나지 않았다. 일단은.'),
c('문을 열고 쫓아가려 한다',{hap:-3,sts:5,q:'pc_reveal'},'마음은 이미 뛰쳐나갔는데 현실은 갑작스러운 상황이라 일단 자리에서 일어나지 못했다. 겨우 정리하고 복도로 나갔을 땐 아무도 없었다. 복도 끝 계단에서 누군가 급히 내려가는 발소리만 들렸다.'),
c('조용히 침착하게 앉아 있는다',{hap:-2,sts:3,q:'pc_reveal'},'이럴 땐 아무것도 안 하는 게 최선이다. 재민이는 문 위를 응시한 채 5분을 앉아 있었다. 문 위에서는 아무것도 올라오지 않았다. 그런데 어디선가 낮게 킥킥대는 소리가 들렸다.')],{at:22,w:0});
Q('pc_reveal','📱 단톡방에 올라온 사진','PC방으로 돌아와 자리에 앉으려는데 단톡방이 울렸다. 친구 단톡방에 사진 한 장이 올라와 있다. 문 위로 찍은 각도에 놀란 표정의 재민이 얼굴만 찍혀 있고, 아래에는 한 줄이 적혀 있다. "재민이 화장실 습격 성공 ㅋㅋㅋ" 업로더는 찬호. 사실 키가 멀대같이 큰 그 사람이 찬호였다. 단톡방에는 진호, 경연, 세민, 범수의 "ㅋㅋㅋㅋㅋㅋ" 가 연달아 올라오고 있다.',[
g('"이찬호 너 이리 와!!"라고 쫓아간다',.3,[{soc:2,hap:3},'PC방으로 돌아온 찬호를 붙잡아 헤드락을 걸었다! "내가 졌다!" 찬호가 항복하며 음료수를 사기로 했다. 이날의 승자는 재민이다.'],[{hap:-3,sts:3,soc:-1},'찬호는 키가 커서 쫓아가도 다리 길이로 돌파했다. 재민이는 PC방 의자를 붙잡고 헐떡이며 "너 내일 두고 봐"라고만 외쳤다.'],{k:'str'}),
g('사진 삭제를 요구한다',.3,[{soc:2,hap:3},'"사진 지워." 찬호가 한참 뜸을 들이더니 결국 삭제했다. 단톡방의 사진도 사라졌다. 하지만 이미 캡처한 세 명이 있다.'],[{hap:-3,sts:3},'"사진 지워." "싫은데~" 찬호가 되레 사진을 즐겨찾기에 저장하며 프로필 사진으로 설정했다.'],{k:'chr'}),
g('똑같이 갚아 준다 (찬호 화장실 습격 계획)',.15,[{soc:4,hap:6,cha:1},'며칠 뒤 찬호가 화장실에 들어가자 문 위로 재민이의 폰이 쑥 올라갔다. "찰칵!" 찬호의 놀란 얼굴이 단톡방에 올라갔다. 복수 완료! 서로 사이가 오히려 더 좋아졌다.'],[{hap:-3,sts:3},'복수하려고 문 위로 폰을 올렸는데 키가 모자라서 문에 닿지 않았다. 찬호가 안에서 "ㅋㅋㅋ 키 부족" 하는 소리가 들렸다.'],{k:'cha'}),
c('웃으며 "아 진짜 ㅋㅋ"라고 넘긴다',{},'결국 같이 웃을 수밖에 없다. 단톡방에는 하루 종일 "ㅋㅋㅋ"가 올라왔다. 이 이야기는 평생 술자리 단골 안주가 될 운명이다.')]);
/* --- 거제도 돌아오는 길: 터미널의 훌라 --- */
ev('geoje_terminal',19,35,'🃏 거제도 버스터미널, 훌라의 늪','거제도 여행을 마치고 돌아가는 길. 버스터미널 대합실에서 출발 시간을 기다리고 있다. 찬호가 가방에서 카드를 꺼내더니 "딱 한 판만 하자"며 훌라를 시작했다. 신발은 어느새 벗어 두고 의자 밑에 보라색 뉴발란스를 가지런히 놓았다. 한 판이 두 판이 되고, 두 판이 열 판이 됐다. 찬호의 눈빛은 이미 훌라에 먹혀 있다. 진호, 경연, 세민, 범수는 슬슬 짐을 챙기기 시작하는데 버스 출발 안내 방송이 나온다. 찬호는 카드를 쥔 채 "잠깐만, 이거 한 판만!"을 외친다. 의자 밑의 보라색 뉴발란스는 눈에 들어오지 않는 모양이다.',[
g('"찬호야, 신발!" 크게 외친다',.15,[{soc:2,hap:4},'찬호가 번쩍 고개를 들고 의자 밑을 본 뒤 번개같이 뉴발란스를 신었다! 아슬아슬하게 버스에 올랐다. "아 맞다 내 신발!" 진호가 박수를 쳤다. 이번만큼은 재민이의 한마디가 찬호를 구했다.'],[{hap:-2,sts:2,q:'geoje_shoes'},'"응 응 알았어" 찬호는 카드에서 눈을 떼지 않은 채 대답했다. 알았다고 한 사람의 눈은 훌라에 가 있다. 결국 보라색 뉴발란스는 의자 밑에 남겨진 채 버스가 출발했다.'],{k:'chr'}),
g('찬호 신발을 몰래 내 가방에 챙긴다',.2,[{chr:3,soc:3,hap:3},'재민이는 조용히 뉴발란스를 가방에 넣었다. 버스 안에서 찬호가 "내 신발!!" 하며 맨발을 보고 놀랐을 때 재민이가 가방에서 짠 하고 신발을 꺼냈다. 찬호가 눈물을 글썽이며 "재민아 너밖에 없다"고 했다.'],[{hap:-2,sts:2,q:'geoje_shoes'},'가방에 넣으려다 갑자기 버스 출발 방송이 크게 나와서 놀라 신발을 떨어뜨렸다. 그 사이 친구들이 재민이를 끌고 버스에 탔다. 보라색 뉴발란스는 터미널 바닥에 홀로 남았다.'],{k:'chr'}),
g('훌라 판에 합류해서 찬호를 이긴다',.2,[{soc:2,hap:6,int:1},'재민이가 카드를 낚아채 한 판을 이기자 찬호가 "어?" 하고 정신이 번쩍 들었다. 그 순간 버스 안내 방송이 울려서 찬호가 "신발!!" 하며 뉴발란스를 들고 뛰었다. 재민이가 사실상 찬호를 구했다.'],[{hap:-3,sts:3,q:'geoje_shoes'},'재민이도 한 판만 하고 가려다 그만 훌라에 빠졌다. 두 사람이 동시에 "한 판만 더!"를 외쳤고, 진호와 경연이 두 사람을 끌고 버스에 올랐다. 보라색 뉴발란스는 의자 밑에 얌전히 남았다.'],{k:'int'}),
c('말없이 버스에 먼저 올라탄다',{hap:-1,q:'geoje_shoes'},'재민이는 조용히 버스에 올랐다. 보라색 뉴발란스는 대합실 의자 밑에서 주인을 기다리고 있다. 잠시 후 찬호가 카드를 들고 뛰어 들어왔다. 신발은 어디에도 없다.')],{at:24,w:0});
Q('geoje_shoes','👟 보라색 뉴발란스는 어디에','버스가 출발한 지 20분이 지났다. 찬호가 문득 자기 발을 내려다보았다. 양말 바람이다. "...내 신발?" 찬호의 얼굴이 하얗게 질렸다. "내 보라색 뉴발란스!!!" 버스 안이 조용해졌다. 진호는 천장을 보고, 경연은 허리를 접어 웃고, 세민은 "터미널 분실물 센터 번호가 있는데"를 중얼거리고, 범수는 이미 사진을 찍고 있다. 재민이는 이 장면의 목격자다.',[
g('찬호에게 비닐봉지를 건넨다 (신발 대신 발 감싸기)',.3,[{soc:3,hap:5},'재민이가 가방에서 비닐봉지를 꺼내 찬호 발에 씌웠다. "...어쩐지 익숙한데?" 찬호가 말했다. 비닐봉지는 이번에도 재민이의 영웅이었다. 휴게소에서 슬리퍼를 사 신기로 했다.'],[{hap:-3,sts:2},'비닐봉지를 씌웠지만 걷자마자 비닐이 사각사각 소리를 내며 찢어졌다. 찬호가 "이건 아닌 것 같아"라고 하자 다 같이 폭소했다.'],{k:'cha'}),
g('"찬호야, 이건 훌라 때문이야"라고 위로한다',.25,[{chr:2,soc:2,hap:3},'찬호가 "...맞아. 훌라가 나쁜 거야"라며 고개를 끄덕였다. 진호가 "아니 네가 나쁜 거야"라고 정정했지만 분위기는 풀렸다.'],[{hap:-2,sts:2,soc:-1},'"훌라 때문이야"라고 했더니 찬호가 "아니 나 때문이야... 훌라 때문이야... 아니 신발 때문이야" 하며 횡설수설했다. 위로는 실패했다.'],{k:'chr'}),
g('터미널에 전화해서 분실물을 확인한다',.3,[{int:2,soc:2,hap:4},'세민이 전화번호를 알려 주고 재민이가 전화를 걸었다. 직원: "보라색 뉴발란스요? 의자 밑에 있네요." 다음 날 택배로 부쳐 받기로 했다. 찬호가 눈물을 흘리며 "재민아 사랑해"라고 했다.'],[{hap:-3,sts:3},'전화를 걸었더니 직원이 "신발이요? 지금 청소 중이어서 확인이 안 되네요"라고 했다. 이후 연락은 끊겼다. 보라색 뉴발란스는 영원히 거제도에 남았다.'],{k:'int'}),
c('웃지 못하고 창밖을 바라본다',{hap:-1},'눈앞의 맨발 찬호와 사진 찍는 범수와 폭소하는 경연 사이에서, 재민이는 조용히 바다를 바라봤다. 이 여행은 앞으로 몇 년간 이 이야기로 회자될 것이다. 보라색 뉴발란스는 지금도 거제도 어딘가에 있을지 모른다.')]);
/* --- 거제도 여행 연쇄: 지하철 → 횟집 바가지 → 보일러 → 버스터미널 --- */
Q('geoje_hwe','🐟 거제도 횟집의 계산서','거제도에 도착해서 저녁을 먹으러 횟집에 들어갔다. "싱싱한 회 한 접시 주세요." 가격은 묻지 않았다. 한참 뒤 접시 가운데에 회 몇 점이 외롭게 놓여 나왔다. 그런데 계산서를 보니 "회 대자 25만 원, 매운탕 7만 원, 공깃밥 5천 원 x 6, 야채 3만 원"이라고 적혀 있다. 진호, 찬호, 경연, 세민, 범수는 이상하게 아직 아무 말이 없다. 모두의 눈이 재민이에게 쏠려 있다.',[
g('"사장님, 가격이 너무 비싼데요" 하고 항의한다',.25,[{m:-12,soc:2,hap:4,cha:1},'재민이가 용기를 내자 사장님이 "아이고, 손님들 젊으시니까~" 하며 매운탕 값을 빼 주셨다. 반찬도 한 접시 더 나왔다. 친구들이 재민이를 영웅이라 불렀다.'],[{m:-40,hap:-5,sts:5},'"메뉴판에 다 적혀 있어요." 사장님의 한마디에 말문이 막혔다. 메뉴판은 입구에 아주 작게 붙어 있었고, 결국 40만 원을 전부 계산했다.'],{k:'cha'}),
g('"카드 결제를 취소하고 경찰을 부르겠다"고 말한다',.15,[{m:-15,soc:1,hap:3},'사장님의 표정이 급변하더니 "아이고, 그럼 20만 원만 하시죠" 하며 즉시 계산서를 수정했다. 경찰 얘기가 나오자 모두 얌전해졌다.'],[{m:-40,hap:-6,sts:6},'"부르세요." 사장님이 오히려 휴대폰을 건네며 여유롭게 말했다. 눈치를 보다 결국 40만 원을 결제했다. 경찰은 부르지 않았다. 아니, 못 불렀다.'],{k:'int'}),
g('"후기에 사실대로 남기겠다"고 말한다',.2,[{m:-18,soc:2,hap:4},'사장님이 "후기는 ㅎㅎ 서비스 드릴게요~" 하며 소주 한 병을 서비스로 줬다. 계산서도 슬그머니 줄어들었다. 후기의 힘은 위대하다.'],[{m:-40,hap:-4,sts:4},'"네, 후기 남기세요~" 사장님이 해맑게 웃었다. 재민이는 40만 원을 결제하고 나와서 별점 1개를 남겼다. 사장님은 이미 100개가 넘는 별 1개 후기에 익숙한 듯했다.'],{k:'soc'}),
c('아무 말 없이 그냥 결제한다',{m:-40,hap:-4,sts:3},'재민이는 조용히 카드를 내밀었다. "40만 원입니다." 결제음이 마음속에 크게 울렸다. 친구들은 "그래도 맛있었다"며 위로했다. 맛은 있었다. 회는 정말 맛있었다. 문제는 가격뿐이다.')]);
Q('geoje_boiler','🔥 보일러의 습격','숙소의 방은 바닥이 차가웠다. 보일러 조절기 다이얼에 0부터 10까지 숫자가 적혀 있다. 재민이는 이걸 "0부터 10분"까지의 타이머라고 착각했다. "10분이면 짧지!" 하고 다이얼을 최대 10으로 돌려놓고 이불을 덮고 누웠다. 그런데 30분쯤 지나자 바닥이 점점 뜨거워지고 이불 쪽에서 이상한 냄새가 올라온다. 장판이 노릇노릇하게 변하고 있다. 다섯 명이 동시에 소리쳤다. "재민아 뭐 한 거야?!"',[
g('황급히 창문을 열고 보일러를 끈다',.3,[{hap:2,sts:-2,chr:1},'재빠르게 대처해서 이불의 일부만 눌었다. "아... 이게 0에서 10분이 아니라 온도였구나." 재민이는 큰 깨달음을 얻었다. 사장님께 솔직히 말하자 이불 한 채 값만 내라고 하셨다.'],[{m:-15,hap:-4,sts:5},'창문을 열었지만 연기와 냄새가 이미 방 전체에 퍼졌다. 이불은 시커멓게 눌었고 장판에는 큼직한 자국이 남았다. 변상 15만 원이 확정됐다.'],{k:'int'}),
g('사장님께 솔직하게 털어놓는다',.25,[{m:-10,chr:3,hap:2},'"죄송합니다, 보일러를 분 단위로 착각했어요." 사장님이 웃음을 참으며 "이런 분 처음이에요" 하셨다. 이불만 변상하고 장판은 봐 주셨다. 솔직함이 승리했다.'],[{m:-30,hap:-5,sts:5},'사장님이 방에 들어와 장판을 보고 한숨을 쉬었다. "이불 한 채, 장판 교체, 환기 서비스까지 30만 원이요." 변상 금액이 눈덩이처럼 불어났다.'],{k:'chr'}),
g('모른 척하고 이불을 뒤집어 놓는다',.1,[{hap:3,sts:-1},'이불을 뒤집어 놓자 의외로 티가 안 났다. 다음 날 체크아웃 때 아무도 몰랐다. 하지만 재민이의 양심은 조용히 불타고 있다.'],[{m:-35,hap:-6,sts:7,chr:-2},'이불을 뒤집었지만 냄새는 숨길 수 없었다. 사장님이 방에 들어오자마자 "무슨 냄새죠?"라고 했고, 증거 인멸은 실패했다. 변상금에 가산 요금까지 붙었다.'],{k:'cha'}),
c('친구들과 함께 방을 환기하며 웃는다',{m:-20,hap:-1,soc:2},'다섯 명이 창문을 활짝 열고 이불 부채질을 하며 새벽을 보냈다. 이날의 사건은 평생 단톡방 소재가 될 것이다. 변상금 20만 원은 다 같이 나누기로 했다. 하지만 아무도 나누지 않았다.')]);
/* --- 건강: 족저근막염 · 치핵 절제 · 치아 교정 --- */
ev('plantar',27,58,'🦶 아침의 첫 발걸음','아침에 일어나서 첫 발을 바닥에 디디는 순간 발뒤꿈치에 번개가 쳤다. 걸을 때마다 찌릿한 통증이 이어진다. 병원에 가 보니 족저근막염이라고 한다. "많이 걷고 오래 서 있지 않으셨나요?" 의사 선생님의 질문에 재민이는 뜨끔했다.',[
g('체외충격파 치료를 받는다 (30만 원)',.3,[{m:-30,str:5,hap:3,sts:-3},'치료를 몇 번 받으니 발뒤꿈치의 번개가 잦아들었다. 이제 아침에 눈 뜨는 게 덜 무섭다. 의사 선생님이 "운동화부터 바꾸세요"라고 하셨다.'],[{m:-30,str:-1,hap:-3,sts:3},'충격파 치료를 받았는데 치료 중에 비명을 질렀다. 통증이 더 심해진 느낌이다. 치료 효과는 몇 주 뒤에야 나타난다고 한다.'],{k:'str'}),
g('깔창을 맞추고 스트레칭을 한다 (10만 원)',.3,[{m:-10,str:3,hap:2},'맞춤 깔창과 종아리 스트레칭이 의외로 잘 맞았다. 한 달 후 발뒤꿈치가 훨씬 편해졌다. 발이 이렇게 소중한 줄 몰랐다.'],[{m:-10,hap:-2,sts:2},'깔창을 맞췄는데 신발에 안 들어갔다. 스트레칭은 3일 하다가 귀찮아서 포기했다. 통증은 그대로다.'],{k:'int'}),
g('운동화를 새로 산다 (15만 원)',.3,[{m:-15,str:2,hap:4,cha:1},'쿠션 좋은 운동화를 사서 신었더니 발이 구름 위를 걷는 것 같다. 멋지다는 소리까지 들었다. 발이 살고 지갑이 죽었다.'],[{m:-15,hap:-2},'새 운동화는 예뻤지만 발에 안 맞았다. 뒤꿈치가 까져서 다시 반창고 신세가 됐다. 15만 원이 허공으로 날아갔다.'],{k:'cha'}),
c('참고 계속 걷는다',{hap:-4,str:-3,sts:3},'아침마다 발뒤꿈치를 부여잡고 걷는 재민이. 통증은 점점 심해졌고 걷는 속도가 느려졌다. 회사에서는 "왜 이렇게 천천히 걸으세요?"라는 질문을 자주 받는다.')],{once:1,w:3});
ev('hemo_op',30,60,'🏥 치핵 절제술 입원','치질이 계속 심해져서 병원에 갔더니 의사 선생님이 차분히 말했다. "치핵 절제술을 권합니다." 입원은 3일, 회복은 몇 주. 재민이는 한동안 서서 일하는 삶을 살아야 할지도 모른다. 병원 침대 위에서 고민이 시작됐다.',[
Object.assign(g('수술을 받는다 (300만 원)',.4,[{m:-300,str:-2,hap:3,sts:-8},'수술은 깔끔하게 끝났다. 처음 며칠은 서서 먹고 서서 TV를 봤지만, 2주 후부터는 편하게 앉을 수 있었다. 진작 할걸 하는 후회가 들었다.'],[{m:-300,str:-4,hap:-3,sts:2},'수술은 무사히 끝났지만 회복이 생각보다 오래 걸렸다. 한 달 동안 도넛 방석이 재민이의 생명줄이었다. 병실 간호사 선생님과 친구가 됐다.'],{k:'str'}),{need:300}),
c('보존 치료로 버텨 본다',{hap:-2,sts:3,m:-20},'약과 좌욕으로 버텨 보기로 했다. 의사 선생님이 "언젠간 수술해야 할 거예요"라고 말했다. 재민이는 조용히 도넛 방석을 주문했다.'),
c('수술을 미루고 일단 퇴원한다',{hap:-3,str:-2,sts:4},'일이 바쁘다는 핑계로 퇴원했다. 통증은 계속되고 병원 예약 문자는 계속 도착한다. 병원은 재민이를 잊지 않았다.')],{once:1,w:3});
ev('braces',19,32,'🦷 치아 교정을 시작할까','치과에서 "교정하면 인상이 훨씬 좋아질 거예요"라는 말에 마음이 흔들렸다. 기간은 약 2년, 비용은 300만 원 안팎이다. 거울 속 자신을 한참 바라봤다. 입안에 철길이 놓이는 상상을 하자 벌써 입이 아프다.',[
Object.assign(g('철제 교정을 시작한다 (300만 원)',.4,[{m:-300,cha:5,hap:3,sts:2},'2년의 긴 터널을 지나 철길을 걷어내는 날이 왔다. 가지런한 치아로 웃는 재민이의 인상이 한결 좋아졌다. 매력이 쑥쑥 올랐다.'],[{m:-300,hap:-4,sts:4,cha:1},'철제 교정을 시작했는데 첫 달부터 입안이 상처투성이다. 밥은 죽만 먹고 사진 찍을 땐 입을 못 벌렸다. 치료가 끝난 뒤에야 효과가 보였다.'],{k:'cha'}),{need:300}),
Object.assign(g('투명 교정을 시작한다 (450만 원)',.4,[{m:-450,cha:6,hap:4},'투명 교정으로 티 안 나게 마무리했다. 친구들은 재민이가 교정 중인 줄도 몰랐다. 결과가 나온 날 거울 앞에서 한참을 웃었다.'],[{m:-450,hap:-4,sts:3,cha:2},'투명 교정은 편했는데 장치를 자꾸 잃어버렸다. 어디에 두는지 잊어버리는 바람에 재제작을 두 번이나 했다. 비용이 눈덩이처럼 불어났다.'],{k:'int'}),{need:450}),
c('"이 정도면 됐지" 하고 교정을 포기한다',{hap:-1,sts:-1},'치아는 약간 삐뚤빼뚤하지만 재민이는 재민이다. 자연스러운 웃음이 더 매력적이라고 스스로를 위로했다. 거울 속 재민이는 알 듯 모를 듯 웃고 있다.')],{once:1,w:3.5});
/* --- 연애: 천하경에게 고백 --- */
ev('confess_hk',20,20,'💌 천하경에게 용기를 내서','오래전부터 마음속에 담아 두던 사람이 있다. 천하경. 오늘은 큰 결심을 했다. 이 마음을 말하기로. 심장이 터질 것 같다. 손에 땀이 흐르고 입안이 바싹 마른다. 어떤 방식으로 마음을 전할까.',[
g('직접 만나서 고백한다',.15,[{hap:14,soc:3,cha:2,f:['lover','hagyeong']},'"하경아, 나... 너 좋아해." 한참의 정적 뒤에 하경이 웃으며 대답했다. "...나도 재민이 좋아해." 세상이 환해졌다. 이날 재민이의 심장은 평생 가장 크게 뛰었다.'],[{hap:-8,sts:4},'"하경아, 나..." 하경이 따뜻하게 웃으며 말했다. "재민아, 고마워. 그런데 지금은 친구로 지내고 싶어." 고백은 거절당했지만 하경이는 끝까지 다정했다. 재민이는 오래 그 말을 곱씹었다.'],{k:'cha'}),
g('손편지를 써서 전한다',.2,[{hap:12,soc:2,cha:1,f:['lover','hagyeong']},'정성스레 쓴 손편지를 건넸다. 며칠 뒤 하경의 답장이 도착했다. "편지 잘 읽었어. 우리 한번 만나 볼까?" 재민이는 그 답장을 몇 번이고 다시 읽었다.'],[{hap:-6,sts:3},'손편지를 건넸지만 답장이 없었다. 일주일 뒤 우연히 마주친 하경이 "편지 고마워, 미안해"라며 고개를 숙였다. 마음은 닿았지만 답은 오지 않았다.'],{k:'int'}),
g('찬호의 고백 작전을 따른다',.1,[{hap:10,soc:3,f:['lover','hagyeong']},'찬호가 짠 작전은 엉뚱했지만 이상하게 먹혔다. "저 사람이 재민이 좋아한대요~" 하경이 웃으며 "알고 있었어"라고 답했다. 찬호는 의기양양하게 어깨를 으쓱했다.'],[{hap:-7,sts:4,soc:-1},'찬호의 작전은 풍선 이벤트였는데 풍선이 전부 터지고 재민이만 남았다. 하경은 놀라서 눈을 동그랗게 떴다. 고백은 시도했지만 분위기가 엉망이 됐다. 찬호는 도망쳤다.'],{k:'soc'}),
c('마음속에만 간직한다',{hap:-3,sts:3},'용기가 나지 않아서 입을 열지 못했다. 하경이는 평소처럼 인사했다. 재민이는 "안녕" 하고 돌아섰다. 마음속의 말은 끝내 나오지 못했다. 이번에도.')],{at:20,w:0});
/* --- PC방 알바: 잼민이 사건 --- */
ev('pc_jammin',19,27,'🖥️ PC방 알바, "잼민이"의 습격','재민이가 PC방 카운터에서 알바를 하고 있는 평일 오후. 초등학생 무리가 우르르 들어와 라면과 음료수를 주문하고 자리를 잡았다. 그런데 한 명이 재민이 가슴팍의 이름표를 빤히 보더니 큰 소리로 외쳤다. "형 이름 재민이에요? 어? 형 이름은 왜 잼민이에요?!" 순식간에 아이들이 몰려들어 재민이를 둘러싸고 "잼민이다! 잼민이다!"를 합창하기 시작했다. 사장님이 저 멀리서 웃음을 참고 있다.',[
g('웃으며 "형 이름은 재민이야"라고 정정한다',.3,[{soc:3,hap:4,cha:1,f:['jam']},'"형은 잼민이가 아니라 재민이야!" 정정했는데 아이들이 "아~ 잼민이 형!" 하며 더 좋아했다. 이 PC방의 초딩 단골이 20명 늘었다. 매출이 올랐다. 사장님이 시급 인상을 고민하기 시작했다.'],[{hap:-3,sts:3,f:['jam']},'"재민이야!" 정정할수록 아이들은 더 신이 나서 "잼민이!!!" 를 외쳤다. 결국 한 명이 "형 잼민이 맞아요!"라고 판정을 내렸고, 별명이 굳어졌다. 이 PC방에서 재민이의 이름은 영원히 잼민이다.'],{k:'cha'}),
g('"그래, 형이 잼민이다"라고 인정해 버린다',.25,[{soc:4,hap:5,f:['jam']},'"그래 형이 잼민이다. 이제 라면 시킬 사람?" 아이들이 환호했다. 오늘부터 재민이는 이 구역 잼민이 대장이다. 아이들이 하나둘 음료수를 추가 주문했다. 사장님이 엄지를 들었다.'],[{hap:-2,sts:2,f:['jam']},'"그래, 형이 잼민이다" 하는 순간 아이들이 "형 인정했다!!" 하며 단톡방에 퍼뜨렸다. 하루 만에 소문이 동네 초등학생들에게 퍼졌다. 이제 재민이의 이름은 영원히 잼민이가 됐다.'],{k:'soc'}),
g('"PC방에선 조용히 해야지" 규칙을 알려 준다',.2,[{chr:2,soc:2,hap:2,f:['jam']},'아이들이 "네~" 하고 조용해졌다. 5초 동안. 그 후 아이들은 속삭이면서도 "잼민이 형"이라고 불렀다. 규칙은 지켰지만 별명은 굳어졌다.'],[{hap:-3,sts:4,f:['jam']},'규칙을 알려 주자 아이들이 "형 꼰대야?" 하더니 "꼰대 잼민이"로 별명을 업그레이드했다. 큰일이다. 재민이의 별명은 이제 두 단어다.'],{k:'chr'}),
c('못 들은 척하며 라면 물을 끓인다',{sts:2},'못 들은 척 라면 물을 맞췄다. 아이들은 "형 못 들은 척한다ㅋㅋㅋ"라며 더 깔깔댔다. 라면은 맛있게 끓었지만 재민이의 귀는 빨갛게 익었다.')],{once:1,w:45});
/* --- 진호의 고백 작전 --- */
ev('jh_jumi',23,36,'🪖 진호의 고백 작전','육군장교 이진호가 심각한 표정으로 재민이를 불러냈다. "재민아... 나 주미한테 고백하려고." 전장에서는 누구보다 용감한 진호가 고백 앞에서는 손이 떨리고 있다. 진호는 재민이에게 "작전 참모가 되어 달라"고 부탁했다. 재민이는 진호의 작전 참모가 됐다. 목표는 주미에게 마음을 전하는 것. 작전명은 "주미 대작전"이다.',[
g('고백 시나리오를 같이 짠다',.2,[{soc:3,hap:5,chr:1,f:['jh_lover']},'진호와 재민이가 밤새 고백 대본을 연습했다. 당일, 진호는 대본대로 침착하게 마음을 전했다. 주미가 수줍게 웃으며 "나도 좋아해" 했다. 진호는 그 자리에서 거수경례를 해 버렸다.'],[{soc:-1,hap:-3,sts:3},'대본은 완벽했는데 진호는 긴장한 나머지 "주미 씨! 본인은 귀하를 좋아합니다! 이상!" 하고 군대식 보고로 고백했다. 주미는 놀라서 눈을 동그랗게 떴다. 결과는 보류. 진호는 얼굴이 새빨개졌다.'],{k:'cha'}),
g('편지를 대신 써 준다',.2,[{soc:2,hap:4,f:['jh_lover']},'재민이가 진심을 눌러 담은 편지를 써 주었다. 진호는 편지를 외워서 건넸고, 주미는 그 마음에 진심으로 감동했다. "고마워, 진호야. 나도 비슷한 마음이었어." 진호가 재민이에게 치킨을 사기로 했다.'],[{hap:-3,sts:2},'편지를 대신 써 줬는데 진호가 긴장해서 편지를 거꾸로 건넸다. 주미는 "어... 이게 무슨 글이에요?" 하고 편지를 뒤집어 읽었다. 분위기가 어색해져서 고백은 연기됐다.'],{k:'int'}),
g('분위기 좋은 식당을 섭외한다',.2,[{soc:2,hap:4,m:-5,f:['jh_lover']},'재민이가 예약한 식당은 분위기가 완벽했다. 촛불과 조용한 음악. 진호가 그 자리에서 용기를 내자 주미가 활짝 웃었다. 두 사람은 연인이 됐다. 계산은 진호가 했고 재민이에게는 디저트가 나왔다.'],[{m:-3,hap:-3,sts:3},'식당을 섭외했는데 하필 당일 휴무였다. 대체 식당을 찾아 헤매다가 분위기가 와장창 깨졌다. 진호는 "분위기가 문제가 아니라 마음이 중요하지!" 하며 고백했지만 어색하게 끝났다.'],{k:'soc'}),
c('옆에서 조용히 진호를 응원한다',{soc:1,hap:1},'재민이는 진호의 어깨를 두드리며 "잘 될 거야"라고만 말했다. 진호는 한참 심호흡을 하고 걸어갔다. 결과는 그날 저녁 단톡방에 올라왔다. 진호: "...거수경례함." 모두가 무슨 말인지 알아차렸다.')],{once:1,w:9});
/* --- 찬호의 고백: 재민이가 연애 참모가 된다 --- */
ev('ch_heeyeon',23,36,'💘 찬호의 고백 작전','찬호가 재민이를 불러냈다. 평소의 장난꾸러기 표정은 어디 가고 얼굴이 새빨갛다. "재민아... 나 희연이한테 고백하려고." 늘 남의 메뉴를 가로채고 재민이를 놀리던 찬호가 이번에는 진심이다. 오늘만큼은 찬호가 재민이에게 도움을 청했다. 재민이는 찬호의 연애 참모가 됐다. 작전명은 "희연 대작전"이다.',[
g('같이 고백 멘트를 고민해 준다',.2,[{soc:3,hap:5,chr:1,f:['ch_lover']},'재민이와 찬호가 밤새 멘트를 다듬었다. "희연아, 너랑 있으면 자꾸 웃게 돼. 우리 만나 볼래?" 당일 찬호는 떨면서도 끝까지 말했고, 희연이 웃으며 "좋아"라고 했다. 찬호는 재민이에게 감사의 치킨을 쐈다. 메뉴는 재민이가 골랐다. 역사적인 일이다.'],[{soc:-1,hap:-3,sts:3},'멘트는 완벽했는데 찬호가 긴장한 나머지 고백 도중 "희연아, 오늘 뭐 먹고 싶어?"라고 물었다. 희연이 "음, 파스타?"라고 하자 찬호는 습관대로 "아 난 그냥 짜장면 먹을래"라고 말해 버렸다. 분위기는 순식간에 점심 메뉴 회의가 됐다. 고백은 다음으로 미뤄졌다.'],{k:'chr'}),
g('고백할 장소를 섭외한다',.2,[{soc:2,hap:4,m:-5,f:['ch_lover']},'재민이가 섭외한 장소는 분위기가 완벽했다. 조명과 음악, 그리고 창가 자리. 찬호가 고백하자 희연이 수줍게 "나도"라고 답했다. 찬호는 그 자리에서 "와 진짜?"를 세 번 외쳤다. 재민이에게는 디저트가 나왔다.'],[{m:-3,hap:-3,sts:3},'장소를 섭외했는데 하필 그날 단체 손님이 와서 완전 소란이었다. 찬호의 고백은 옆 테이블의 건배 소리에 묻혀 희연에게 전달되지 않았다. "응? 뭐라고?" 희연이 되물었고 찬호는 목이 쉬도록 다시 말해야 했다.'],{k:'soc'}),
g('찬호와 함께 예행연습 상대가 되어 준다',.2,[{soc:3,hap:5,cha:1,f:['ch_lover']},'재민이가 희연 역할을 맡아 연습했다. 찬호는 처음엔 석상처럼 굳어 있다가 점점 자연스러워졌다. 당일에는 진심이 통했다. 희연이 웃으며 "찬호야, 오늘따라 진짜 말하는 것 같아서 좋다"고 했다.'],[{hap:-2,sts:2},'연습은 열심히 했는데 찬호가 긴장한 나머지 연습한 내용을 하나도 못 썼다. 결국 "...오늘 날씨 좋다"만 반복하다 헤어졌다. 희연은 "응, 좋다"고 답했다. 고백은 다음 기회로 미뤄졌다.'],{k:'cha'}),
c('옆에서 조용히 응원한다',{soc:1,hap:1},'재민이는 찬호의 어깨를 두드리며 "잘 될 거야"라고만 말했다. 찬호는 한참 심호흡을 하고 걸어갔다. 결과는 그날 저녁 단톡방에 올라왔다. 찬호: "...나 메뉴 안 골랐다." 모두가 무슨 말인지 알아차렸다. 희연과 함께 있었다는 뜻이다.')],{once:1,w:9});
/* --- 학교에서 한승연과 한판 (말싸움) --- */
ev('seunghyun_fight',13,18,'🏫 복도에서 마주친 한승연','학교 복도에서 한승연과 마주쳤다. 한승연은 반에서 똑 부러지기로 소문난 친구다. 며칠 전 재민이가 한승연의 필기 노트를 빌렸는데, 반납할 때 노트 귀퉁이에 라면 국물 자국이 남아 있었다. 한승연이 노트를 펼치며 차분하게 말했다. "재민아, 이게 뭐야?" 목소리는 조용한데 눈이 번쩍인다. 복도에 구경꾼들이 모이기 시작했다. 찬호는 벌써 중계 준비를 마쳤다.',[
g('정중하게 사과한다',.3,[{chr:3,soc:2,hap:3},'"미안해, 승현아. 내가 라면을 먹으면서 봤어." 솔직한 사과에 승현이 의외로 쿨하게 "...알았어. 다음부터 조심해"라고 했다. 승현은 노트 귀퉁이를 접어 국물 자국을 가렸다. 구경꾼들이 흩어졌고 재민이는 숨을 내쉬었다.'],[{hap:-3,sts:3},'"미안해, 승현아." 사과했는데 승현의 한마디가 비수처럼 꽂혔다. "사과는 고마운데, 이번이 세 번째야." 날짜와 시간까지 정확하게 읊는 승현 앞에서 재민이는 할 말을 잃었다.'],{k:'chr'}),
g('"원래 있던 자국이야!"라고 논리적으로 반박한다',.15,[{int:2,soc:2,hap:4},'재민이가 "빌릴 때 이미 있었다"고 주장하자 승현이 노트 첫 장을 뒤졌다. 그리고 첫 장 구석의 오래된 얼룩을 발견했다. 승현이 "...어. 이건 진짜 원래 있었네"라며 한발 물러났다. 재민이의 의외의 승리였다.'],[{hap:-4,sts:4,soc:-1},'"원래 있던 자국이야!" 외치자 승현이 휴대폰을 꺼내 빌려주기 전 노트 사진을 보여 줬다. 사진 속 노트는 새하얬다. 시간과 장소와 증거까지 정리하는 승현 앞에서 재민이의 논리는 산산조각 났다.'],{k:'int'}),
g('새 노트를 사서 갚는다 (1만 원)',.3,[{m:-1,chr:2,soc:2,hap:3},'다음 날 새 노트를 사서 건넸다. 승현이 "...고마워. 근데 이 노트 더 예쁘다"라며 활짝 웃었다. 재민이는 얼떨결에 승현의 친구가 됐다. 찬호는 "사건 종결"을 선언했다.'],[{m:-1,hap:-2,sts:2},'새 노트를 사 갔는데 승현이 "이건 내가 쓰던 거랑 달라. 줄 간격이 달라"라고 정색했다. 재민이는 노트 줄 간격 때문에 한 번 더 혼났다. 승현은 디테일의 여왕이다.'],{k:'cha'}),
c('"난 몰라" 하고 도망친다',{hap:-2,soc:-2},'재민이는 복도 끝으로 전력질주했다. 뒤에서 승현이 "재민아, 아직 얘기 안 끝났어!"라고 외쳤다. 그 외침은 학교 복도에 오래 메아리쳤다. 다음 날 아침 재민이의 책상 위에는 승현이 정성껏 정리한 "사건 경위서"가 놓여 있었다.')],{once:1,w:10});
/* --- 서예림과 한판: 매점 소시지빵 --- */
ev('seoyelim_fight',13,18,'🥐 매점 마지막 소시지빵','점심시간 매점. 마지막 남은 소시지빵 하나를 두고 재민이와 서예림이 동시에 손을 뻗었다. 두 사람의 손이 빵 위에서 만났다. 서로 한 치도 양보하지 않는 눈빛. 빵은 두 사람 사이에서 팽팽하게 당겨지고 있다. 주변 학생들이 구경하러 모여들었고, 찬호는 어디선가 중계를 시작했다. "마지막 소시지빵을 둘러싼 세기의 대결!"',[
g('"내가 먼저 잡았어!"라고 강하게 주장한다',.2,[{hap:5,soc:2,cha:1},'"내가 먼저 잡았어!" 외치자 서예림이 한 박자 늦게 손을 놓았다. 소시지빵은 재민이의 승리. 서예림은 "...다음엔 내가 먼저야"라고 선언했다. 재민이는 먹는 내내 등 뒤의 시선이 따가웠다.'],[{hap:-3,sts:3,soc:-1},'"내가 먼저야!" 외쳤는데 서예림이 매점 아주머니를 부르며 "누가 먼저 잡았어요?"라고 물었다. 아주머니의 판결은 "예림이가 먼저였어" 소시지빵은 서예림에게 넘어갔다. 재민이는 빈손으로 교실로 돌아갔다.'],{k:'cha'}),
g('"반으로 나눠 먹자"고 제안한다',.3,[{soc:4,hap:5,chr:2},'"반으로 나눌까?" 재민이의 제안에 서예림이 피식 웃으며 "...좋아" 했다. 두 사람은 소시지빵을 반으로 나눠 먹었다. 의외로 둘이 먹으니 더 맛있었다. 두 사람은 그날부터 매점 단짝이 됐다.'],[{hap:-2,sts:2},'"반으로 나누자" 했는데 소시지빵이 반으로 갈라지는 순간 소시지가 한쪽으로만 쏠려 버렸다. 서예림이 소시지 쪽을 갖고 재민이는 빵 쪽만 받았다. 눈물 나는 분배였다.'],{k:'chr'}),
g('가위바위보로 승부를 낸다',.1,[{hap:6,soc:2},'결판은 가위바위보. 재민이가 이긴 건 이번이 처음이다! 서예림이 "...재민이 가위바위보 진짜 못한다고 들었는데"라며 억울해했다. 소시지빵은 재민이가 달콤하게 먹었다.'],[{hap:-3,sts:3},'가위바위보를 했는데 재민이가 졌다. 평소 실력대로다. 서예림이 "역시"라며 소시지빵을 챙겼다. 구경하던 찬호가 중계했다. "재민, 오늘도 졌습니다."'],{k:'int'}),
c('"그래, 가져가"라며 양보한다',{},'재민이는 한숨을 쉬며 손을 뗐다. 서예림이 의아한 눈으로 "...고마워"라고 했다. 소시지빵은 서예림의 것이 됐고, 재민이는 매점 아주머니가 서비스로 준 사탕 하나로 위로받았다.')],{once:1,w:10});
/* --- 진호 병문안: 갈비뼈 수술 후 (경완·찬호·재민이 함께) --- */
ev('jinho_hospital',22,40,'🏥 진호의 병실','진호가 오른쪽 세 번째 갈비뼈를 제거하는 수술을 받았다. 경완, 찬호, 재민이 셋이 병문안을 왔다. 재민이는 베스킨라빈스를 사 들고 병실 문을 열었다. 진호가 침대에 반쯤 기대어 누워 있다. 군인답게 표정은 의연하지만 숨 쉬는 것조차 조심스러워 보인다. 진호가 세 사람을 보고 진지하게 말했다. "...부탁인데 웃기지 마. 웃으면 갈비뼈가 아파." 그 말을 듣자마자 찬호는 입을 막고 어깨를 들썩이기 시작했다. 경완은 진호의 물컵과 베개를 챙기며 조용히 곁을 지키고 있다.',[
g('웃기는 이야기를 해서 진호를 웃긴다',.2,[{soc:3,hap:5,cha:1},'재민이가 회기역 자판기 이야기를 꺼내자 찬호가 옆에서 "내 달달이 어디 갔어" 하며 거들었다. 진호가 참다 참다 터졌다. "아야야... 그만해... 아 웃겨... 아야야!" 경완이 "숨 천천히 쉬어, 진호야!" 하고 외치며 달려왔다. 진호는 아파하면서도 환하게 웃었다. 간호사가 문을 열고 "조용히 해 주세요" 했지만 눈빛은 웃고 있었다.'],[{hap:-2,sts:2},'웃기려고 이야기를 꺼냈는데 재민이의 농담이 너무 썰렁해서 진호가 "...그게 끝이야?" 하고 물었다. 찬호는 혼자 빵 터져서 의자에서 굴러떨어졌고, 경완이 찬호를 일으켜 세우느라 바빴다. 진호의 갈비뼈는 안 아팠지만 병실의 온도는 3도 떨어졌다.'],{k:'cha'}),
g('베스킨라빈스를 진호에게 먹여 준다',.3,[{soc:3,hap:4,chr:2},'"의사 선생님이 먹어도 된대." 진호가 한 숟갈 입에 넣자 눈이 반짝였다. "...살 것 같다." 경완이 "천천히 먹어, 숨 쉬면서"라며 옆에서 진호의 등을 받쳐 줬다. 찬호는 "나도 한 입"을 외쳤다가 경완에게 제지당했다. 병원 밥에 지친 진호가 눈물을 글썽이며 "재민아 고맙다"고 했다.'],[{hap:-2,sts:2},'아이스크림을 꺼내려는 순간 간호사가 나타났다. "수술 환자분께 찬 음식은 지금은 안 돼요." 재민이는 봉지를 든 채 얼음처럼 굳었다. 진호가 슬픈 눈으로 아이스크림을 바라봤다. 찬호가 "그럼 우리가 먹자"며 달려들었고, 결국 찬호와 재민이와 경완이 병실 구석에서 조용히 다 먹고 나왔다.'],{k:'chr'}),
g('옆 침대 환자분들께도 나눠 드린다',.2,[{chr:3,soc:3,hap:4},'옆 침대 어르신들이 "아이고, 젊은이들이 마음씨가 곱네" 하며 반갑게 받아 주셨다. 찬호가 신이 나서 "저는 이찬호입니다!"라고 자기소개를 했고 경완은 어르신이 일어나시는 걸 부축해 드렸다. 병실 분위기가 훈훈해졌고 진호도 "역시 재민이다"라고 흐뭇하게 웃었다.'],[{hap:-2,sts:2,m:-2},'나눠 드리려 했는데 옆 침대 어르신이 당뇨가 있다고 하셔서 간호사가 급히 뛰어왔다. 재민이는 아이스크림을 도로 가방에 넣었다. 찬호가 "그럼 내가 먹을게"를 외치다가 경완에게 팔을 붙잡혔다. 결과적으로 진호만 못 먹은 셈이 됐다.'],{k:'soc'}),
c('아무 말 없이 침대 옆에 조용히 앉아 있어 준다',{},'재민이는 진호 옆에 조용히 앉았다. 찬호도 웬일로 조용했고, 경완은 진호의 베개 높이를 조절해 주었다. 진호는 천장을 보며 "...고맙다"고 한 번 말했다. 세 사람은 말없이 한 시간을 같이 보냈다. 병실 창밖으로 노을이 졌다. 아이스크림은 봉지 속에서 서서히 녹고 있었다.')],{once:1,w:9});
/* --- 야자 째고 만든 클랜: 클랜전 (BGM: assets/bgm/clan.mp3) --- */
ev('clan_war',16,18,'🔫 야자 째고 만든 클랜, 오늘은 클랜전!','야간 자율학습 종이 치기 무섭게 재민이는 가방을 둘러메고 뒷문으로 빠져나갔다. 목적지는 학교 앞 PC방. 진호, 찬호, 경연, 세민, 범수, 경완까지 이미 모여 있다. 야자를 째고 만든 클랜 [야자째고]의 첫 클랜전이다. 상대는 옆 학교 클랜. 클랜 채팅창에는 "이기면 치킨, 지면 야자 두 배"라는 비장한 공약이 올라와 있다. 재민이는 어떤 역할로 나설까?',[

g('🛡️ 진호의 작전대로 정면 돌파한다',.35,[{soc:5,hap:6,int:2},'진호의 "지금이야!" 소리와 함께 여섯 명이 동시에 돌진했다. 상대 클랜은 당황했고 작전은 기막히게 들어맞았다. 클랜전 승리! 진호는 육군장교 소질이 있다며 의기양양했고 재민이는 그 뒤에서 마지막 한 명을 정리했다.'],[{hap:-3,sts:4,soc:-1},'작전은 훌륭했는데 경완이 길을 잘못 들었고 세민이 뒤에서 팀킬을 했다. 순식간에 전멸. 진호가 "아니 왜 그쪽으로 가는데!"라고 소리쳤고 클랜 채팅창은 서로를 탓하는 글로 도배됐다. 야자째고 클랜 창설 후 첫 내분이었다.']),
g('📣 마이크 잡고 응원만 한다',.4,[{soc:6,chr:3,hap:5},'재민이의 마이크 응원이 팀 사기를 폭발시켰다. "할 수 있다! 야자도 째고 왔는데 못 이길 게 뭐가 있어!" 오히려 분위기는 달아올라 클랜전을 이겼다. 승리의 8할은 재민이의 목소리였다. 상대 클랜은 "저 마이크 누구야" 하며 경악했다.'],[{soc:-2,hap:-2,sts:3},'너무 크게 외치는 바람에 PC방 사장님이 달려왔다. "너희 몇 학년 몇 반이야? 야자는 안 하고?" 클랜전은 중단됐고 일곱 명은 줄줄이 귀가 조치됐다. 야자째고 클랜의 첫 클랜전은 3분 만에 막을 내렸다.']),
g('🏃 담임 순찰이 뜨자 먼저 도망친다',.45,[{hap:3,soc:-2,int:1},'PC방 창밖으로 담임 선생님의 차가 보이자 재민이는 번개처럼 뒷문으로 도망쳤다. 친구들은 뒤에서 "재민아!!" 하고 외쳤지만 재민이는 이미 모퉁이를 돌고 있었다. 나중에 안 사실이지만 담임 선생님은 치킨을 사러 온 것이었다. 눈치 하나는 인정.'],[{hap:-5,sts:6,soc:-3},'도망치다가 하필 순찰 중이던 담임 선생님과 정면으로 마주쳤다. 책가방에서는 헤드셋이 굴러 떨어졌다. "야자는?" 대답할 말이 없었다. 재민이는 그날 밤 교무실에서 클랜 이름 [야자째고]의 의미에 대해 장문의 반성문을 썼다.']),
],{w:150});

g('📱 감독 지시 훈수만 두는 전술가',.4,[{int:2,soc:5,hap:5},'"4-2-3-1로 바꿔! 지금 측면이 비었어!" 재민이의 훈수를 들은 세민이가 3:1로 역전했다. 친구들은 "재민이 말이 맞네"라며 감탄했다. 정작 본인은 한 번도 안 뛰었지만 승리 수당은 재민이도 받았다. 훈수의 승리다.'],[{soc:-3,hap:-3,sts:3},'재민이의 훈수를 따른 경완이 어이없는 실점을 했다. "누가 이렇게 하래!" 경완의 외침과 함께 모든 시선이 재민이에게 쏠렸다. 이후 재민이는 키보드를 만지는 것만으로도 눈치를 봤다. 훈수 값은 컵라면 두 개.']),
g('🛌 5시에 먼저 퇴근한다',.45,[{hap:3,str:2,sts:-3},'"난 먼저 간다." 재민이는 새벽 다섯 시 뒷문을 열고 나왔다. 해가 뜨는 거리는 놀랄 만큼 상쾌했다. 집에 도착해 이불을 덮자마자 꿀잠. 친구들은 아침 아홉 시까지 남아서 점심까지 먹었다는 후문. 재민이는 아무도 모르는 승자가 됐다.'],[{hap:-4,sts:5,soc:-2},'먼저 가려다 이미 지갑을 PC방에 두고 온 것을 깨달았다. 돌아가 보니 친구들은 재민이 자리에서 재민이 계정으로 재민이 선수를 굴리고 있었다. 결과는 5연패. 재민이의 계정 전적이 순식간에 박살났다.']),

/* --- 야자 시간: 경연의 의도치 않은 신호 (재민이는 평소 행실 때문에 80% 의심받는다) --- */

ev('gy_yaja',16,18,'📚 야자 시간의 정적','야간 자율학습 시간. 조용한 교실에 연필 소리만 사각사각 울린다. 경연이 책상에 엎드려 곤히 자고 있다. 그런데 갑자기 교실의 정적을 가르며 "뿌우웅—" 하는 소리가 울려 퍼졌다. 온 반이 일제히 고개를 들었다. 범인은 경연이다. 하지만 정작 경연은 꿈속에서 아직 깨지 않았다. 재민이는 경연의 옆자리에 앉아 있다. 그리고 재민이에게는 불행한 전과가 있다. 평소 행실 때문에, 이런 일이 생기면 반 아이들은 80% 확률로 재민이를 의심한다.',[
{t:'모른 척 책을 계속 읽는다',fx:{},m:'',fn:S=>{
  if(Math.random()<SUSPECT_P)return [{hap:-4,sts:4,soc:-2,f:['fartSuspect']},'모른 척 책을 넘겼는데 반 아이들의 시선이 하나둘 재민이에게 옮겨 붙었다. "재민이 아니야?" "맞네, 재민이네." 평소 행실이 있으니 의심은 거둬지지 않았다. 재민이는 억울함을 호소할 새도 없이 책 속에 얼굴을 파묻었다. 의심받을 확률 80%가 그대로 적중했다.'];
  return [{hap:2,chr:1},'재민이는 침착하게 책을 넘겼다. 이번에는 아무도 의심하지 않았다. 반 아이들의 시선이 천천히 거두어졌다. 경연은 끝내 아무것도 모른 채 잠에서 깨어 "...어? 왜 다들 날 봐?" 했다. 재민이는 조용히 "아무것도 아니야"라고 답했다. 20%의 기적이다.']}},
{t:'경연이를 조용히 깨운다',fx:{},m:'',fn:S=>{

  return [{soc:3,hap:3},'재민이가 경연이의 어깨를 톡톡 쳤다. 경연이 눈을 뜨자 재민이는 속삭였다. "방금 뭔 소리 났어. 일단 모른 척해." 경연이 상황을 파악하는 데 3초가 걸렸고 그 후 얼굴이 새빨개졌다. 이번에는 다행히 아무도 재민이를 의심하지 않았다. 경연은 재민이에게 평생 은혜를 졌다.']}},
{t:'"내가 뀐 거야"라고 대신 뒤집어쓴다',fx:{},m:'',fn:S=>{
  if(Math.random()<SUSPECT_P)return [{chr:3,soc:-1,hap:-3,f:['fartSuspect']},'"...미안, 내가 그랬어." 재민이가 조용히 손을 들었다. 반 아이들은 놀라지 않았다. "아, 역시 재민이였네." 평소 행실이 있으니 의심할 이유조차 없었다. 경연은 눈을 감은 채 속으로 감사했지만, 재민이는 억울한 방귀 전과 한 줄이 늘었다. 의리는 지켰다.'];
  return [{chr:4,soc:4,hap:3},'"...미안, 내가 그랬어." 재민이가 손을 들었는데 이번에는 반 아이들이 "에이, 재민이는 그럴 사람이 아니야"라고 믿어 주지 않았다. 범인이 안 나오자 분위기는 흐지부지 넘어갔다. 경연은 눈을 감은 채 속으로 감사했다. 재민이는 이날 이후 반에서 의리의 아이콘이 됐다.']}},
{t:'웃음을 참느라 책상을 두드린다',fx:{},m:'',fn:S=>{
  if(Math.random()<SUSPECT_P)return [{hap:-4,sts:4,soc:-2,f:['fartSuspect']},'웃음을 참느라 책상을 두드렸는데 쿵쿵 소리가 교실에 울려 퍼졌다. 반 아이들이 일제히 재민이를 쳐다봤다. "저 반응... 재민이가 범인 맞네." 웃음을 참는 모습이 오히려 유죄의 증거가 됐다. 평소 행실의 위력이다.'];
