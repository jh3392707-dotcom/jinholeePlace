<title>진호 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 한 손 조작용 하단 탭 + 컴팩트 카드. 다크 기본, 라이트 대응 */
:root{--bg:#111114;--card:#1b1b20;--card2:#24242b;--tx:#f2f2f5;--sub:#8b8b96;--line:#2a2a31;--blue:#4c8dff;--red:#ff5a6a;--redbg:#3a2024;--green:#2fb67c;--amber:#c98a3a;--nav:#16161a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f6;--card:#fff;--card2:#ececf1;--tx:#17171c;--sub:#6b6b78;--line:#e3e3ea;--blue:#2f6fe0;--red:#d93a4c;--redbg:#fde6e9;--green:#1a9a66;--amber:#b8741c;--nav:#fafafc;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f3f6;--card:#fff;--card2:#ececf1;--tx:#17171c;--sub:#6b6b78;--line:#e3e3ea;--blue:#2f6fe0;--red:#d93a4c;--redbg:#fde6e9;--green:#1a9a66;--amber:#b8741c;--nav:#fafafc;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 130px}
#app{max-width:560px;margin:0 auto}
h2{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.sub{color:var(--sub);font-size:11px}.big{font-size:20px;font-weight:700}.mid{font-size:15px;font-weight:700}
.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--card2)}.bar i{display:block;height:100%}
.pbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4c8dff,#9b6bff)}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-weight:600;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--blue);border:0;border-radius:8px;padding:6px 12px;font-weight:600;color:#fff;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--redbg);color:var(--red)}.btn.sm{padding:3px 8px;font-size:11px}.btn:disabled{opacity:.5}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.nav div{flex:1;text-align:center;padding:7px 0 6px;color:var(--sub);font-size:10px;cursor:pointer}.nav div b{display:block;font-size:17px;font-weight:400}.nav .on{color:var(--tx);font-weight:700}
.fab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--blue);border:0;font-size:24px;color:#fff;box-shadow:0 4px 14px #0006;z-index:6;cursor:pointer}
.mnav{display:flex;justify-content:center;align-items:center;gap:16px;font-weight:700;font-size:14px;margin-bottom:8px}.mnav span{padding:2px 10px;color:var(--sub);font-size:16px;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet label{display:block;font-size:11px;color:var(--sub);margin:8px 0 3px}
.sheet input,.sheet select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:2px}.seg div{flex:1;text-align:center;padding:6px;border-radius:6px;color:var(--sub);font-weight:600;cursor:pointer}.seg .on{background:var(--blue);color:#fff}
.goal{border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.goal .img{height:170px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;background-color:#10131f}
.goal .img svg{position:absolute;inset:0;width:100%;height:100%}
.goal .img:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}
.goal .img>div{position:relative;z-index:1;padding:10px 12px;width:100%;color:#fff}
.pct{font-size:32px;font-weight:800;line-height:1.1}
.chips{display:flex;gap:6px;overflow:auto;margin-top:8px}.chips span{background:var(--card2);padding:3px 9px;border-radius:12px;white-space:nowrap;color:var(--sub);font-size:11px}
.tl{display:grid;grid-template-columns:repeat(31,1fr);gap:1px;margin:4px 0}.tl i{height:14px;border-radius:2px;background:var(--card2);font-style:normal;font-size:8px;text-align:center;color:var(--sub)}.tl i.m{background:var(--amber);color:#fff}.tl i.t{outline:1px solid var(--blue)}
textarea{width:100%;height:130px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.5 monospace;resize:vertical}
.paid{opacity:.5}.tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--card2);color:var(--sub);font-weight:600}.tag.hot{background:var(--red);color:#fff}.tag.warn{background:var(--amber);color:#fff}
.alert{background:var(--redbg);border:1px solid var(--red);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.advice{white-space:pre-wrap;font-size:12.5px;line-height:1.6}
.sync{font-size:10px;color:var(--sub);text-align:right;margin-bottom:4px;cursor:pointer}.sync.bad{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:20;font-weight:600}
.t{fill:var(--sub)}.gl{stroke:var(--line)}
</style>
<div id="app"></div>
<button class="fab" id="fab" aria-label="내역 추가">＋</button>
<div class="nav" id="nav"></div>
<script>
const OUT=[['선물','🎁','#3b82f6'],['취미·여가','🎮','#1f8a5f'],['이체','💸','#9a6424'],['식비','🍚','#e0645a'],['카페·간식','☕','#b08968'],['보험·세금·기타금융','🧾','#8b7fd6'],['교통·자동차','🚌','#4aa8c9'],['쇼핑','🛍️','#d96fa5'],['편의점·마트·잡화','🏪','#c9b24a'],['의료·건강·피트니스','💊','#59b86d'],['주거·통신','🏠','#6d8bb8'],['기타','📦','#7d7d88']];
const IN=[['급여','💼'],['부수입','🧩'],['용돈','🎀'],['이자·배당','🌱'],['환급·기타','💰']];
const ATYPE=[['현금','💵','#2fb67c'],['통장','🏦','#4c8dff'],['주식','📈','#ff8a4c'],['환테크','💱','#c07af0'],['코인','🪙','#f2c230'],['네이버 애드포스트','💚','#03c75a'],['레뷰포인트','🎟️','#ff6b6b']];
const INK=[['월배당','📈',true,'이자·배당'],['급여','💼',false,'급여'],['애드포스트','💚',true,'부수입'],['레뷰','🎟️',false,'부수입'],['기타수입','💰',false,'환급·기타']];
const CUR=[['USD',1400],['JPY',9.3],['EUR',1500],['CNY',195],['GBP',1750]];
const ocat=n=>OUT.find(x=>x[0]===n)||OUT[OUT.length-1];
const COLS=['tx','assets','fixed','goals','advice','income','settings','divs'];
const S={tx:[],assets:[],fixed:[],goals:[],advice:[],income:[],settings:[],divs:[],seeded:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const W=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const big=n=>{const a=Math.abs(n);return a>=1e8?(n/1e8).toFixed(2).replace(/\.?0+$/,'')+'억':a>=1e4?Math.round(n/1e4).toLocaleString()+'만':Math.round(n).toLocaleString()};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DOW='일월화수목금토';
let tab='home',cur=ym(today()),openCat=null,txType='out',mode='connecting',db=null,assetsCap=null,dlCap=null,sampleCap=null,lastErr='';

/* ---------- 저장/동기화 ----------
 * 온수동지구인 다이어리에서 시행착오 끝에 만든 안전장치를 가져왔어요.
 * 1) 기기 임시 저장(항상)  2) 저장 대기열(outbox): 실패해도 사라지지 않고 자동 재시도
 * 3) 낡은 화면 차단(APP_VER)  4) 갑자기 텅 빈 서버 보호(guard)  5) 나중에 고친 쪽이 이김(_m)
 * 6) 저장 후 다시 읽어 확인  7) 3시간 단위·매일 서버 백업 + 기기 스냅샷  8) 직접 지운 항목 기록(백업 복원 때 되살리지 않음)
 */
const APP_VER=3,CK='gagyebu_cache_v2',OBK='gagyebu_outbox_v1',LSNAP='gagyebu_snaps_v1',CHUNK=60000;
const DEV=(()=>{try{let d=localStorage.getItem('gagyebu_dev');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('gagyebu_dev',d)}return d}catch(e){return Math.random().toString(36).slice(2,8)}})();
let outbox=[],deletedIds={},serverCopy={},guard={},stale=false,flushing=false,retryT=0,lastOk=0,lastPreSlot='',lastDaily=0,cleaned=false;
try{outbox=JSON.parse(localStorage.getItem(OBK))||[]}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const saveOb=()=>{try{localStorage.setItem(OBK,JSON.stringify(outbox))}catch(e){}};
function cacheSave(){try{localStorage.setItem(CK,JSON.stringify({tx:S.tx,assets:S.assets,fixed:S.fixed,goals:S.goals,advice:S.advice,income:S.income,settings:S.settings,divs:S.divs,seeded:S.seeded,deleted:deletedIds}))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem(CK));if(c){COLS.forEach(k=>S[k]=c[k]||[]);S.seeded=c.seeded;deletedIds=c.deleted||{}}}catch(e){}}
const clean=o=>{const r={};for(const k in o)if(o[k]!==undefined&&k!=='id')r[k]=o[k];return r};
const dataSnapshot=()=>({tx:S.tx,assets:S.assets,fixed:S.fixed,goals:S.goals,advice:S.advice,income:S.income,settings:S.settings,divs:S.divs,deleted:deletedIds});
const itemTotal=o=>COLS.reduce((s,c)=>s+((o[c]||[]).length),0);

/* 저장: 먼저 이 기기에 반영하고, 대기열에 넣어 서버로 보냄 */
function enqueue(op){outbox=outbox.filter(o=>!(o.col===op.col&&o.id===op.id));outbox.push(op);saveOb();flush()}
function put(col,o){
 if(!o.id)o.id=uid();o._m=Date.now();
 const i=S[col].findIndex(x=>x.id===o.id);i>=0?S[col][i]=o:S[col].push(o);
 delete deletedIds[o.id];cacheSave();render();
 if(mode==='cloud')enqueue({k:'set',col,id:o.id,data:clean(o),m:o._m});
}
function del(col,id){
 S[col]=S[col].filter(x=>x.id!==id);deletedIds[id]=Date.now();cacheSave();render();
 if(mode==='cloud'){enqueue({k:'del',col,id,m:Date.now()});enqueue({k:'set',col:'meta',id:'deleted',data:{ids:deletedIds},m:Date.now()})}
}
async function exec(op){
 await preSlotBackup();
 const ref=op.col==='meta'?db.doc('meta/'+op.id):db.collection(op.col).doc(op.id);
 if(op.k==='del'){await ref.delete();return}
 const r=await ref.get(),bulk=outbox.length>20;
 if(op.col==='meta'&&op.id==='deleted'){const ids={...(r.exists?(r.data().ids||{}):{}),...op.data.ids};deletedIds={...ids,...deletedIds};op.data={ids}}
 else if(r.exists&&(r.data()._m||0)>op.m)return; // 서버 쪽이 더 나중에 고쳐졌으면 서버가 이김
 await ref.set(op.data);
 if(!bulk){const v=await ref.get();if(!v.exists)throw{code:'verify'}} // 저장 후 다시 읽어 확인
}
async function flush(){
 if(flushing||mode!=='cloud'||stale)return;
 flushing=true;syncUI();
 try{
  while(outbox.length){
   const op=outbox[0];
   try{await exec(op);outbox.shift();saveOb();lastErr='';lastOk=Date.now()}
   catch(e){const c=(e&&e.code)||'error';
    if(c==='invalid_argument'||c==='quota_exceeded'||c==='transform_error'){outbox.shift();saveOb();lastErr=c;toast('저장할 수 없는 항목을 건너뛰었어요 ('+c+')')}
    else{lastErr=c;clearTimeout(retryT);retryT=setTimeout(flush,5000);break}}
  }
 }finally{flushing=false}
 if(!outbox.length&&!lastErr)afterFlush();
 syncUI();
}
function afterFlush(){
 if(itemTotal(S)>0&&Date.now()-lastDaily>600000){lastDaily=Date.now();writeBackup(ymd(today()),dataSnapshot()).catch(()=>{});takeLocalSnap()}
}
/* 백업 (문서 하나 한도를 넘지 않도록 조각내서 저장) */
async function writeBackup(id,data){
 const json=JSON.stringify(data),parts=[];for(let i=0;i<json.length;i+=CHUNK)parts.push(json.slice(i,i+CHUNK));
 for(let i=0;i<parts.length;i++)await db.doc('backups/'+id+'_c'+i).set({s:parts[i]});
 await db.doc('backups/'+id).set({t:Date.now(),n:parts.length,dev:DEV});
}
async function readBackup(id){
 const m=await db.doc('backups/'+id).get();if(!m.exists)return null;
 let s='';for(let i=0;i<m.data().n;i++){const c=await db.doc('backups/'+id+'_c'+i).get();if(!c.exists)return null;s+=c.data().s}
 return{t:m.data().t,o:JSON.parse(s)};
}
async function deleteBackup(id){try{const m=await db.doc('backups/'+id).get();if(!m.exists)return;for(let i=0;i<m.data().n;i++)await db.doc('backups/'+id+'_c'+i).delete();await db.doc('backups/'+id).delete()}catch(e){}}
async function preSlotBackup(){ // 3시간마다 한 번, 덮어쓰기 직전 서버 내용을 따로 보관
 const n=new Date(),slot=ymd(n)+'-'+pad(Math.floor(n.getHours()/3)*3);if(slot===lastPreSlot)return;lastPreSlot=slot;
 if(!itemTotal(serverCopy))return;
 try{const x=await db.doc('backups/pre-'+slot).get();if(!x.exists)await writeBackup('pre-'+slot,{...serverCopy,deleted:deletedIds})}catch(e){}
}
function cleanupOld(){ // 오래된 자동 백업 정리 (매일 60일, 3시간 단위 3일)
 if(cleaned||!db)return;cleaned=true;const day=n=>{const d=today();d.setDate(d.getDate()-n);return ymd(d)};
 deleteBackup(day(60));[3,4].forEach(n=>[0,3,6,9,12,15,18,21].forEach(h=>deleteBackup('pre-'+day(n)+'-'+pad(h))));
 const old=Date.now()-90*864e5;Object.keys(deletedIds).forEach(k=>{if(deletedIds[k]<old)delete deletedIds[k]});
}
function takeLocalSnap(){try{let a=JSON.parse(localStorage.getItem(LSNAP)||'[]');const last=a[a.length-1];if(last&&Date.now()-last.t<30*60000)return;const s=JSON.stringify(dataSnapshot());if(s.length>800000||!itemTotal(S))return;a.push({t:Date.now(),s});while(a.length>3)a.shift();localStorage.setItem(LSNAP,JSON.stringify(a))}catch(e){}}
const loadLocalSnaps=()=>{try{return JSON.parse(localStorage.getItem(LSNAP))||[]}catch(e){return[]}};

/* 서버에서 받은 문서에 아직 못 보낸 변경(대기열)을 덧입혀 보여줌 */
function applyServer(col,arr){
 const out=arr.slice();
 outbox.filter(o=>o.col===col).forEach(o=>{const i=out.findIndex(x=>x.id===o.id);
  if(o.k==='del'){if(i>=0&&(out[i]._m||0)<=o.m)out.splice(i,1)}
  else if(i<0)out.push({id:o.id,...o.data});else if((out[i]._m||0)<=o.m)out[i]={id:o.id,...o.data}});
 S[col]=out;
}
function syncState(){
 return stale?'stale':Object.keys(guard).length?'guard':mode==='local'?'local':mode!=='cloud'?'busy':lastErr?'err':(flushing||outbox.length)?'busy':'ok'}
function syncUI(){const e=$('#sync');if(!e)return;const st=syncState();
 e.className='sync'+(['local','guard','stale','err'].includes(st)?' bad':'');
 e.textContent={stale:'🔄 새로고침이 필요해요 (낡은 화면)',guard:'⚠️ 확인 필요 — 눌러서 확인',local:'📵 이 기기에만 저장 (눌러서 자세히)',err:'⚠️ 동기화 지연 — 자동 재시도 중 ('+outbox.length+'건 대기)',busy:'🔄 동기화 중…'+(outbox.length?' ('+outbox.length+'건)':''),ok:'☁️ 동기화됨 (폰·PC 공통) · 눌러서 관리'}[st]}
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2600)}
let rq;function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)}
async function init(){
 cacheLoad();draw();
 let c=null;try{c=await claude.use('db')}catch(e){}
 try{assetsCap=await claude.use('assets')}catch(e){}
 try{dlCap=await claude.use('downloads')}catch(e){}
 try{sampleCap=await claude.use('sample')}catch(e){}
 if(!c){mode='local';await seedLocal();draw();return}
 db=c;mode='cloud';syncUI();
 const first={};let timer=setTimeout(()=>{if(Object.keys(first).length<COLS.length+1){lastErr='연결 지연(캐시 표시 중)';syncUI()}},10000);
 const got=k=>{first[k]=1;if(Object.keys(first).length===COLS.length+1){clearTimeout(timer);if(lastErr.startsWith('연결')){lastErr='';syncUI()}}};
 COLS.forEach(col=>db.collection(col).onSnapshot(s=>{
  const arr=s.docs.map(d=>({id:d.id,...d.data()}));
  if(s.metadata.fromCache){if(!arr.length&&S[col].length)return;serverCopy[col]=arr;applyServer(col,arr);cacheSave();render();return} // 캐시가 비어 있다고 내 기기 데이터를 지우지 않음
  got(col);serverCopy[col]=arr;
  if(!arr.length&&S[col].length>=3&&!outbox.some(o=>o.col===col)){guard[col]=true;syncUI();render();return} // 있던 데이터가 갑자기 텅 빈 서버 → 자동으로 지우지 않고 확인을 요청
  delete guard[col];applyServer(col,arr);cacheSave();render();syncUI();
  if(col==='goals')seedCloud();
 },e=>{lastErr=(e&&e.code)||'error';syncUI()}));
 db.doc('meta/state').onSnapshot(s=>{
  S.seeded=s.exists?s.data():null;
  const v=s.exists?(s.data().v||0):0;

 const {cost,yld}=fireSet(),ps=passiveSum(),tot=incomeSum(),act=tot-ps,T=totals(),m=ym(today());
 const cover=Math.min(100,ps/cost*100),need=cost*12/0.04,assetP=Math.min(100,T.net/need*100),gap=Math.max(0,cost-ps),extra=gap*12/(yld/100);

 return `<div class="card"><div class="sub">월 예상 수입 (등록된 고정수입 합계)</div><div class="big">${W(tot)}</div>

 <div class="sub">월 생활비 목표 ${W(cost)} 중 ${W(ps)} 해결 · 부족 ${W(gap)}</div>
 <div class="item" style="margin-top:6px"><div class="grow sub">월 ${W(gap)}을 더 만들려면<br>(배당수익률 연 ${yld}% 가정) 추가 투자금</div><div class="num">${W(extra)}</div></div>
 <div class="item"><div class="grow sub">파이어 필요 자산 (생활비×12÷4%)</div><div class="num">${W(need)}</div></div>

 ${avg3?`<div class="sub" style="margin-top:6px">최근 3개월 실제 배당 평균 ${W(avg3)}</div>`:''}</div>

 ${list.map(({i,d})=>{const dd=dday(d),p=recvDone(i,m),k=inkOf(i.kind);return `<div class="card ${p?'paid':''}"><div class="row"><div style="font-size:18px">${k[1]}</div><div class="grow" data-a="incomeForm" data-id="${i.id}"><div class="ell"><b>${esc(i.name)}</b> <span class="tag ${p?'':'warn'}">${p?'입금완료':dd===0?'오늘':'D-'+dd}</span> ${i.passive?'<span class="tag">패시브</span>':''}</div><div class="sub">매월 ${i.day}일 · ${i.kind} · 다음 ${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})</div></div><div style="text-align:right"><div class="num blue">+${W(i.amt)}</div>${p?`<button class="btn g sm" data-a="unrecv" data-id="${i.id}">취소</button>`:`<button class="btn sm" data-a="recv" data-id="${i.id}">입금됐어요</button>`}</div></div></div>`}).join('')||'<div class="card sub">급여, 애드포스트, 레뷰 등 매월 들어오는 수입을 ＋ 추가로 넣어 보세요. 배당은 📈 배당수익 탭에서 종목별로 등록하면 파이어 계산에 자동 반영돼요.</div>'}`;

 return `<svg viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101735"/><stop offset=".7" stop-color="#4b3a72"/><stop offset="1" stop-color="#e08a6a"/></linearGradient></defs><rect width="400" height="170" fill="url(#ak)"/><circle cx="330" cy="40" r="14" fill="#fff4d0" opacity=".9"/>${w}<rect y="150" width="400" height="20" fill="#14172a"/></svg>`}

async function syncNow(){close();toast('🔄 동기화 중…');try{await flush();await reloadAll();toast(outbox.length?'일부는 아직 대기 중이에요':'✅ 최신 상태예요')}catch(e){toast('동기화하지 못했어요. 잠시 후 다시 시도해 주세요')}}
function pullServerAsk(){sheet(`<div class="mid">서버 내용으로 다시 불러올까요?</div><div class="sub" style="margin:6px 0 12px">${outbox.length?`아직 서버로 보내지 못한 ${outbox.length}건이 사라져요. `:''}이 기기의 현재 내용은 임시 저장본에 남겨 둘게요.</div><div class="row"><button class="btn g grow" data-a="close">취소</button><button class="btn grow" data-a="pullServerGo">불러오기</button></div>`)}

function pushServerAsk(){sheet(`<div class="mid">이 기기 내용으로 서버를 덮어쓸까요?</div><div class="sub" style="margin:6px 0 12px">다른 기기에서 바꾼 내용은 사라져요. 덮어쓰기 직전의 서버 내용은 백업으로 남겨 둘게요.</div><div class="row"><button class="btn g grow" data-a="close">취소</button><button class="btn r grow" data-a="pushServerGo">덮어쓰기</button></div>`)}
async function pushServerGo(){close();toast('⬆️ 올리는 중…');
 try{await writeBackup('pre-overwrite-'+Date.now(),{...serverCopy,deleted:deletedIds})}catch(e){}
 guard={};let n=0;
 for(const c of COLS){const have=new Set(S[c].map(x=>x.id));
  S[c].forEach(o=>{o._m=Date.now()+1;enqueue({k:'set',col:c,id:o.id,data:clean(o),m:o._m});n++});
  (serverCopy[c]||[]).forEach(o=>{if(!have.has(o.id))enqueue({k:'del',col:c,id:o.id,m:Date.now()})})}
 cacheSave();syncUI();toast(n+'건을 서버에 올리는 중이에요')}
function guardAccept(){close();guard={};COLS.forEach(c=>{if(!(serverCopy[c]||[]).length&&!outbox.some(o=>o.col===c))S[c]=[]});cacheSave();render();syncUI()}
/* 백업에 있는데 지금은 없는 것만 다시 넣기 (직접 지운 항목은 제외, 지우는 동작 없음) */
function missingFrom(o,apply){
 const found=[];
 COLS.forEach(c=>{const have=new Set(S[c].map(x=>x.id));
  (o[c]||[]).forEach(x=>{if(!x||!x.id||have.has(x.id)||deletedIds[x.id]!==undefined)return;
   found.push((x.date?x.date.slice(5)+' ':'')+(x.name||x.memo||x.cat||x.text&&'조언'||x.id)+(x.amt?' '+W(x.amt):x.value?' '+W(x.value):''));
   if(apply)put(c,{...x})})});
 return found;
}
let RST=[];
async function restoreOpen(){
 sheet(`<div class="mid">🕘 백업에서 빠진 것 되살리기</div><div class="sub" id="rst_st" style="margin:6px 0">🔄 백업 목록을 불러오는 중…</div><div id="rst_l"></div><div class="row" style="margin-top:10px"><button class="btn g grow" data-a="close">닫기</button></div>`);
 const cands=[],td=today();
 loadLocalSnaps().reverse().forEach(x=>cands.push({label:'이 기기 임시 저장 '+new Date(x.t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}),local:x.s,t:x.t}));
 for(let i=0;i<14;i++){const d=new Date(td);d.setDate(d.getDate()-i);cands.push({label:`${d.getMonth()+1}/${d.getDate()} 하루 마지막 저장`,id:ymd(d)})}
 for(let i=0;i<3;i++){const d=new Date(td);d.setDate(d.getDate()-i);[21,18,15,12,9,6,3,0].forEach(hh=>cands.push({label:`${d.getMonth()+1}/${d.getDate()} ${hh}시 이후 첫 저장 직전`,id:'pre-'+ymd(d)+'-'+pad(hh)}))}
 const rows=[];
 await Promise.all(cands.map(async c=>{try{let o,t=c.t;if(c.local)o=JSON.parse(c.local);else if(db){const b=await readBackup(c.id);if(!b)return;o=b.o;t=b.t}if(!o)return;const f=missingFrom(o,false);rows.push({c,o,f,t:t||0})}catch(e){}}));
 rows.sort((a,b)=>b.t-a.t);RST=rows.filter(r=>r.f.length);
 const st=document.getElementById('rst_st');if(!st)return;
 st.textContent=`백업 ${rows.length}개를 확인했어요. `+(RST.length?`되살릴 항목이 있는 백업 ${RST.length}개:`:'지금 내용에 없는 항목이 든 백업은 없어요 👍');
 document.getElementById('rst_l').innerHTML=RST.map((r,i)=>`<div class="item"><div class="grow">${esc(r.c.label)}</div><span class="sub">${r.f.length}개</span><button class="btn sm" data-a="restoreView" data-id="${i}">확인</button></div>`).join('');
}
function restoreView(i){const r=RST[+i];sheet(`<div class="mid">${esc(r.c.label)} → ${r.f.length}개 다시 넣기</div><div class="sub" style="margin:4px 0">지금 내용에 추가만 해요. 지우는 건 없어요.</div><div style="max-height:40vh;overflow:auto;font-size:12px">${r.f.slice(0,60).map(x=>`<div class="item">${esc(x)}</div>`).join('')}${r.f.length>60?`<div class="sub">…외 ${r.f.length-60}개</div>`:''}</div><div class="row" style="margin-top:10px"><button class="btn g grow" data-a="restoreOpen">뒤로</button><button class="btn grow" data-a="restoreGo" data-id="${i}">추가</button></div>`)}
function restoreGo(i){takeLocalSnapForce();const n=missingFrom(RST[+i].o,true).length;close();toast('✅ '+n+'개를 다시 넣었어요')}
