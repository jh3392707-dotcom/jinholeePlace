<title>진호 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 한 손 조작용 하단 탭 + 컴팩트 카드. 다크 기본, 라이트 대응 */
:root{--bg:#111114;--card:#1b1b20;--card2:#24242b;--tx:#f2f2f5;--sub:#8b8b96;--line:#2a2a31;--blue:#4c8dff;--red:#ff5a6a;--redbg:#3a2024;--green:#2fb67c;--amber:#c98a3a;--nav:#16161a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f6;--card:#fff;--card2:#ececf1;--tx:#17171c;--sub:#6b6b78;--line:#e3e3ea;--blue:#2f6fe0;--red:#d93a4c;--redbg:#fde6e9;--green:#1a9a66;--amber:#b8741c;--nav:#fafafc;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f3f6;--card:#fff;--card2:#ececf1;--tx:#17171c;--sub:#6b6b78;--line:#e3e3ea;--blue:#2f6fe0;--red:#d93a4c;--redbg:#fde6e9;--green:#1a9a66;--amber:#b8741c;--nav:#fafafc;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 130px}
#app{max-width:560px;margin:0 auto}
h2{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.sub{color:var(--sub);font-size:11px}.big{font-size:20px;font-weight:700}.mid{font-size:15px;font-weight:700}
.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--card2)}.bar i{display:block;height:100%}
.pbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4c8dff,#9b6bff)}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-weight:600;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--blue);border:0;border-radius:8px;padding:6px 12px;font-weight:600;color:#fff;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--redbg);color:var(--red)}.btn.sm{padding:3px 8px;font-size:11px}.btn:disabled{opacity:.5}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.nav div{flex:1;text-align:center;padding:7px 0 6px;color:var(--sub);font-size:10px;cursor:pointer}.nav div b{display:block;font-size:17px;font-weight:400}.nav .on{color:var(--tx);font-weight:700}
.fab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--blue);border:0;font-size:24px;color:#fff;box-shadow:0 4px 14px #0006;z-index:6;cursor:pointer}
.mnav{display:flex;justify-content:center;align-items:center;gap:16px;font-weight:700;font-size:14px;margin-bottom:8px}.mnav span{padding:2px 10px;color:var(--sub);font-size:16px;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet label{display:block;font-size:11px;color:var(--sub);margin:8px 0 3px}
.sheet input,.sheet select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:2px}.seg div{flex:1;text-align:center;padding:6px;border-radius:6px;color:var(--sub);font-weight:600;cursor:pointer}.seg .on{background:var(--blue);color:#fff}
.goal{border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.goal .img{height:170px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;background-color:#10131f}
.goal .img svg{position:absolute;inset:0;width:100%;height:100%}
.goal .img:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}
.goal .img>div{position:relative;z-index:1;padding:10px 12px;width:100%;color:#fff}
.pct{font-size:32px;font-weight:800;line-height:1.1}
.chips{display:flex;gap:6px;overflow:auto;margin-top:8px}.chips span{background:var(--card2);padding:3px 9px;border-radius:12px;white-space:nowrap;color:var(--sub);font-size:11px}
.tl{display:grid;grid-template-columns:repeat(31,1fr);gap:1px;margin:4px 0}.tl i{height:14px;border-radius:2px;background:var(--card2);font-style:normal;font-size:8px;text-align:center;color:var(--sub)}.tl i.m{background:var(--amber);color:#fff}.tl i.t{outline:1px solid var(--blue)}
textarea{width:100%;height:130px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.5 monospace;resize:vertical}
.paid{opacity:.5}.tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--card2);color:var(--sub);font-weight:600}.tag.hot{background:var(--red);color:#fff}.tag.warn{background:var(--amber);color:#fff}
.alert{background:var(--redbg);border:1px solid var(--red);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.advice{white-space:pre-wrap;font-size:12.5px;line-height:1.6}
.sync{font-size:10px;color:var(--sub);text-align:right;margin-bottom:4px}.sync.bad{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:20;font-weight:600}
.t{fill:var(--sub)}.gl{stroke:var(--line)}
</style>
<div id="app"></div>
<button class="fab" id="fab" aria-label="내역 추가">＋</button>
<div class="nav" id="nav"></div>
<script>
const OUT=[['선물','🎁','#3b82f6'],['취미·여가','🎮','#1f8a5f'],['이체','💸','#9a6424'],['식비','🍚','#e0645a'],['카페·간식','☕','#b08968'],['보험·세금·기타금융','🧾','#8b7fd6'],['교통·자동차','🚌','#4aa8c9'],['쇼핑','🛍️','#d96fa5'],['편의점·마트·잡화','🏪','#c9b24a'],['의료·건강·피트니스','💊','#59b86d'],['주거·통신','🏠','#6d8bb8'],['기타','📦','#7d7d88']];
const IN=[['급여','💼'],['부수입','🧩'],['용돈','🎀'],['이자·배당','🌱'],['환급·기타','💰']];
const ATYPE=[['현금','💵','#2fb67c'],['통장','🏦','#4c8dff'],['주식','📈','#ff8a4c'],['환테크','💱','#c07af0'],['코인','🪙','#f2c230'],['네이버 애드포스트','💚','#03c75a'],['레뷰포인트','🎟️','#ff6b6b']];
const INK=[['월배당','📈',true,'이자·배당'],['급여','💼',false,'급여'],['애드포스트','💚',true,'부수입'],['레뷰','🎟️',false,'부수입'],['기타수입','💰',false,'환급·기타']];
const CUR=[['USD',1400],['JPY',9.3],['EUR',1500],['CNY',195],['GBP',1750]];
const ocat=n=>OUT.find(x=>x[0]===n)||OUT[OUT.length-1];
const COLS=['tx','assets','fixed','goals','advice','income','settings'];
const S={tx:[],assets:[],fixed:[],goals:[],advice:[],income:[],settings:[],seeded:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const W=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const big=n=>{const a=Math.abs(n);return a>=1e8?(n/1e8).toFixed(2).replace(/\.?0+$/,'')+'억':a>=1e4?Math.round(n/1e4).toLocaleString()+'만':Math.round(n).toLocaleString()};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DOW='일월화수목금토';
let tab='home',cur=ym(today()),openCat=null,txType='out',mode='connecting',db=null,assetsCap=null,dlCap=null,sampleCap=null,pending=0,lastErr='';

/* ---------- 저장/동기화 ---------- */
const CK='gagyebu_cache_v2';
function cacheSave(){try{localStorage.setItem(CK,JSON.stringify({tx:S.tx,assets:S.assets,fixed:S.fixed,goals:S.goals,advice:S.advice,income:S.income,settings:S.settings,seeded:S.seeded}))}catch(e){}}
function cacheLoad(){try{const c=JSON.parse(localStorage.getItem(CK));if(c)COLS.forEach(k=>S[k]=c[k]||[]),S.seeded=c.seeded}catch(e){}}
const clean=o=>{const r={};for(const k in o)if(o[k]!==undefined&&k!=='id')r[k]=o[k];return r};
async function put(col,o){
 if(!o.id)o.id=uid();
 const i=S[col].findIndex(x=>x.id===o.id);i>=0?S[col][i]=o:S[col].push(o);cacheSave();render();
 if(mode!=='cloud')return;
 pending++;syncUI();
 try{await db.collection(col).doc(o.id).set(clean(o));lastErr=''}catch(e){lastErr=(e&&e.code)||'error';toast('저장 실패: '+lastErr)}
 pending--;syncUI();
}
async function del(col,id){
 S[col]=S[col].filter(x=>x.id!==id);cacheSave();render();
 if(mode!=='cloud')return;
 pending++;syncUI();
 try{await db.collection(col).doc(id).delete();lastErr=''}catch(e){lastErr=(e&&e.code)||'error';toast('삭제 실패: '+lastErr)}
 pending--;syncUI();
}
function syncUI(){const e=$('#sync');if(!e)return;
 e.className='sync'+(mode==='local'||lastErr?' bad':'');
 e.textContent=mode==='cloud'?(lastErr?'⚠️ 동기화 오류: '+lastErr:pending?'⏳ 저장 중…':'☁️ 동기화됨 (폰·PC 공통)'):mode==='local'?'⚠️ 이 기기에만 저장 중 (claude.ai 로그인 후 열면 동기화)':'⏳ 연결 중…'}
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2600)}
let rq;function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)}
async function init(){
 cacheLoad();draw();
 let c=null;try{c=await claude.use('db')}catch(e){}
 try{assetsCap=await claude.use('assets')}catch(e){}
 try{dlCap=await claude.use('downloads')}catch(e){}
 try{sampleCap=await claude.use('sample')}catch(e){}
 if(!c){mode='local';await seedLocal();draw();return}
 db=c;mode='cloud';syncUI();
 const first={};let timer=setTimeout(()=>{if(Object.keys(first).length<COLS.length+1){lastErr='연결 지연(캐시 표시 중)';syncUI()}},10000);
 const got=k=>{first[k]=1;if(Object.keys(first).length===COLS.length+1){clearTimeout(timer);if(lastErr.startsWith('연결')){lastErr='';syncUI()}}};
 COLS.forEach(col=>db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)got(col);cacheSave();render();if(col==='goals'&&!s.metadata.fromCache)seedCloud()},e=>{lastErr=(e&&e.code)||'error';syncUI()}));
 db.doc('meta/state').onSnapshot(s=>{S.seeded=s.exists?s.data():null;if(!s.metadata.fromCache)got('meta');seedCloud()},e=>{});
}
const SEED=[{id:'g_apt',name:'서울 34평 아파트',emoji:'🏢',kind:'apt',target:1500000000,img:''},{id:'g_camaro',name:'쉐보레 카마로 컨버터블',emoji:'🏎️',kind:'car',target:75000000,img:''}];
let seeding=false;
async function seedCloud(){if(seeding||S.seeded||mode!=='cloud')return;if(S.goals.length){return}seeding=true;
 try{const m=await db.doc('meta/state').get();if(!m.exists){for(const g of SEED)await db.collection('goals').doc(g.id).set(clean(g));await db.doc('meta/state').set({seeded:true})}}catch(e){}seeding=false}
async function seedLocal(){if(!S.goals.length&&!S.seeded){S.goals=SEED.map(g=>({...g}));S.seeded={seeded:true};cacheSave()}}

/* ---------- 계산 ---------- */
const val=a=>a.amt!=null&&a.rate!=null?a.amt*a.rate:(a.value||0);
const totals=()=>{let as=0;S.assets.forEach(a=>as+=val(a));return{as,net:as}};
const monthTx=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(l,ty)=>l.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const shiftM=(m,d)=>{const[y,mm]=m.split('-').map(Number);return ym(new Date(y,mm-1+d,1))};
const catSum=l=>{const o={};l.filter(t=>t.type==='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const nextDue=day=>{const t=today();let y=t.getFullYear(),m=t.getMonth();let d=new Date(y,m,Math.min(day,dim(y,m)));if(d<t){m++;d=new Date(y,m,Math.min(day,dim(y,m)))}return d};
const dday=d=>Math.round((d-today())/864e5);
const fixedPaid=(f,m)=>f.paid&&f.paid[m];
const dueSoon=()=>{const m=ym(today());return S.fixed.map(f=>({f,d:nextDue(f.day)})).filter(x=>dday(x.d)<=3&&!(dday(x.d)>=0&&fixedPaid(x.f,m)&&x.d.getMonth()===today().getMonth())).sort((a,b)=>a.d-b.d)};

/* ---------- 화면 ---------- */
function draw(){
 $('#nav').innerHTML=[['home','🏠','자산'],['tx','📒','내역'],['fixed','📅','고정지출'],['income','💰','수입·FIRE'],['goal','🎯','목표'],['report','📊','리포트']].map(([k,i,n])=>`<div class="${tab===k?'on':''}" data-tab="${k}"><b>${i}</b>${n}</div>`).join('');
 $('#app').innerHTML=`<div class="sync" id="sync"></div>`+{home:vHome,tx:vTx,fixed:vFixed,income:vIncome,goal:vGoal,report:vReport}[tab]();syncUI();
}
const stack=items=>{const t=items.reduce((s,x)=>s+x[0],0)||1;return `<div class="bar">${items.filter(x=>x[0]>0).map(x=>`<i style="width:${x[0]/t*100}%;background:${x[1]}"></i>`).join('')}</div>`};
function dueBanner(){const l=dueSoon();if(!l.length)return '';
 return `<div class="alert"><b class="red">🔔 이체일 임박</b>${l.map(({f,d})=>{const dd=dday(d);return `<div class="row sp" style="margin-top:3px"><span>${esc(f.name)} <span class="tag hot">${dd===0?'오늘':dd<0?'지남':'D-'+dd}</span> <span class="sub">${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})</span></span><b class="num">${W(f.amt)}</b></div>`}).join('')}</div>`}
function vHome(){
 const T=totals(),m=ym(today()),L=monthTx(m);
 const groups=ATYPE.map(([n,ic,c])=>({n,ic,c,l:S.assets.filter(a=>a.type===n)})).filter(g=>g.l.length);
 return `${dueBanner()}
 <div class="card"><div class="sub">내 자산 합계</div><div class="big">${W(T.net)}</div>
 <div style="margin:8px 0 0">${stack(ATYPE.map(([n,,c])=>[S.assets.filter(a=>a.type===n).reduce((s,a)=>s+val(a),0),c]))}</div>
 <div class="chips">${ATYPE.map(([n,,c])=>{const v=S.assets.filter(a=>a.type===n).reduce((s,a)=>s+val(a),0);return v?`<span><b class="dot" style="display:inline-block;background:${c};margin-right:4px"></b>${n} ${Math.round(v/T.as*100)}%</span>`:''}).join('')}</div></div>
 <div class="grid2"><div class="card"><div class="sub">${+m.slice(5)}월 지출</div><div class="mid red">${W(sum(L,'out'))}</div></div><div class="card"><div class="sub">${+m.slice(5)}월 수입</div><div class="mid blue">${W(sum(L,'in'))}</div></div></div>
 ${fireMini()}
 <h2>내 자산 <button class="btn sm" data-a="assetForm">＋ 추가</button></h2>
 ${groups.map(g=>`<div class="card"><div class="row sp sub"><span>${g.ic} ${g.n}</span><span class="num">${W(g.l.reduce((s,a)=>s+val(a),0))}</span></div>${g.l.map(a=>`<div class="item" data-a="assetForm" data-id="${a.id}"><div class="grow ell">${esc(a.name)}${a.amt!=null&&a.rate!=null?`<div class="sub">${esc(a.cur||'')} ${a.amt.toLocaleString()} × ${a.rate.toLocaleString()}원</div>`:''}</div><div class="num">${W(val(a))}</div></div>`).join('')}</div>`).join('')||'<div class="card sub">주식·환테크·코인·현금·통장·애드포스트·레뷰포인트를 ＋ 추가로 입력하세요. 직접 입력한 값이 폰과 PC에 동기화돼요.</div>'}
 <h2>목표 진행</h2>${S.goals.map(g=>goalMini(g,T.net)).join('')}`;
}
const goalMini=(g,net)=>{const p=Math.max(0,Math.min(100,net/g.target*100));return `<div class="card" data-tab="goal"><div class="row sp"><span>${g.emoji} ${esc(g.name)}</span><b>${p.toFixed(1)}%</b></div><div class="pbar" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`};

function spark(m){
 const pm=shiftM(m,-1),[y,mm]=m.split('-').map(Number),n=dim(y,mm-1);
 const cum=mo=>{const a=Array(n+1).fill(0);monthTx(mo).filter(t=>t.type==='out').forEach(t=>a[Math.min(+t.date.slice(8),n)]+=t.amt);for(let i=1;i<=n;i++)a[i]+=a[i-1];return a};
 const a=cum(m),b=cum(pm),mx=Math.max(a[n],b[n],1),last=m===ym(today())?today().getDate():n;
 const pts=(arr,to)=>arr.slice(1,to+1).map((v,i)=>`${(i/(n-1)*100).toFixed(1)},${(36-v/mx*34).toFixed(1)}`).join(' ');
 return `<svg viewBox="0 0 100 38" preserveAspectRatio="none" style="width:110px;height:44px"><polyline points="${pts(b,n)}" fill="none" stroke="#777" stroke-width="1.5" vector-effect="non-scaling-stroke"/><polyline points="${pts(a,last)}" fill="none" stroke="#ff5a6a" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function vTx(){
 const L=monthTx(cur),o=sum(L,'out'),i=sum(L,'in'),po=sum(monthTx(shiftM(cur,-1)),'out'),diff=o-po;
 const cs=catSum(L),fx=S.fixed.reduce((s,f)=>s+f.amt,0);
 const days=[...new Set(L.map(t=>t.date))].sort().reverse();
 return `<div class="mnav"><span data-a="mshift" data-d="-1">◀</span>${+cur.slice(5)}월 <small class="sub">${cur.slice(0,4)}</small><span data-a="mshift" data-d="1">▶</span></div>
 <div class="grid2"><div><div class="sub">지출</div><div class="big">${W(o)}</div></div><div><div class="sub">수입</div><div class="big">${W(i)}</div></div></div>
